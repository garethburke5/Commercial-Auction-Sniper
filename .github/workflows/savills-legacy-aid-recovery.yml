name: Savills Legacy Aid Recovery

on:
  workflow_dispatch:
  schedule:
    - cron: '41 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/savills-legacy-aid-recovery.yml'
      - 'savills_legacy_pid_wayback_recovery.py'
      - 'savills_legacy_exact_parallel_recovery.py'
      - 'savills_legacy_aid_capture_recovery.py'
      - 'savills_legacy_aid_exact_recovery.py'

permissions:
  contents: write

concurrency:
  group: auction-sniper-production-scan
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile focused recovery code
        run: |
          python -m py_compile savills_legacy_pid_wayback_recovery.py savills_legacy_aid_capture_recovery.py savills_archival_url_discovery.py collectors/savills.py history_database.py

      - name: Record baseline
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          db=json.loads(Path('data/property_history.json').read_text(encoding='utf-8'))
          p=json.loads(Path('data/historical_backfill_progress.json').read_text(encoding='utf-8'))
          n=sum(1 for e in (db.get('auction_events') or []) if e.get('source')=='Savills Auctions')
          s=(p.get('sources') or {}).get('Savills Auctions') or {}
          Path('/tmp/savills-baseline.json').write_text(json.dumps({'events':n,'earliest':s.get('earliest_date_reached')}))
          print('BASELINE',n,s.get('earliest_date_reached'))
          PY

      - name: Recover known legacy lot IDs through independent Wayback archive
        id: wayback
        continue-on-error: true
        run: timeout 700s python savills_legacy_pid_wayback_recovery.py --max-pids 80 --max-live-checks 120

      - name: Persist unexpected runtime blocker
        if: steps.wayback.outcome != 'success'
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          path=Path('data/historical_backfill_progress.json')
          p=json.loads(path.read_text(encoding='utf-8'))
          s=p.setdefault('sources',{}).setdefault('Savills Auctions',{})
          now=datetime.now(timezone.utc).isoformat()
          s['status']='LIVE ARCHIVE BLOCKED'
          s['historically_complete']=False
          s['legacy_pid_wayback_runtime_blocker']={
              'at':now,
              'route':'wayback-cdx-exact-legacy-pid-to-live-savills',
              'message':'Independent Wayback exact-pid recovery failed at runtime. The already-persisted Common Crawl 2019 outage is intentionally not being re-probed in this invocation.',
              'next_safe_route':'Use surviving Savills first-party archive dates plus public search-engine indexed snippets/PDF catalogue references to map the already-known legacy aid/pid IDs; validate every lot on the surviving Savills first-party page before persistence.'
          }
          p['updated_at']=now
          path.write_text(json.dumps(p,indent=2,ensure_ascii=False),encoding='utf-8')
          PY

      - name: Validate strict outcome
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse
          b=json.loads(Path('/tmp/savills-baseline.json').read_text())
          db=json.loads(Path('data/property_history.json').read_text(encoding='utf-8'))
          p=json.loads(Path('data/historical_backfill_progress.json').read_text(encoding='utf-8'))
          events=[e for e in (db.get('auction_events') or []) if e.get('source')=='Savills Auctions']
          s=(p.get('sources') or {}).get('Savills Auctions') or {}
          assert events
          bad=[]
          for e in events:
              u=(e.get('source_evidence') or {}).get('listing_url') or ''
              parsed=urlparse(u)
              host=(parsed.hostname or '').lower()
              if parsed.scheme!='https' or not (host=='savills.co.uk' or host.endswith('.savills.co.uk')):
                  bad.append(u)
          assert not bad, f'{len(bad)} Savills events lack first-party exact evidence'
          advanced=len(events)>int(b['events']) or (s.get('earliest_date_reached') and (not b.get('earliest') or s.get('earliest_date_reached') < b.get('earliest')))
          blocker=(s.get('legacy_pid_wayback_last_blocker') or s.get('legacy_pid_wayback_runtime_blocker'))
          assert advanced or blocker, 'Strict run outcome violated: neither older events nor a concrete new blocker was persisted'
          if not advanced:
              assert blocker.get('next_safe_route'), 'Persisted blocker lacks next safe route'
          print('STRICT_OUTCOME',{'advanced':advanced,'events_before':b['events'],'events_after':len(events),'earliest_before':b.get('earliest'),'earliest_after':s.get('earliest_date_reached'),'blocker':blocker if not advanced else None})
          PY

      - name: Publish canonical history and progress
        run: |
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/property_history.json data/historical_backfill_progress.json
          if ! git diff --cached --quiet; then
            git commit -m 'Advance Wayback Savills pid frontier recovery'
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                exit 1
              fi
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
