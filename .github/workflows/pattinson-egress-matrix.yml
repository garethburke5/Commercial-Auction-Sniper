name: Pattinson Free Egress Matrix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pattinson-egress-matrix.yml'

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Probe Pattinson public endpoints
        shell: bash
        run: |
          python - <<'PY'
          import requests
          urls = [
              'https://www.pattinson.co.uk/auction/property-search?IncludeCommercialProperties=true&OnlineOnly=true&PropertySort=EndingSoonest&PageSize=100&p=1',
              'https://www.pattinson.co.uk/api/property/510023/particulars',
              'https://addisonbarton.pattinson.co.uk/?IncludeCommercialProperties=true&OnlineOnly=true',
              'https://propertymatters.pattinson.co.uk/?IncludeCommercialProperties=true&OnlineOnly=true',
              'https://roof.pattinson.co.uk/?IncludeCommercialProperties=true&OnlineOnly=true',
          ]
          ok = False
          for url in urls:
              try:
                  r = requests.get(url, headers={'User-Agent':'Mozilla/5.0'}, timeout=20)
                  challenge = 'Just a moment' in r.text or 'cf-chl-' in r.text
                  print('PROBE', r.status_code, len(r.content), 'challenge='+str(challenge), url)
                  if r.status_code == 200 and not challenge and len(r.content) > 1000:
                      ok = True
              except Exception as exc:
                  print('ERROR', type(exc).__name__, url, exc)
          if not ok:
              raise SystemExit('No free Pattinson route succeeded from this GitHub-hosted OS')
          PY
