name: Apply inline filters
on:
  workflow_dispatch:
  push:
    branches: [inline-filter-panel]
    paths:
      - apply_inline_filters.py
      - .github/workflows/apply-inline-filters.yml
jobs:
  patch-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: inline-filter-panel
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install streamlit requests beautifulsoup4 lxml pypdf python-docx openpyxl
      - name: Apply patch
        run: python apply_inline_filters.py
      - name: Compile
        run: python -m py_compile app.py
      - name: Verify nonblocking filters
        run: |
          grep -q 'st.expander("🔎 Refine properties"' app.py
          grep -q 'filter_area_query' app.py
          ! grep -q 'with st.popover("Refine properties"' app.py
          grep -q 'V6.67-INLINE-FILTERS' app.py
      - name: Commit app
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add app.py
          git diff --cached --quiet || git commit -m "Replace blocking filter popover with inline panel"
          git push origin HEAD:inline-filter-panel
