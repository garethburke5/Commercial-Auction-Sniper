name: Measure app startup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/measure-app-startup.yml'
  workflow_dispatch:

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Measure Streamlit app execution
        run: |
          python - <<'PY'
          import time
          from streamlit.testing.v1 import AppTest
          t0=time.perf_counter()
          at=AppTest.from_file('app.py')
          t1=time.perf_counter()
          at.run(timeout=120)
          t2=time.perf_counter()
          print(f'APPTTEST_CREATE_SECONDS={t1-t0:.3f}')
          print(f'APPTTEST_RUN_SECONDS={t2-t1:.3f}')
          print(f'APPTTEST_TOTAL_SECONDS={t2-t0:.3f}')
          if at.exception:
              print('EXCEPTIONS:', at.exception)
              raise SystemExit(1)
          PY
