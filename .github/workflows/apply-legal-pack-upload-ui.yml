name: Apply legal pack upload UI
on:
  workflow_dispatch:
  push:
    branches: [legal-pack-upload-ui]
    paths:
      - apply_legal_pack_upload_ui.py
      - .github/workflows/apply-legal-pack-upload-ui.yml
jobs:
  patch-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: legal-pack-upload-ui
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install streamlit requests beautifulsoup4 lxml pypdf python-docx openpyxl pytest
      - name: Apply upload UI patch
        run: python apply_legal_pack_upload_ui.py
      - name: Compile app and due-diligence backend
        run: python -m py_compile app.py legal_pack_engine.py legal_pack_ingest.py legal_pack_report.py legal_pack_service.py
      - name: Run legal backend tests
        run: PYTHONPATH=. python -m pytest -q tests/test_legal_pack_engine.py tests/test_legal_pack_ingest.py tests/test_legal_pack_report.py tests/test_legal_pack_service.py tests/test_legal_evidence_provenance.py
      - name: Verify provider-independent UI
        run: |
          grep -q 'from legal_pack_service import analyse_uploaded_pack' app.py
          grep -q 'file_uploader' app.py
          grep -q 'Run Buyer Due Diligence' app.py
          ! grep -q 'from eig_client import EIGClient' app.py
          ! grep -q '_eig_manifest_on_demand' app.py
      - name: Commit generated app
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add app.py
          git diff --cached --quiet || git commit -m "Add provider-independent legal pack upload analysis"
          git push origin HEAD:legal-pack-upload-ui
