name: Apply V6.29 readability UI

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_v629_readability_ui.py'
      - '.github/workflows/apply-v629.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply readability patch
        run: python scripts/apply_v629_readability_ui.py
      - name: Verify app
        run: python -m py_compile app.py
      - name: Commit production UI
        run: |
          git config user.name 'Auction Sniper Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app.py
          git diff --cached --quiet && exit 0
          git commit -m 'Release V6.29 readability UI'
          git pull --rebase origin main
          git push origin main
