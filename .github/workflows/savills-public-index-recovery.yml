name: Savills Public Index Address Recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'savills_public_index_address_recovery.py'
      - '.github/workflows/savills-public-index-recovery.yml'
  schedule:
    - cron: '32 * * * *'

permissions:
  contents: write

concurrency:
  group: savills-deep-history-public-index
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install collector dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install chromium
      - name: Compile recovery path
        run: python -m py_compile savills_public_index_address_recovery.py history_database.py collectors/savills.py
      - name: Recover oldest unresolved Savills dates from public index references
        run: python savills_public_index_address_recovery.py --max-dates 2 --max-terms 30 --max-candidates 120
      - name: Validate canonical and progress files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/historical_backfill_progress.json').read_text())
          h=json.loads(Path('data/property_history.json').read_text())
          s=(p.get('sources') or {}).get('Savills Auctions') or {}
          assert s.get('historically_complete') is False
          assert s.get('public_index_address_last_run'), 'public-index recovery did not persist run evidence'
          assert s.get('public_index_address_last_diagnostic'), 'public-index recovery diagnostic missing'
          assert Path(s['public_index_address_last_diagnostic']).exists(), 'diagnostic path missing'
          events=[e for e in h.get('auction_events',[]) if e.get('source')=='Savills Auctions']
          assert events, 'canonical Savills history unexpectedly empty'
          added=int((s.get('public_index_address_last_run') or {}).get('canonical_events_added') or 0)
          if added == 0:
              b=s.get('public_index_address_last_blocker') or {}
              assert b.get('target_date'), 'zero-event run missing exact target-date blocker'
              assert b.get('exact_route'), 'zero-event run missing exact failed route'
              assert b.get('next_safe_route'), 'zero-event run missing next safe route'
          print('SAVILLS_EVENTS',len(events))
          print('EARLIEST_VERIFIED',s.get('earliest_date_reached'))
          print('PUBLIC_INDEX_EVENTS_ADDED',added)
          print('STATUS',s.get('status'))
          PY
      - name: Persist canonical events or exact blocker
        run: |
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/property_history.json data/historical_backfill_progress.json data/source_diagnostics
          if ! git diff --cached --quiet; then
            git commit -m 'Advance Savills public-index recovery frontier'
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
