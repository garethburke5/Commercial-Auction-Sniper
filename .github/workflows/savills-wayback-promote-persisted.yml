name: Savills Promote Persisted Wayback Lots
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/savills-wayback-promote-persisted.yml'
permissions:
  contents: write
concurrency:
  group: savills-wayback-promotion
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate promotion code
        run: python -m py_compile savills_wayback_auc675_promote.py history_database.py
      - name: Promote persisted first-party lot evidence
        run: python savills_wayback_auc675_promote.py
      - name: Verify canonical state before publish
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path('data/property_history.json').read_text())
          p=json.loads(Path('data/historical_backfill_progress.json').read_text())
          s=p['sources']['Savills Auctions']; d=s['savills_wayback_auc675_promotion_last_run']
          count=sum(1 for e in h.get('auction_events',[]) if e.get('source')=='Savills Auctions')
          print('SAVILLS_EVENTS',count)
          print('EARLIEST_VERIFIED',s.get('earliest_date_reached'))
          print('ADDED',d.get('canonical_events_added'),'VALIDATED',d.get('validated_rows'))
          assert count == d['canonical_events_after']
          assert s.get('historically_complete') is False
          assert s.get('discovery_exhausted') is False
          PY
      - name: Preserve generated files
        run: |
          cp data/property_history.json /tmp/savills_history.json
          cp data/historical_backfill_progress.json /tmp/savills_progress.json
          cp data/source_diagnostics/savills_wayback_auc675_promotion.json /tmp/savills_promotion.json
      - name: Conflict-safe publish
        run: |
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/savills_history.json data/property_history.json
            cp /tmp/savills_progress.json data/historical_backfill_progress.json
            cp /tmp/savills_promotion.json data/source_diagnostics/savills_wayback_auc675_promotion.json
            git add data/property_history.json data/historical_backfill_progress.json data/source_diagnostics/savills_wayback_auc675_promotion.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Persist validated Savills May 2010 events'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
