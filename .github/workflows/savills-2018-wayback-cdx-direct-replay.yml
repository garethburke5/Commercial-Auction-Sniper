name: Savills 2018 Wayback CDX Direct Replay

on:
  workflow_dispatch:
  push:
    paths:
      - 'savills_2018_wayback_cdx_direct_replay.py'
      - '.github/workflows/savills-2018-wayback-cdx-direct-replay.yml'

permissions:
  contents: write

concurrency:
  group: savills-2018-wayback-cdx-direct-replay
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pypdf fonttools
      - run: python -m py_compile savills_2018_wayback_cdx_direct_replay.py
      - name: Execute direct CDX timestamp/original replay
        run: python savills_2018_wayback_cdx_direct_replay.py
      - name: Persist result onto freshest production main
        shell: bash
        run: |
          set -euo pipefail
          cp data/source_diagnostics/savills_2018_wayback_cdx_direct_replay.json /tmp/diag.json
          cp data/property_history.json /tmp/history.json
          cp data/historical_backfill_progress.json /tmp/progress.json
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/diag.json data/source_diagnostics/savills_2018_wayback_cdx_direct_replay.json
            cp /tmp/history.json data/property_history.json
            cp /tmp/progress.json data/historical_backfill_progress.json
            git add data/source_diagnostics/savills_2018_wayback_cdx_direct_replay.json data/property_history.json data/historical_backfill_progress.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Persist Savills 2018 direct CDX replay recovery'
            if git push origin HEAD:main; then exit 0; fi
            git reset --hard HEAD~1
            sleep $((attempt*4))
          done
          exit 1

# trigger direct CDX replay after parse-fault repair
