name: Restore historical UTF-8 checkpoints

on:
  push:
    branches: [main]
    paths:
      - '.repair_history_checkpoints/**'
      - '.github/workflows/restore-history-checkpoints.yml'

permissions:
  contents: write

concurrency:
  group: restore-history-checkpoints
  cancel-in-progress: false

jobs:
  restore:
    if: "${{ startsWith(github.event.head_commit.message, 'Bank historical auction lot records: stage byte-exact checkpoint repair') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Reassemble and verify exact checkpoint bytes
        run: |
          python - <<'PY'
          import base64
          import json
          from pathlib import Path

          root = Path('.')
          targets = {
              root / 'data/auction_history/continuation_collection.json':
                  root / '.repair_history_checkpoints/continuation',
              root / 'data/auction_history/source_register.json':
                  root / '.repair_history_checkpoints/source_register',
          }
          for target, parts_dir in targets.items():
              payload = b''.join(
                  base64.b64decode(part.read_text(encoding='ascii'))
                  for part in sorted(parts_dir.glob('*.b64'))
              )
              json.loads(payload.decode('utf-8'))
              target.write_bytes(payload)

          test_target = root / 'tests/test_durrants_results.py'
          test_target.write_text(
              (root / '.repair_history_checkpoints/test_durrants_results.py').read_text(encoding='utf-8'),
              encoding='utf-8',
          )
          PY
          python -m pytest -q tests/test_durrants_results.py tests/test_history_continuation.py tests/test_history_source_register.py
      - name: Commit repaired checkpoints and remove transport parts
        run: |
          git config user.name 'Auction Geek History'
          git config user.email 'actions@users.noreply.github.com'
          git add data/auction_history/continuation_collection.json data/auction_history/source_register.json tests/test_durrants_results.py
          git rm -r .repair_history_checkpoints .github/workflows/restore-history-checkpoints.yml
          git commit -m 'Bank historical auction lot records: finalize byte-exact Durrants checkpoints'
          git push origin HEAD:main
