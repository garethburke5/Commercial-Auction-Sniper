name: Savills Aggregator Reference Recovery

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: savills-deep-history-aggregator-reference
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install collector dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install chromium
      - name: Compile aggregator-reference recovery
        run: python -m py_compile savills_aggregator_reference_recovery.py history_database.py collectors/savills.py
      - name: Recover next Savills frontier through historical auction references
        run: python savills_aggregator_reference_recovery.py --max-terms 35 --max-candidates 120
      - name: Validate acceptable outcome
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/historical_backfill_progress.json').read_text())
          h=json.loads(Path('data/property_history.json').read_text())
          s=(p.get('sources') or {}).get('Savills Auctions') or {}
          events=[e for e in h.get('auction_events',[]) if e.get('source')=='Savills Auctions']
          assert events, 'Savills canonical history unexpectedly empty'
          run=s.get('aggregator_reference_last_run') or {}
          assert run.get('target_date') and run.get('route'), 'aggregator-reference run evidence missing'
          added=int(run.get('canonical_events_added') or 0)
          if not added:
              b=s.get('aggregator_reference_last_blocker') or {}
              assert b.get('target_date') and b.get('route') and b.get('next_safe_route'), 'zero-event run lacks exact blocker/next route'
          assert s.get('historically_complete') is False
          print('SAVILLS_EVENTS',len(events))
          print('EARLIEST_VERIFIED',s.get('earliest_date_reached'))
          print('AGGREGATOR_EVENTS_ADDED',added)
          print('TARGET_DATE',run.get('target_date'))
          PY
      - name: Persist canonical events or exact blocker
        run: |
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/property_history.json data/historical_backfill_progress.json data/source_diagnostics
          if ! git diff --cached --quiet; then
            git commit -m 'Advance Savills aggregator-reference recovery frontier'
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
