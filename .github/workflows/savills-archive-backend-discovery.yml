name: Savills Archive Backend Discovery

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/savills-archive-backend-discovery.yml'
      - 'savills_archive_backend_discovery.py'

permissions:
  contents: write

concurrency:
  group: savills-archive-backend-discovery
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python -m py_compile savills_archive_backend_discovery.py
      - name: Inspect live archive backend surfaces
        run: python savills_archive_backend_discovery.py
      - name: Verify and preserve
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/source_diagnostics/savills_archive_backend_discovery.json').read_text())
          p=json.loads(Path('data/historical_backfill_progress.json').read_text())
          for k in ('archive_pages','pages_http_200','scripts_discovered','scripts_http_200','target_2018_date_contexts_found','candidate_backend_strings'):
              print(k.upper(),d.get(k))
          print('CANDIDATES',json.dumps(d.get('candidate_samples',[])[:100]))
          assert p['sources']['Savills Auctions'].get('historically_complete') is False
          PY
          cp data/historical_backfill_progress.json /tmp/progress.json
          cp data/source_diagnostics/savills_archive_backend_discovery.json /tmp/diag.json
      - name: Publish conflict-safe
        run: |
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/diag.json data/source_diagnostics/savills_archive_backend_discovery.json
            python - <<'PY'
          import json
          from pathlib import Path
          fp=Path('data/historical_backfill_progress.json')
          fresh=json.loads(fp.read_text()); rec=json.loads(Path('/tmp/progress.json').read_text())
          fs=fresh.setdefault('sources',{}).setdefault('Savills Auctions',{}); rs=rec['sources']['Savills Auctions']
          for k in ('savills_archive_backend_discovery_last_run','savills_archive_backend_discovery_last_blocker','last_discovery_mode'):
              if k in rs: fs[k]=rs[k]
          fs['historically_complete']=False; fs['discovery_exhausted']=False
          fresh['updated_at']=rec.get('updated_at',fresh.get('updated_at'))
          fp.write_text(json.dumps(fresh,indent=2,ensure_ascii=False))
          PY
            git add data/historical_backfill_progress.json data/source_diagnostics/savills_archive_backend_discovery.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Persist Savills archive backend discovery'
            if git push origin HEAD:main; then exit 0; fi
            git reset --hard HEAD~1
            sleep $((attempt*3))
          done
          exit 1
