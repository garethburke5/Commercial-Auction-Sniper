name: Savills Year Gap Recovery

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/savills-year-gap-recovery.yml'
      - 'savills_2018_first_party_detail_recovery.py'

permissions:
  contents: write

concurrency:
  group: savills-year-gap-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 lxml
      - name: Compile Savills detail recovery
        run: python -m py_compile savills_2018_first_party_detail_recovery.py
      - name: Recover 2018 lots from first-party Savills detail pages with archival fallback
        run: python savills_2018_first_party_detail_recovery.py
      - name: Verify generated state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path('data/property_history.json').read_text())
          p=json.loads(Path('data/historical_backfill_progress.json').read_text())
          q=json.loads(Path('data/source_diagnostics/savills_2018_first_party_detail_recovery.json').read_text())
          s=p['sources']['Savills Auctions']; z=s.get('savills_2018_detail_last_run') or {}
          count=sum(1 for e in h.get('auction_events',[]) if e.get('source')=='Savills Auctions')
          dates=sorted(str(e.get('auction_date')) for e in h.get('auction_events',[]) if e.get('source')=='Savills Auctions' and e.get('auction_date'))
          print('SAVILLS_EVENTS',count)
          print('OLDEST_VERIFIED',dates[0] if dates else None)
          print('2018_TARGET_CATALOGUES',z.get('target_catalogues'))
          print('2018_DETAIL_LINKS_FOUND',z.get('detail_links_found'))
          print('2018_COMMERCIAL_ROWS_RECOVERED',z.get('commercial_mixed_rows_recovered'))
          print('2018_CANONICAL_EVENTS_ADDED',z.get('canonical_events_added'))
          assert s.get('historically_complete') is False
          assert s.get('discovery_exhausted') is False
          assert z.get('route')=='savills-2018-manifest-aid-to-first-party-catalogue-detail-live-then-wayback'
          assert q.get('catalogue_runs') is not None
          PY
      - name: Preserve generated files
        run: |
          cp data/property_history.json /tmp/savills_history.json
          cp data/historical_backfill_progress.json /tmp/savills_progress.json
          cp data/source_diagnostics/savills_2018_first_party_detail_recovery.json /tmp/savills_2018_detail.json
      - name: Publish conflict-safe
        run: |
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/savills_history.json data/property_history.json
            cp /tmp/savills_2018_detail.json data/source_diagnostics/savills_2018_first_party_detail_recovery.json
            python - <<'PY'
          import json
          from pathlib import Path
          fp=Path('data/historical_backfill_progress.json')
          fresh=json.loads(fp.read_text())
          recovered=json.loads(Path('/tmp/savills_progress.json').read_text())
          fs=fresh.setdefault('sources',{}).setdefault('Savills Auctions',{})
          rs=recovered['sources']['Savills Auctions']
          for key in ('savills_2018_detail_last_run','savills_2018_detail_last_blocker','last_history_event_count','lots_captured','earliest_date_reached','earliest_month_reached','last_discovery_mode','status'):
              if key in rs: fs[key]=rs[key]
              elif key=='savills_2018_detail_last_blocker': fs.pop(key,None)
          fs['historically_complete']=False
          fs['discovery_exhausted']=False
          fresh['updated_at']=recovered.get('updated_at',fresh.get('updated_at'))
          fp.write_text(json.dumps(fresh,indent=2,ensure_ascii=False))
          PY
            git add data/property_history.json data/historical_backfill_progress.json data/source_diagnostics/savills_2018_first_party_detail_recovery.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Persist Savills 2018 first-party detail recovery'
            if git push origin HEAD:main; then exit 0; fi
            git reset --hard HEAD~1
            sleep $((attempt*3))
          done
          exit 1
