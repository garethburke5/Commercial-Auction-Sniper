name: Savills Year Gap Recovery

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/savills-year-gap-recovery.yml'
      - 'savills_first_party_host_archive_recovery.py'

permissions:
  contents: write

concurrency:
  group: savills-year-gap-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Compile first-party Savills archive route
        run: python -m py_compile savills_first_party_host_archive_recovery.py
      - name: Enumerate archived first-party Savills property pages
        run: python savills_first_party_host_archive_recovery.py
      - name: Verify generated state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path('data/property_history.json').read_text())
          p=json.loads(Path('data/historical_backfill_progress.json').read_text())
          s=p['sources']['Savills Auctions']; r=s.get('savills_year_gap_savills_host_last_run') or {}
          count=sum(1 for e in h.get('auction_events',[]) if e.get('source')=='Savills Auctions')
          dates=sorted(str(e.get('auction_date')) for e in h.get('auction_events',[]) if e.get('source')=='Savills Auctions' and e.get('auction_date'))
          print('SAVILLS_EVENTS',count)
          print('OLDEST_VERIFIED',dates[0] if dates else None)
          print('UNIQUE_FIRST_PARTY_URLS',r.get('unique_first_party_urls'))
          print('ARCHIVE_SURFACES_REPLAYED',r.get('archive_surfaces_replayed'))
          print('SUCCESSFUL_ARCHIVE_SURFACES',r.get('successful_archive_surfaces'))
          print('STRICT_FIRST_PARTY_CANDIDATES',r.get('strict_first_party_candidates'))
          assert s.get('historically_complete') is False
          assert s.get('discovery_exhausted') is False
          assert r.get('route')=='savills-2018-first-party-savills-host-wayback-full-parallel-enumeration'
          assert int(r.get('archive_surfaces_replayed') or 0) == int(r.get('unique_first_party_urls') or 0)
          PY
      - name: Preserve generated files
        run: |
          cp data/property_history.json /tmp/savills_gap_history.json
          cp data/historical_backfill_progress.json /tmp/savills_gap_progress.json
          cp data/source_diagnostics/savills_year_gap_recovery.json /tmp/savills_gap_diag.json
      - name: Publish conflict-safe
        run: |
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/savills_gap_history.json data/property_history.json
            cp /tmp/savills_gap_diag.json data/source_diagnostics/savills_year_gap_recovery.json
            python - <<'PY'
          import json
          from pathlib import Path
          fp=Path('data/historical_backfill_progress.json')
          fresh=json.loads(fp.read_text())
          recovered=json.loads(Path('/tmp/savills_gap_progress.json').read_text())
          fs=fresh.setdefault('sources',{}).setdefault('Savills Auctions',{})
          rs=recovered['sources']['Savills Auctions']
          for key in ('savills_year_gap_savills_host_last_run','savills_year_gap_last_blocker','savills_year_gap_focus','last_history_event_count','lots_captured','earliest_date_reached','earliest_month_reached','last_discovery_mode','status'):
              if key in rs: fs[key]=rs[key]
          fs['historically_complete']=False
          fs['discovery_exhausted']=False
          fresh['updated_at']=recovered.get('updated_at',fresh.get('updated_at'))
          fp.write_text(json.dumps(fresh,indent=2,ensure_ascii=False))
          PY
            git add data/property_history.json data/historical_backfill_progress.json data/source_diagnostics/savills_year_gap_recovery.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Persist Savills first-party host archive recovery'
            if git push origin HEAD:main; then exit 0; fi
            git reset --hard HEAD~1
            sleep $((attempt*3))
          done
          exit 1
