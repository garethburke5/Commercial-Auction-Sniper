name: Apply V6.56 nonblocking filters
on:
  push:
    paths:
      - 'scripts/apply_v656_nonblocking_filters.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/apply_v656_nonblocking_filters.py
      - run: python -m py_compile app.py
      - run: |
          git config user.name 'Auction Sniper Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app.py
          git diff --cached --quiet && exit 0
          git commit -m 'V6.56 replace blocking popover with inline filters'
          git push origin main
