name: Pattinson Route Diagnostic
on:
  push:
    paths:
      - '.github/workflows/pattinson-route-diagnostic.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 lxml
      - name: Inspect public Pattinson routes
        run: |
          python - <<'PY'
          import re, requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          H={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36','Accept-Language':'en-GB,en;q=0.9'}
          urls=[
            'https://propertymatters.pattinson.co.uk/?IncludeCommercialProperties=true&OnlineOnly=true&PropertySort=EndingSoonest&PageSize=100&p=1',
            'https://chancellors.pattinson.co.uk/?IncludeCommercialProperties=true&OnlineOnly=true&PropertySort=EndingSoonest&PageSize=100&p=1',
            'https://www.pattinson.co.uk/commercial/property-search?IncludeCommercialProperties=true&OnlineOnly=true&PropertySort=EndingSoonest&PageSize=100&p=1',
            'https://www.pattinson.co.uk/api/property/496865/particulars',
          ]
          for u in urls:
            try:
              r=requests.get(u,headers=H,timeout=20)
              print('\nURL',u,'STATUS',r.status_code,'LEN',len(r.content),'TYPE',r.headers.get('content-type'))
              text=r.text
              print('HEAD',re.sub(r'\s+',' ',text[:600]))
              if 'propertymatters' in u or 'chancellors' in u:
                s=BeautifulSoup(text,'lxml')
                print('PROPERTY LINKS',[(a.get_text(' ',strip=True)[:100],a.get('href')) for a in s.find_all('a',href=True) if 'property' in (a.get('href') or '').lower()][:15])
                print('SCRIPTS',[urljoin(u,x.get('src')) for x in s.find_all('script',src=True)][-15:])
                for pat in (r'https?://[^"\'<> ]+/api/[^"\'<> ]+',r'/api/[^"\'<> ]+',r'property-search[^"\'<> ]*'):
                  hits=list(dict.fromkeys(re.findall(pat,text,re.I)))
                  if hits: print('API HITS',hits[:20])
            except Exception as e:
              print('ERROR',u,repr(e))
          PY
