name: Use tenure as fourth headline metric
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/replace-max-price-with-size.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Replace size headline with tenure
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py')
          s=p.read_text(encoding='utf-8')
          old='''        _size_text=(f"{_sqft:,.0f} sq ft / {_sqm:,.0f} sq m" if _sqft else None)\n        meta=" · ".join(v for v in [x.get("date"),x.get("tenure"),("VAT "+x["vat"]) if x.get("vat") and x["vat"]!="UNKNOWN" else None] if v)'''
          new='''        _size_text=(f"{_sqft:,.0f} sq ft / {_sqm:,.0f} sq m" if _sqft else None)\n        meta=" · ".join(v for v in [x.get("date"),("Size "+_size_text) if _size_text else None,("VAT "+x["vat"]) if x.get("vat") and x["vat"]!="UNKNOWN" else None] if v)'''
          if old not in s:
              raise SystemExit('meta marker not found')
          s=s.replace(old,new,1)
          old='''            +f'<div class="metric yieldMetric"><span>GIY</span><b>{html.escape(pct(y))}</b></div>'\n            +'<div class="metric"><span>Size</span><b>'+html.escape(_size_text or "—")+'</b></div>' '''
          new='''            +f'<div class="metric yieldMetric"><span>GIY</span><b>{html.escape(pct(y))}</b></div>'\n            +'<div class="metric"><span>Tenure</span><b>'+html.escape((x.get("tenure") or "—").upper())+'</b></div>' '''
          if old not in s:
              raise SystemExit('size headline marker not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Compile
        run: python -m py_compile app.py collector_enrichment.py
      - name: Verify metric contract
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('app.py').read_text(encoding='utf-8')
          card=s[s.index('class _ProgressiveCards'):]
          assert '<span>Tenure</span><b>' in card
          assert '<span>Size</span><b>' not in card
          assert '("Size "+_size_text) if _size_text else None' in card
          assert 'class="metric yieldMetric"><span>GIY</span>' in card
          assert 'if len(self)==12:' in card
          print('headline tenure contract OK')
          PY
      - name: Streamlit smoke test
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          at=AppTest.from_file('app.py',default_timeout=20).run()
          print('exceptions',len(at.exception))
          assert not at.exception
          PY
      - name: Commit production change
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add app.py
          git diff --cached --quiet || git commit -m 'Use tenure as fourth headline metric'
          git push
