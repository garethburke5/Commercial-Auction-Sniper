name: Replace max-price headline with size
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/replace-max-price-with-size.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Replace headline metric
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py')
          s=p.read_text(encoding='utf-8')
          old='''        ceiling=x["rent"]/(target_yield/100.0) if x.get("rent") and target_yield else None\n        _sqft,_sqm=_property_area(x,norm(str(x.get("desc") or "")+" "+str(x.get("address") or "")))'''
          new='''        _sqft,_sqm=_property_area(x,norm(str(x.get("desc") or "")+" "+str(x.get("address") or "")))'''
          if old not in s:
              raise SystemExit('ceiling calculation marker not found')
          s=s.replace(old,new,1)
          old='''            +f'<div class="metric yieldMetric"><span>GIY</span><b>{pct(y)}</b></div>'\n            +f'<div class="metric"><span>Max price @ {target_yield:g}% yield</span><b>{money(ceiling)}</b></div>'\n            +(f'<div class="metric sizeMetric"><span>Size</span><b>{html.escape(_size_text)}</b></div>' if _size_text else '')'''
          new='''            +f'<div class="metric yieldMetric"><span>GIY</span><b>{html.escape(pct(y))}</b></div>'\n            +'<div class="metric"><span>Size</span><b>'+html.escape(_size_text or "—")+'</b></div>' '''
          if old not in s:
              raise SystemExit('headline metric marker not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Compile
        run: python -m py_compile app.py collector_enrichment.py
      - name: Verify metric contract
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('app.py').read_text(encoding='utf-8')
          card=s[s.index('class _ProgressiveCards'):]
          assert 'Max price @ {target_yield:g}% yield' not in card
          assert '<span>Size</span><b>' in card
          assert 'class="metric yieldMetric"><span>GIY</span>' in card
          assert 'if len(self)==12:' in card
          print('headline metric contract OK')
          PY
      - name: Streamlit smoke test
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          at=AppTest.from_file('app.py',default_timeout=20).run()
          print('exceptions',len(at.exception))
          assert not at.exception
          PY
      - name: Commit production change
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add app.py
          git diff --cached --quiet || git commit -m 'Replace max-price headline metric with size'
          git push
