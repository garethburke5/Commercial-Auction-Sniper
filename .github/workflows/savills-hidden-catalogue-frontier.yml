name: Savills Hidden Catalogue Frontier Recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'savills_hidden_catalogue_id_frontier_recovery.py'
      - '.github/workflows/savills-hidden-catalogue-frontier.yml'
  schedule:
    - cron: '53 * * * *'

permissions:
  contents: write

concurrency:
  group: auction-sniper-production-scan
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install collector dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install chromium
      - name: Compile hidden catalogue route
        run: python -m py_compile savills_hidden_catalogue_id_frontier_recovery.py history_database.py collectors/savills.py
      - name: Recover unresolved dates through current Savills catalogue IDs
        run: python savills_hidden_catalogue_id_frontier_recovery.py --max-ids 260 --max-dates 8 --max-lots-per-catalogue 300
      - name: Validate canonical outcome or blocker
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path('data/property_history.json').read_text())
          p=json.loads(Path('data/historical_backfill_progress.json').read_text())
          s=(p.get('sources') or {}).get('Savills Auctions') or {}
          events=[e for e in h.get('auction_events',[]) if e.get('source')=='Savills Auctions']
          run=s.get('hidden_catalogue_id_frontier_last_run') or {}
          assert run and run.get('dates_attempted'), 'Hidden catalogue route did not run'
          assert s.get('historically_complete') is False
          if not run.get('canonical_events_added'):
              blocker=s.get('hidden_catalogue_id_frontier_last_blocker') or {}
              assert blocker.get('route') and blocker.get('next_safe_route') and s.get('next_frontier_repair')
          print('SAVILLS_EVENTS',len(events))
          print('EARLIEST_VERIFIED',s.get('earliest_date_reached'))
          print('CATALOGUE_HITS',run.get('catalogue_hits'))
          print('ROWS_ADDED',run.get('canonical_events_added'))
          print('NEXT_REPAIR',s.get('next_frontier_repair'))
          PY
      - name: Publish canonical history or exact blocker
        run: |
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/property_history.json data/historical_backfill_progress.json data/source_diagnostics || true
          if ! git diff --cached --quiet; then
            git commit -m 'Advance Savills hidden catalogue frontier'
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
