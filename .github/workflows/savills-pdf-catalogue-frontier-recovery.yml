name: Savills PDF Catalogue Frontier Recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'savills_pdf_catalogue_frontier_recovery.py'
      - '.github/workflows/savills-pdf-catalogue-frontier-recovery.yml'
  schedule:
    - cron: '53 * * * *'

permissions:
  contents: write

concurrency:
  group: savills-deep-history-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile recovery
        run: python -m py_compile savills_pdf_catalogue_frontier_recovery.py
      - name: Recover exact-date clues from broader Savills-owned archived PDFs
        run: python savills_pdf_catalogue_frontier_recovery.py --year 2014 --limit 12000 --max-docs 300
      - name: Publish clues or exact blocker
        run: |
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/historical_backfill_progress.json data/source_diagnostics
          if ! git diff --cached --quiet; then
            git commit -m 'Advance Savills PDF catalogue frontier recovery'
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
