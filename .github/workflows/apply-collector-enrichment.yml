name: Apply collector enrichment repair
on:
  workflow_dispatch:
  push:
    branches: [collector-enrichment-repair]
    paths:
      - apply_collector_enrichment.py
      - collector_enrichment.py
      - tests/test_collector_enrichment.py
      - .github/workflows/apply-collector-enrichment.yml
jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: collector-enrichment-repair
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4 lxml pytest
      - name: Apply integration patch
        run: python apply_collector_enrichment.py
      - name: Regression tests
        run: PYTHONPATH=. python -m pytest -q tests/test_collector_enrichment.py
      - name: Compile production app
        run: python -m py_compile app.py collector_enrichment.py
      - name: Commit generated app
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add app.py
          git diff --cached --quiet || git commit -m "Integrate rich collector enrichment into app"
          git push origin HEAD:collector-enrichment-repair
