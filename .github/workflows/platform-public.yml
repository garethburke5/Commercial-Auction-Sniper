name: Public platform foundation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web_platform/**', 'investment_details.py', 'property_summary.py', 'board_presentation.py', 'buyer_due_diligence.py', 'legal_pack_*.py', 'packages.txt', 'tests/test_legal_pack*.py', '.github/workflows/platform-public.yml']
  workflow_run:
    workflows: ['Auction Sniper Publish Now', 'Auction Sniper Scan', 'Historical lot corpus collection', 'Commercial history expansion', 'Property gallery and fee evidence']
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: public-platform-pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r web_platform/requirements.txt pytest beautifulsoup4 requests lxml pypdf python-docx openpyxl
      - run: python -m pytest web_platform/tests tests/test_legal_pack_engine.py tests/test_legal_pack_report.py tests/test_legal_pack_ingest.py tests/test_legal_pack_service.py tests/test_legal_pack_review.py tests/test_legal_evidence_provenance.py -q
      - uses: actions/configure-pages@v5
        id: pages
      - run: python -m web_platform.export --output public-dist --origin "$SITE_ORIGIN"
        env:
          SITE_ORIGIN: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-dist
      - uses: actions/deploy-pages@v4
        id: deployment
