name: Public platform foundation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web_platform/**', 'investment_details.py', 'property_summary.py', 'board_presentation.py', 'buyer_due_diligence.py', 'legal_pack_*.py', 'acquisition_*.py', 'source_reconciliation.py', 'scripts/verify_live_platform.py', 'packages.txt', 'tests/test_legal_pack*.py', 'tests/test_acquisition*.py', 'tests/test_registry_scan_coverage.py', '.github/workflows/platform-public.yml']
  workflow_run:
    workflows: ['Auction Sniper Publish Now', 'Auction Sniper Scan', 'Historical lot corpus collection', 'Commercial history expansion', 'Property gallery and fee evidence']
    types: [completed]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: public-platform-pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r web_platform/requirements-cloudflare.txt pytest beautifulsoup4 requests lxml pypdf python-docx openpyxl
      - run: python -m pytest web_platform/tests tests/test_legal_pack_engine.py tests/test_legal_pack_report.py tests/test_legal_pack_ingest.py tests/test_legal_pack_service.py tests/test_legal_pack_review.py tests/test_legal_evidence_provenance.py tests/test_acquisition_lease_evidence.py tests/test_acquisition_property_evidence.py tests/test_registry_scan_coverage.py tests/test_acquisition_investigation.py tests/test_acquisition_pipeline.py tests/test_acuitus_current_catalogue.py tests/test_specialist_office_use.py tests/test_source_reconciliation.py -q
      - uses: actions/configure-pages@v5
        id: pages
      - run: python -m web_platform.export --output public-dist --origin "$SITE_ORIGIN"
        env:
          SITE_ORIGIN: ${{ steps.pages.outputs.base_url }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          PRIVATE_API_ORIGIN: ${{ vars.PRIVATE_API_ORIGIN }}
          BILLING_LIVE: ${{ vars.BILLING_LIVE }}
      - uses: actions/upload-pages-artifact@v3
        id: pages_artifact
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: public-dist
      - name: Wait for this attempt's Pages artifact
        uses: actions/github-script@v8
        env:
          PAGES_ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact_id }}
        with:
          script: |
            // Upload completion can precede visibility in the Actions API.
            // A unique attempt name also prevents reruns selecting old uploads.
            for (let attempt = 0; attempt < 6; attempt++) {
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                ...context.repo, run_id: context.runId, per_page: 100
              });
              const matches = artifacts.filter(a => a.name === process.env.PAGES_ARTIFACT_NAME && !a.expired);
              if (matches.length === 1 && String(matches[0].id) === process.env.PAGES_ARTIFACT_ID) return;
              if (matches.length > 1) throw new Error('Multiple artifacts for this build attempt; refusing ambiguous deployment');
              if (attempt < 5) await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error('Uploaded Pages artifact is not visible yet; retry this job');
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
      - name: Verify source-to-live publication
        run: python scripts/verify_live_platform.py --origin "$SITE_ORIGIN"
        env:
          SITE_ORIGIN: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-to-live-reconciliation
          path: data/source_live_verification.json
