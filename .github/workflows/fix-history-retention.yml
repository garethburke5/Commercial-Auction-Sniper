name: Fix Auction Sniper history retention

on:
  push:
    paths:
      - '.github/workflows/fix-history-retention.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Remove destructive historical filters
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          old = '''    # Available/current board: sold-prior and withdrawn lots do not belong.\n    if any(t in desc for t in ("sold prior","withdrawn prior","withdrawn from auction")):\n        return False\n\n    # Drop genuinely stale auction dates; unknown dates are retained and audited.\n    d=(x.get("date") or "").strip()\n    if re.fullmatch(r"\\d{4}-\\d{2}-\\d{2}",d):\n        try:\n            if d < date.today().isoformat():\n                return False\n        except Exception:\n            pass\n'''
          new = '''    # Historical auction records are deliberately retained. Auction Sniper is a\n    # cumulative commercial-auction database, not an upcoming-only board.\n    # Past, sold-prior and withdrawn lots remain searchable and can be filtered\n    # by lifecycle/status in the UI rather than being deleted here.\n    d=(x.get("date") or "").strip()\n'''
          if old not in s:
              raise SystemExit('Expected destructive history filter block not found; refusing unsafe patch')
          s = s.replace(old, new, 1)
          s = s.replace('BUILD = "V6.69-RICH-CARD-TIDY"', 'BUILD = "V6.70-HISTORY-RETAINED"', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify retention policy
        run: |
          python -m py_compile app.py
          python - <<'PY'
          from pathlib import Path
          s=Path('app.py').read_text(encoding='utf-8')
          assert 'if d < date.today().isoformat()' not in s, 'past-auction deletion still present'
          assert 'sold prior","withdrawn prior","withdrawn from auction")):\n        return False' not in s, 'sold/withdrawn deletion still present'
          assert 'V6.70-HISTORY-RETAINED' in s
          print('History retention patch verified')
          PY
      - name: Commit fix
        run: |
          git config user.name 'Auction Sniper Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app.py
          git commit -m 'Retain completed and withdrawn auction history'
          git pull --rebase origin main
          git push origin main
