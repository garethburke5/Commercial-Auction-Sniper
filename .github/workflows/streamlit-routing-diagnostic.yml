name: Streamlit routing diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/streamlit-routing-diagnostic.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Streamlit routes
        shell: bash
        run: |
          set -euxo pipefail
          for url in \
            'https://commercial-auction-sniper-ghihjbov2hgex6ci7zqklg.streamlit.app/' \
            'https://commercial-auction-sniper.streamlit.app/' \
            'https://share.streamlit.io/garethburke5/commercial-auction-sniper/main/app.py'; do
            echo "===== $url ====="
            host=$(python -c 'import sys,urllib.parse; print(urllib.parse.urlparse(sys.argv[1]).hostname)' "$url")
            getent ahosts "$host" || true
            curl -sS -L -D - --max-time 30 -A 'Mozilla/5.0' "$url" -o /tmp/body.txt || true
            echo '--- body markers ---'
            grep -Eio 'You do not have access to this app|does not exist|Auction Sniper|Sign in|Not found|This app has gone to sleep|This app is unavailable|This app is in the oven' /tmp/body.txt | head -30 || true
            echo '--- body head ---'
            head -c 2500 /tmp/body.txt || true
            echo
          done
