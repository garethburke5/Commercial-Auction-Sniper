name: Publication repair checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publication-repair-checks.yml'
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Capture publishing inputs and reader compatibility
        run: |
          python - <<'PY'
          import pathlib, subprocess, tarfile, urllib.request
          paths=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          with tarfile.open('/tmp/publication-repair-inputs.tar.gz','w:gz') as archive:
              for name in paths:
                  p=pathlib.Path(name)
                  if name in {'data/properties.json','data/property_history.json'} or (p.suffix in {'.py','.yml','.yaml','.toml','.txt'} and not name.startswith(('data/','static/','marketing/media/'))):
                      archive.add(p,arcname=name)
                  if p.suffix in {'.py','.yml','.yaml'}:
                      for number,line in enumerate(p.read_text(errors='replace').splitlines(),1):
                          if 'property_history.json' in line: print(name,number,line.strip()[:300])
              for lot in ['372589','369464','369461','368776','362998','362824','359635']:
                  url='https://www.suttonkersh.co.uk/properties/lot/'+lot+'/'
                  try:
                      content=urllib.request.urlopen(url,timeout=40).read()
                      p=pathlib.Path('/tmp/sutton-'+lot+'.html');p.write_bytes(content)
                      archive.add(p,arcname='evidence/'+p.name)
                  except Exception as e: print('SOURCE FETCH FAILED',lot,str(e))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: publication-repair-inputs
          path: /tmp/publication-repair-inputs.tar.gz
          retention-days: 3
