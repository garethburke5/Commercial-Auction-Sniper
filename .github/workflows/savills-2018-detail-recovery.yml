name: Savills 2018 Detail Recovery

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/savills-2018-detail-recovery.yml'
      - 'savills_2018_first_party_detail_recovery.py'

permissions:
  contents: write

concurrency:
  group: savills-2018-detail-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 lxml
      - run: python -m py_compile savills_2018_first_party_detail_recovery.py
      - name: Recover first-party Savills 2018 detail pages
        run: python savills_2018_first_party_detail_recovery.py
      - name: Verify and preserve
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path('data/property_history.json').read_text())
          p=json.loads(Path('data/historical_backfill_progress.json').read_text())
          d=json.loads(Path('data/source_diagnostics/savills_2018_first_party_detail_recovery.json').read_text())
          s=p['sources']['Savills Auctions']; z=s['savills_2018_detail_last_run']
          c=sum(1 for e in h.get('auction_events',[]) if e.get('source')=='Savills Auctions')
          dates=sorted(str(e.get('auction_date')) for e in h.get('auction_events',[]) if e.get('source')=='Savills Auctions' and e.get('auction_date'))
          print('SAVILLS_EVENTS',c)
          print('OLDEST_VERIFIED',dates[0] if dates else None)
          print('TARGET_CATALOGUES',z.get('target_catalogues'))
          print('DETAIL_LINKS',z.get('detail_links_found'))
          print('ROWS_RECOVERED',z.get('commercial_mixed_rows_recovered'))
          print('EVENTS_ADDED',z.get('canonical_events_added'))
          assert s.get('historically_complete') is False
          assert s.get('discovery_exhausted') is False
          assert d.get('catalogue_runs') is not None
          PY
          cp data/property_history.json /tmp/history.json
          cp data/historical_backfill_progress.json /tmp/progress.json
          cp data/source_diagnostics/savills_2018_first_party_detail_recovery.json /tmp/detail.json
      - name: Publish conflict-safe
        run: |
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/history.json data/property_history.json
            cp /tmp/detail.json data/source_diagnostics/savills_2018_first_party_detail_recovery.json
            python - <<'PY'
          import json
          from pathlib import Path
          fp=Path('data/historical_backfill_progress.json')
          fresh=json.loads(fp.read_text())
          rec=json.loads(Path('/tmp/progress.json').read_text())
          fs=fresh.setdefault('sources',{}).setdefault('Savills Auctions',{})
          rs=rec['sources']['Savills Auctions']
          for k in ('savills_2018_detail_last_run','savills_2018_detail_last_blocker','last_history_event_count','lots_captured','earliest_date_reached','earliest_month_reached','last_discovery_mode','status'):
              if k in rs: fs[k]=rs[k]
              elif k=='savills_2018_detail_last_blocker': fs.pop(k,None)
          fs['historically_complete']=False; fs['discovery_exhausted']=False
          fresh['updated_at']=rec.get('updated_at',fresh.get('updated_at'))
          fp.write_text(json.dumps(fresh,indent=2,ensure_ascii=False))
          PY
            git add data/property_history.json data/historical_backfill_progress.json data/source_diagnostics/savills_2018_first_party_detail_recovery.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Persist Savills 2018 first-party detail recovery'
            if git push origin HEAD:main; then exit 0; fi
            git reset --hard HEAD~1
            sleep $((attempt*3))
          done
          exit 1
