name: Savills 2018 Corpus URL Candidate Probe

on:
  workflow_dispatch:
  push:
    paths:
      - 'savills_2018_corpus_url_candidate_probe.py'
      - '.github/workflows/savills-2018-corpus-url-candidate-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python -m py_compile savills_2018_corpus_url_candidate_probe.py
      - run: python savills_2018_corpus_url_candidate_probe.py
      - name: Publish conflict-safe
        run: |
          set -euo pipefail
          cp data/source_diagnostics/savills_2018_corpus_url_candidate_probe.json /tmp/probe.json
          cp data/historical_backfill_progress.json /tmp/progress.json
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/probe.json data/source_diagnostics/savills_2018_corpus_url_candidate_probe.json
            python - <<'PY'
          import json
          from pathlib import Path
          fresh=json.loads(Path('data/historical_backfill_progress.json').read_text())
          rec=json.loads(Path('/tmp/progress.json').read_text())
          fs=fresh.setdefault('sources',{}).setdefault('Savills Auctions',{});rs=rec['sources']['Savills Auctions']
          for k in ('savills_2018_corpus_url_candidate_probe_last_run','savills_2018_corpus_url_candidate_probe_blocker','last_discovery_mode'):
              if k in rs:fs[k]=rs[k]
          fs['historically_complete']=False;fs['discovery_exhausted']=False
          fresh['updated_at']=rec.get('updated_at',fresh.get('updated_at'))
          Path('data/historical_backfill_progress.json').write_text(json.dumps(fresh,indent=2,ensure_ascii=False))
          d=json.loads(Path('data/source_diagnostics/savills_2018_corpus_url_candidate_probe.json').read_text())
          print('URLS_SCANNED',d['corpus_lot_detail_urls_scanned'])
          print('LOTS',d['unresolved_lots_considered'])
          print('WITH_CANDIDATES',d['lots_with_url_candidates'])
          print('WITH_LIVE_CANDIDATES',d['lots_with_live_candidates'])
          assert d['corpus_lot_detail_urls_scanned']>=20000 and d['unresolved_lots_considered']==58
          PY
            git add data/source_diagnostics/savills_2018_corpus_url_candidate_probe.json data/historical_backfill_progress.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Persist Savills 2018 corpus URL candidate probe'
            if git push origin HEAD:main; then exit 0; fi
            git reset --hard HEAD~1
            sleep $((attempt*3))
          done
          exit 1
# trigger: scan-complete-corpus-url-namespace
