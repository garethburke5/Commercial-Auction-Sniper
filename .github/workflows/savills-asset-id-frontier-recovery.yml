name: Savills Asset ID Frontier Recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'savills_asset_id_frontier_recovery.py'
      - '.github/workflows/savills-asset-id-frontier-recovery.yml'
  schedule:
    - cron: '47 * * * *'

permissions:
  contents: write

concurrency:
  group: savills-deep-history-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile recovery
        run: python -m py_compile savills_asset_id_frontier_recovery.py savills_domain_cdx_lot_recovery.py
      - name: Recover archived asset identifiers and reconstruct lot pages
        run: python savills_asset_id_frontier_recovery.py --year 2014 --asset-limit 20000 --max-ids 400 --max-captures 800
      - name: Verify production candidate state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/historical_backfill_progress.json').read_text())
          h=json.loads(Path('data/property_history.json').read_text())
          s=(p.get('sources') or {}).get('Savills Auctions') or {}
          r=s.get('asset_id_frontier_last_run') or {}
          events=[e for e in h.get('auction_events',[]) if e.get('source')=='Savills Auctions']
          assert events and s.get('historically_complete') is False
          assert r.get('route')=='wayback-savills-lot-asset-id-to-exact-archived-lot-reconstruction'
          print('SAVILLS_EVENTS',len(events))
          print('OLDEST_VERIFIED',s.get('earliest_date_reached') or s.get('earliest_month_reached'))
          print('ASSET_ROWS',r.get('asset_rows_seen'))
          print('ID_PAIRS',r.get('unique_auction_lot_id_pairs'))
          print('EXACT_HITS',r.get('exact_cdx_url_hits'))
          print('EVENTS_ADDED',r.get('canonical_events_added'))
          PY
      - name: Publish rows or exact blocker
        run: |
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/property_history.json data/historical_backfill_progress.json data/source_diagnostics
          if ! git diff --cached --quiet; then
            git commit -m 'Advance Savills asset ID frontier recovery'
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
