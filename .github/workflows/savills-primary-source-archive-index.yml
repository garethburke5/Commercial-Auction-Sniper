name: Savills Primary Source Archive Index

on:
  workflow_dispatch:
  push:
    paths:
      - 'savills_primary_source_archive_index.py'
      - '.github/workflows/savills-primary-source-archive-index.yml'

permissions:
  contents: write

concurrency:
  group: savills-primary-source-archive-index
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Collect first-party Savills auction archive
        run: python savills_primary_source_archive_index.py
      - name: Verify meaningful capture
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/historical_raw/savills_primary_archive_index.json')
          d=json.loads(p.read_text())
          print('EVENTS_CAPTURED',d['events_captured'])
          print('OLDEST_EVENT',d['oldest_event'])
          print('NEWEST_EVENT',d['newest_event'])
          assert d['events_captured'] >= 50, d
          PY
      - name: Persist archive index
        run: |
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/historical_raw/savills_primary_archive_index.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Persist Savills first-party auction archive index'
          git push origin HEAD:main
