name: Apply robust Pugh BTG matching
on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/apply-pugh-fuzzy-matching.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - name: Apply robust exact-page matching
        run: python scripts/apply_pugh_fuzzy_matching.py
      - name: Commit matching fix
        run: |
          git config user.name "Auction Sniper Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet && exit 0
          git commit -m "Resolve all Pugh BTG seed lots to exact pages"
          git push origin develop
