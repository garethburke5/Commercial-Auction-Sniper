name: Apply universal listing enrichment
on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_universal_listing_enrichment.py'
      - '.github/workflows/apply-universal-listing-enrichment.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - name: Repair embedded test-string delimiter
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply_universal_listing_enrichment.py')
          s=p.read_text(encoding='utf-8')
          start="TESTS = r'''from collector_enrichment import extract_particulars, merge_enrichment"
          if start in s:
              s=s.replace(start,'TESTS = r"""from collector_enrichment import extract_particulars, merge_enrichment',1)
              marker="\n'''\n\nPath('collector_enrichment.py').write_text(MODULE, encoding='utf-8')"
              if marker not in s:
                  raise SystemExit('test closing delimiter marker not found')
              s=s.replace(marker,"\n\"\"\"\n\nPath('collector_enrichment.py').write_text(MODULE, encoding='utf-8')",1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Apply universal enrichment patch
        run: python scripts/apply_universal_listing_enrichment.py
      - name: Correct EPC patterns
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('collector_enrichment.py')
          s=p.read_text(encoding='utf-8')
          start=s.index('def _extract_epc(text):')
          end=s.index('\n\ndef _extract_area(text):',start)
          replacement=r'''def _extract_epc(text):
    # Keep the published numerical score when present and never interpret the
    # B in the label "Band" as a second EPC grade.
    patterns = (
        r"\bEPC\s+Band\s+([A-G](?:\s*\(\s*\d{1,3}\s*\))?)(?!\w)",
        r"\bEPC\s+Rating\s*(?:\||:|-)?\s*([A-G](?:\s*\(\s*\d{1,3}\s*\))?)(?!\w)",
        r"\bEPC\s*(?:\||:|-)\s*([A-G](?:\s*\(\s*\d{1,3}\s*\))?)(?!\w)",
        r"\bEPC\s+([A-G](?:\s*\(\s*\d{1,3}\s*\))?)(?!\w)",
        r"Energy Performance Certificate\s+(?:Rating|Band)\s*(?:\||:|-)?\s*([A-G](?:\s*\(\s*\d{1,3}\s*\))?)(?!\w)",
    )
    values=[]
    for p in patterns:
        for m in re.finditer(p,text,re.I):
            value=clean_text(m.group(1)).upper()
            grade=value[0]
            # Prefer the richer value for the same grade, e.g. C (63) over C.
            existing=next((x for x in values if x.startswith(grade)),None)
            if existing:
                if len(value)>len(existing):
                    values[values.index(existing)]=value
            else:
                values.append(value)
    return " / ".join(values) if values else None
'''
          s=s[:start]+replacement+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Parser regression tests
        run: PYTHONPATH=. python -m pytest -q tests/test_collector_enrichment.py
      - name: Compile
        run: python -m py_compile app.py collector_enrichment.py
      - name: Streamlit smoke test
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          at=AppTest.from_file('app.py',default_timeout=20).run()
          print('exceptions',len(at.exception))
          assert not at.exception
          PY
      - name: Commit generated production changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add app.py collector_enrichment.py tests/test_collector_enrichment.py
          git diff --cached --quiet || git commit -m 'Apply universal exact-page listing enrichment'
          git push
