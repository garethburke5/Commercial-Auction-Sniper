name: Symonds Image Diagnostic
on:
  push:
    branches: [main]
    paths: ['.github/workflows/symonds-image-diagnostic.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 lxml
      - name: Inspect current property image markup
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          url='https://auctions.symondsandsampson.co.uk/property/dwr0007b1/sp2/salisbury/harnham-road-and-aylewade-road/other/studio'
          r=requests.get(url,headers={'User-Agent':'Mozilla/5.0'},timeout=30)
          print('STATUS',r.status_code,'LEN',len(r.text))
          s=BeautifulSoup(r.text,'lxml')
          for i,img in enumerate(s.find_all('img')):
              vals={k:img.get(k) for k in ('src','data-src','data-lazy-src','data-original','srcset','data-srcset','alt','class') if img.get(k)}
              if vals: print(i,vals)
          PY
