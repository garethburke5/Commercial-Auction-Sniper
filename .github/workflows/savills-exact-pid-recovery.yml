name: Savills Exact PID History Recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/savills-exact-pid-recovery.yml'
      - 'savills_legacy_exact_pid_capture_recovery.py'

permissions:
  contents: write

concurrency:
  group: auction-sniper-production-scan
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile exact PID recovery
        run: python -m py_compile savills_legacy_exact_pid_capture_recovery.py savills_legacy_aid_capture_recovery.py history_database.py collectors/savills.py

      - name: Recover exact persisted Savills PIDs
        run: |
          python savills_legacy_exact_pid_capture_recovery.py --year 2019 --max-pids 80 --max-captures-per-pid 4 --max-live-checks 120

      - name: Validate History V2 evidence contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse
          hp=Path('data/property_history.json')
          pp=Path('data/historical_backfill_progress.json')
          assert hp.exists() and pp.exists()
          db=json.loads(hp.read_text(encoding='utf-8'))
          progress=json.loads(pp.read_text(encoding='utf-8'))
          sav=[e for e in (db.get('auction_events') or []) if e.get('source') == 'Savills Auctions']
          assert sav
          for e in sav:
              u=((e.get('source_evidence') or {}).get('listing_url') or '')
              p=urlparse(u)
              h=(p.hostname or '').lower()
              assert p.scheme == 'https' and (h == 'savills.co.uk' or h.endswith('.savills.co.uk')), u
          state=(progress.get('sources') or {}).get('Savills Auctions') or {}
          run=state.get('legacy_exact_pid_capture_last_run') or {}
          assert run.get('route') == 'commoncrawl-exact-persisted-pid-warc-to-live-savills'
          print('SAVILLS_EVENTS', len(sav))
          print('EXACT_PID_RUN', json.dumps(run, ensure_ascii=False))
          PY

      - name: Persist History V2 and blocker/progress
        run: |
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/property_history.json data/historical_backfill_progress.json data/source_diagnostics || true
          if git diff --cached --quiet; then
            echo 'No persistent change from exact PID recovery.'
            exit 0
          fi
          git commit -m 'Probe exact persisted Savills PID captures'
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
