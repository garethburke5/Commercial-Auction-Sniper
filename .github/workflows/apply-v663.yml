name: Apply V6.63 Legal Pack Intelligence
on:
  push:
    paths:
      - 'scripts/apply_v663_legal_pack_intelligence.py'
      - '.github/workflows/apply-v663.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/apply_v663_legal_pack_intelligence.py
      - name: Syntax check
        run: python -m py_compile app.py eig_client.py
      - name: Commit production app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git diff --cached --quiet || git commit -m 'V6.63 Legal Pack Intelligence'
          git push
