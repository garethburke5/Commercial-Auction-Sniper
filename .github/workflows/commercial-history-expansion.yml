name: Commercial history expansion
on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Acuitus historical year to reconcile'
        default: '2021'
        required: true
  push:
    branches: [main]
    paths: ['scripts/harvest_acuitus_canonical.py', '.github/workflows/commercial-history-expansion.yml']
permissions:
  contents: write
concurrency:
  group: historical-lot-corpus
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 lxml pytest
      - run: python -m pytest web_platform/tests/test_acuitus_admission.py -q
      - run: python -u scripts/harvest_acuitus_canonical.py --year "$HARVEST_YEAR"
        env:
          HARVEST_YEAR: ${{ inputs.year || '2021' }}
      - name: Persist canonical lots, evidence, reconciliation and counts
        if: always()
        run: |
          set -euo pipefail
          test -s data/auction_history/commercial_expansion.json
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/auction_history/appearances data/auction_history/sources data/auction_history/auctions data/auction_history/progress.json data/auction_history/auction_history.sqlite.gz data/auction_history/commercial_expansion.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Bank Acuitus commercial results and retained Allsop lot evidence'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
