name: Apply stabilisation patch once
on:
  push:
    paths:
      - 'scripts/apply_stabilisation_patch.py'
      - '.github/workflows/stabilisation-once.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/apply_stabilisation_patch.py
      - name: Compile
        run: python -m py_compile app.py legacy_app.py pagination.py
      - name: Install test dependencies
        run: pip install -r requirements.txt
      - name: Regression suite
        run: python -m unittest discover -s tests
      - name: Commit stabilisation and remove one-off machinery
        run: |
          git config user.name "Auction Sniper Stabilisation Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/stabilisation-once.yml scripts/apply_stabilisation_patch.py
          git add app.py legacy_app.py
          git commit -m "Stabilise board pagination and source health"
          git pull --rebase origin main
          git push origin HEAD:main
