name: Savills History Quality Repair

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/savills-history-quality.yml'
      - 'savills_history_quality.py'
      - 'savills_surviving_catalogue_backfill.py'

permissions:
  contents: write

concurrency:
  group: auction-sniper-production-scan
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Savills repair
        run: python -m py_compile savills_history_quality.py savills_surviving_catalogue_backfill.py historical_savills.py collectors/savills.py history_database.py

      - name: Repair persisted legacy Savills addresses
        run: python savills_surviving_catalogue_backfill.py

      - name: Validate repaired History V2
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          db=json.loads(Path('data/property_history.json').read_text(encoding='utf-8'))
          progress=json.loads(Path('data/historical_backfill_progress.json').read_text(encoding='utf-8'))
          sav=[e for e in (db.get('auction_events') or []) if e.get('source') == 'Savills Auctions']
          bad=[e for e in sav if (e.get('address_as_published') or '').strip().lower() in {'login to see times and book a viewing','book a viewing','property details','property detail'}]
          assert not bad, f'{len(bad)} Savills History V2 events still contain modal boilerplate as address'
          state=(progress.get('sources') or {}).get('Savills Auctions') or {}
          assert state.get('earliest_date_reached') <= '2020-09-24', state.get('earliest_date_reached')
          assert int(state.get('lots_captured') or 0) >= 2850, state.get('lots_captured')
          print('SAVILLS_EVENTS',len(sav),'EARLIEST',state.get('earliest_date_reached'),'REPAIRED',state.get('legacy_addresses_repaired_last_run'))
          PY

      - name: Publish repaired Savills history
        run: |
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/property_history.json data/historical_backfill_progress.json
          if ! git diff --cached --quiet; then
            git commit -m 'Repair legacy Savills History V2 addresses'
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                exit 1
              fi
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
