# Bulk ingestion using the exact discovery logic that previously exposed 20,768 first-party Savills URLs.
name: Savills Full First-Party Corpus Ingest

on:
  workflow_dispatch:
  push:
    paths:
      - 'savills_firstparty_full_corpus_ingest.py'
      - 'savills_firstparty_full_corpus_ingest_exact.py'
      - '.github/workflows/savills-firstparty-full-corpus-ingest.yml'

permissions:
  contents: write

concurrency:
  group: savills-firstparty-full-corpus-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 lxml
      - name: Compile
        run: |
          python -m py_compile savills_firstparty_full_corpus_ingest.py
          python -m py_compile savills_firstparty_full_corpus_ingest_exact.py
      - name: Crawl and classify exact complete first-party corpus
        run: python savills_firstparty_full_corpus_ingest_exact.py
      - name: Preserve generated corpus and extraction
        run: |
          cp data/source_diagnostics/savills_firstparty_full_url_corpus.json /tmp/savills_corpus.json
          cp data/source_diagnostics/savills_firstparty_full_corpus_ingest.json /tmp/savills_ingest.json
      - name: Apply safely to freshest production main and publish
        run: |
          set -euo pipefail
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/savills_corpus.json data/source_diagnostics/savills_firstparty_full_url_corpus.json
            cp /tmp/savills_ingest.json data/source_diagnostics/savills_firstparty_full_corpus_ingest.json
            python savills_firstparty_full_corpus_ingest_exact.py --apply-only
            python - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path('data/property_history.json').read_text())
          p=json.loads(Path('data/historical_backfill_progress.json').read_text())
          d=json.loads(Path('data/source_diagnostics/savills_firstparty_full_corpus_ingest.json').read_text())
          n=sum(1 for e in h.get('auction_events',[]) if e.get('source')=='Savills Auctions')
          print('SAVILLS_EVENTS',n)
          print('CORPUS_URLS',d.get('total_urls'))
          print('DETAIL_PAGES_PARSED',d.get('detail_pages_parsed'))
          print('STRICT_ROWS_READY',d.get('strict_commercial_mixed_rows_ready'))
          print('PROGRESS_MODE',p['sources']['Savills Auctions'].get('last_discovery_mode'))
          assert d.get('total_urls',0)>10000
          assert p['sources']['Savills Auctions'].get('historically_complete') is False
          PY
            git add data/property_history.json data/historical_backfill_progress.json data/source_diagnostics/savills_firstparty_full_url_corpus.json data/source_diagnostics/savills_firstparty_full_corpus_ingest.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Persist exact Savills full first-party URL corpus and bulk ingest'
            if git push origin HEAD:main; then exit 0; fi
            git reset --hard HEAD~1
            sleep $((attempt*4))
          done
          exit 1
