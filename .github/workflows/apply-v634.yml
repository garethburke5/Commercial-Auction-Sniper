name: Apply V6.34 source and header repair
on:
  push:
    paths:
      - 'scripts/apply_v634_sources_header.py'
      - '.github/workflows/apply-v634.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/apply_v634_sources_header.py
      - run: python -m py_compile app.py
      - run: |
          git config user.name 'Auction Sniper Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app.py
          git diff --cached --quiet && exit 0
          git commit -m 'V6.34 repair Strettons add Pattinson compact header'
          git push origin main
