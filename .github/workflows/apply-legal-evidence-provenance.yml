name: Apply legal evidence provenance
on:
  workflow_dispatch:
  push:
    branches: [legal-evidence-provenance]
    paths:
      - apply_legal_evidence_provenance.py
      - tests/test_legal_evidence_provenance.py
      - .github/workflows/apply-legal-evidence-provenance.yml
jobs:
  patch-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: legal-evidence-provenance
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pypdf python-docx openpyxl
      - name: Apply patch
        run: python apply_legal_evidence_provenance.py
      - name: Run provenance and existing legal tests
        run: PYTHONPATH=. python -m pytest -q tests/test_legal_evidence_provenance.py tests/test_legal_pack_engine.py tests/test_legal_pack_ingest.py tests/test_legal_pack_report.py tests/test_legal_pack_service.py
      - name: Compile
        run: python -m py_compile legal_pack_engine.py legal_pack_ingest.py legal_pack_report.py legal_pack_service.py
      - name: Commit generated engine
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add legal_pack_engine.py
          git diff --cached --quiet || git commit -m "Add page-level legal evidence provenance"
          git push origin HEAD:legal-evidence-provenance
