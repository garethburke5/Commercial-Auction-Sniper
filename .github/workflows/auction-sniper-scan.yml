name: Auction Sniper Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/auction-sniper-scan.yml'
      - 'run_collectors.py'
      - 'collectors/**'
      - 'scripts/repair_app_canonical.py'

permissions:
  contents: write

concurrency:
  group: auction-sniper-production-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install chromium

      - name: Repair presentation to canonical collector snapshot
        run: python scripts/repair_app_canonical.py

      - name: Compile production code
        run: |
          python -m py_compile app.py run_collectors.py collectors/*.py

      - name: Run production collectors
        env:
          SAVILLS_EMAIL: ${{ secrets.SAVILLS_EMAIL }}
          SAVILLS_PASSWORD: ${{ secrets.SAVILLS_PASSWORD }}
        run: python run_collectors.py

      - name: Validate refreshed snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/properties.json')
          assert p.exists(), 'data/properties.json was not generated'
          d=json.loads(p.read_text(encoding='utf-8'))
          assert 'properties' in d and 'source_health' in d and d.get('generated_at'), 'invalid snapshot contract'
          print('SNAPSHOT', len(d['properties']), 'properties')
          for s in d['source_health']:
              print(s['source'], s['status'], s['lots_seen'])
          bad=[x for x in d['properties'] if str(x.get('occupation') or '').strip().lower() in {'vacant','vacant possession'} and (x.get('annual_rent') is not None or x.get('gross_yield') is not None)]
          assert not bad, f'vacant rent/yield integrity failures: {len(bad)}'
          # Current Savills must be the 15/16 Sep catalogue, never the completed 2 Sep seed catalogue.
          sav=[x for x in d['properties'] if x.get('source')=='Savills Auctions' and str(x.get('status') or '').lower() not in {'archived','completed'}]
          assert sav, 'no current Savills lots published'
          assert all(x.get('auction_date') in {'2026-09-15','2026-09-16'} for x in sav), 'stale Savills current rows detected'
          PY

      - name: Commit repaired app and refreshed snapshot
        run: |
          git config user.name 'Auction Sniper Bot'
          git config user.email 'actions@users.noreply.github.com'
          cp data/properties.json /tmp/auction-sniper-properties.json
          cp app.py /tmp/auction-sniper-app.py
          git restore data/properties.json app.py
          git pull --rebase origin main
          cp /tmp/auction-sniper-properties.json data/properties.json
          cp /tmp/auction-sniper-app.py app.py
          git add data/properties.json app.py
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh canonical Auction Sniper production state'
          git push origin main
