name: Auction Sniper Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/auction-sniper-scan.yml'
      - 'run_collectors.py'
      - 'source_manifest.py'
      - 'config/target_sources.json'
      - 'collectors/**'
      - 'tests/**'
      - 'scripts/repair_app_canonical.py'
      - 'property_summary.py'

permissions:
  contents: write

concurrency:
  group: auction-sniper-production-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install chromium

      - name: Repair presentation to canonical collector snapshot
        run: python scripts/repair_app_canonical.py

      - name: Compile production code
        run: |
          python -m py_compile app.py run_collectors.py source_manifest.py collectors/*.py tests/*.py

      - name: Run collector regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Run production collectors
        env:
          SAVILLS_EMAIL: ${{ secrets.SAVILLS_EMAIL }}
          SAVILLS_PASSWORD: ${{ secrets.SAVILLS_PASSWORD }}
        run: python run_collectors.py

      - name: Validate candidate snapshot before publish
        run: |
          python - <<'PY'
          import json, re
          from datetime import date
          from pathlib import Path
          from source_manifest import manifest_coverage
          p=Path('data/properties.json')
          assert p.exists(), 'data/properties.json was not generated'
          d=json.loads(p.read_text(encoding='utf-8'))
          assert 'properties' in d and 'archive' in d and 'source_health' in d and d.get('generated_at'), 'invalid snapshot contract'
          print('SNAPSHOT',len(d['properties']),'active properties',len(d['archive']),'historical')
          for s in d['source_health']:
              print(s['source'],s['status'],s['lots_seen'],'/',s.get('expected_count'))

          failed=[s for s in d['source_health'] if s.get('status')=='FAILED']
          assert not failed, 'FAILED collectors: '+', '.join(s['source'] for s in failed)
          mismatch=[s for s in d['source_health'] if s.get('expected_count') and s.get('lots_seen')!=s.get('expected_count')]
          assert not mismatch, 'catalogue count mismatches: '+', '.join(f"{s['source']} {s['lots_seen']}/{s['expected_count']}" for s in mismatch)

          coverage=manifest_coverage(d['source_health'])
          print('TARGET COVERAGE',coverage)
          assert not coverage['missing_required_sources'], 'required sources absent from source health: '+', '.join(coverage['missing_required_sources'])
          assert not coverage['unhealthy_required_sources'], 'required sources unhealthy/unimplemented: '+', '.join(coverage['unhealthy_required_sources'])
          assert not coverage['missing_expansion_sources'], 'target expansion sources absent from source health: '+', '.join(coverage['missing_expansion_sources'])
          assert not coverage['unhealthy_expansion_sources'], 'target expansion sources unhealthy/unimplemented: '+', '.join(coverage['unhealthy_expansion_sources'])
          assert coverage['acceptance_ready'], 'configured source universe is not acceptance-ready'
          integrity=d.get('integrity') or {}
          assert integrity.get('target_coverage') is not None, 'target coverage missing from production snapshot'
          assert integrity.get('acceptance_ready') is True, 'snapshot integrity does not certify target acceptance'

          assert not integrity.get('quality_rejections'), f"quality gate rejected {integrity.get('quality_rejections')} records: {integrity.get('quality_rejection_reasons')}"
          quality=integrity.get('source_quality') or {}
          print('SOURCE QUALITY')
          for src,q in sorted(quality.items()):
              print(src,q)

          live_sources={
              s['source'] for s in d['source_health']
              if s.get('status') in {'LIVE','DEGRADED'} and (s.get('lots_seen') or 0) >= 3
          }
          image_fail=[]
          rich_fail=[]
          missing_quality=[]
          for src in sorted(live_sources):
              q=quality.get(src)
              if not q or not q.get('lots'):
                  missing_quality.append(src)
                  continue
              if q.get('image_coverage_pct',0) < 80:
                  image_fail.append(f"{src} {q.get('image_coverage_pct',0)}%")
              if q.get('rich_coverage_pct',0) < 60:
                  rich_fail.append(f"{src} {q.get('rich_coverage_pct',0)}%")
          assert not missing_quality, 'live sources missing quality telemetry: '+', '.join(missing_quality)
          assert not image_fail, 'live-source genuine image coverage below 80%: '+', '.join(image_fail)
          assert not rich_fail, 'live-source rich-particular coverage below 60%: '+', '.join(rich_fail)

          bad_vacant=[x for x in d['properties'] if str(x.get('occupation') or '').strip().lower() in {'vacant','vacant possession'} and (x.get('annual_rent') is not None or x.get('gross_yield') is not None)]
          assert not bad_vacant, f'vacant rent/yield integrity failures: {len(bad_vacant)}'
          boiler=re.compile(r'login|log in|register to bid|book a viewing|arrange a viewing|cancel proxy bid|your bid|wishlist|connecting to auction|please wait',re.I)
          bad_titles=[x for x in d['properties'] if boiler.search(str(x.get('address') or ''))]
          assert not bad_titles, f'boilerplate property titles: {len(bad_titles)}'
          bad_descriptions=[x for x in d['properties'] if boiler.search(str(x.get('description') or ''))]
          assert not bad_descriptions, f'boilerplate property descriptions: {len(bad_descriptions)}'
          today=date.today().isoformat()
          past=[x for x in d['properties'] if str(x.get('auction_date') or '')[:10] and str(x.get('auction_date'))[:10]<today]
          assert not past, f'past auction rows leaked into active board: {len(past)}'
          sav=[x for x in d['properties'] if x.get('source')=='Savills Auctions']
          assert sav, 'no current Savills lots published'
          assert all(str(x.get('auction_date') or '')[:10]>=today for x in sav), 'stale Savills current rows detected'
          PY

      - name: Publish validated refreshed snapshot
        run: |
          git config user.name 'Auction Sniper Bot'
          git config user.email 'actions@users.noreply.github.com'
          cp data/properties.json /tmp/auction-sniper-properties.json
          cp app.py /tmp/auction-sniper-app.py
          git restore data/properties.json app.py
          git pull --rebase origin main
          cp /tmp/auction-sniper-properties.json data/properties.json
          cp /tmp/auction-sniper-app.py app.py
          git add data/properties.json app.py
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh canonical Auction Sniper production state'
            git push origin main
          fi
