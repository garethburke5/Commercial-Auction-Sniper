name: Auction Sniper Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  workflow_call:

permissions:
  contents: write

concurrency:
  group: auction-sniper-production-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright pytest
          python -m playwright install chromium

      - name: Compile production code
        run: |
          python -m py_compile app.py legacy_app.py pagination.py run_collectors.py run_collectors_resilient.py history_database.py source_manifest.py collectors/*.py tests/*.py scripts/update_history_database.py

      - name: Run collector regression tests
        run: python -m pytest tests -q

      - name: Run production collectors
        env:
          SAVILLS_EMAIL: ${{ secrets.SAVILLS_EMAIL }}
          SAVILLS_PASSWORD: ${{ secrets.SAVILLS_PASSWORD }}
        run: python -u run_collectors_resilient.py

      - name: Preserve last-known-good rows for temporary source outages
        run: python -m collectors.publication_resilience

      - name: Preserve candidate for publication diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-unpublished-snapshot
          path: data/properties.json
          retention-days: 7
          if-no-files-found: warn

      - name: Validate candidate snapshot before publish
        run: python -m scripts.validate_publication

      - name: Preserve validated snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: validated-live-snapshot
          path: data/properties.json
          retention-days: 7

      - name: Publish validated refreshed snapshot
        run: |
          git config user.name 'Auction Sniper Bot'
          git config user.email 'actions@users.noreply.github.com'
          cp data/properties.json /tmp/auction-sniper-properties.json
          git restore data/properties.json
          git stash push --include-untracked -m 'collector diagnostics during publication'
          git pull --rebase origin main
          cp /tmp/auction-sniper-properties.json data/properties.json
          python -m scripts.revalidate_snapshot
          python -m scripts.validate_publication
          git add data/properties.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh canonical Auction Sniper production state'
            git push origin main
          fi
