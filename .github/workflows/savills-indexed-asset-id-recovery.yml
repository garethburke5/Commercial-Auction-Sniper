name: Savills Indexed Asset ID Recovery

on:
  push:
    branches: [main]
    paths:
      - 'savills_indexed_asset_id_recovery.py'
      - '.github/workflows/savills-indexed-asset-id-recovery.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: savills-indexed-asset-id-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile indexed asset route
        run: python -m py_compile savills_indexed_asset_id_recovery.py
      - name: Recover Savills IDs from indexed first-party asset URLs
        run: python savills_indexed_asset_id_recovery.py --max-dates 12 --max-live-checks 260
      - name: Validate canonical state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path('data/property_history.json').read_text())
          p=json.loads(Path('data/historical_backfill_progress.json').read_text())
          s=(p.get('sources') or {}).get('Savills Auctions') or {}
          events=[e for e in h.get('auction_events',[]) if e.get('source')=='Savills Auctions']
          run=s.get('indexed_asset_id_last_run') or {}
          assert s.get('historically_complete') is False
          assert run.get('route')=='public-indexed-first-party-savills-asset-id-to-live-lot-validation'
          assert int(run.get('dates_scanned') or 0)>0
          if int(run.get('canonical_events_added') or 0)==0:
              blocker=s.get('indexed_asset_id_last_blocker') or {}
              assert blocker.get('next_safe_route')
          print('SAVILLS_EVENTS',len(events))
          print('EARLIEST_VERIFIED',s.get('earliest_date_reached'))
          print('INDEXED_ASSET_ROUTE',json.dumps(run,ensure_ascii=False))
          PY
      - name: Publish canonical history or exact blocker
        run: |
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/property_history.json data/historical_backfill_progress.json data/source_diagnostics/savills_indexed_asset_id_recovery.json
          if ! git diff --cached --quiet; then
            git commit -m 'Probe Savills historical IDs through indexed first-party assets'
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
