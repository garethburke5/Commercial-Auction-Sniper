name: Savills Public Address Frontier Recovery

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: savills-public-address-frontier
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install collector dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install chromium
      - name: Compile address-led frontier recovery
        run: python -m py_compile savills_public_address_frontier_recovery.py savills_legacy_aid_capture_recovery.py history_database.py collectors/savills.py
      - name: Recover exact frontier through address and postcode clues
        run: python savills_public_address_frontier_recovery.py --max-source-pages 120 --max-clues 160 --max-live-checks 220
      - name: Validate canonical event or exact next blocker
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path('data/property_history.json').read_text())
          p=json.loads(Path('data/historical_backfill_progress.json').read_text())
          s=(p.get('sources') or {}).get('Savills Auctions') or {}
          events=[e for e in h.get('auction_events',[]) if e.get('source')=='Savills Auctions']
          run=s.get('public_address_frontier_last_run') or {}
          assert run, 'Address-led Savills route did not persist an outcome'
          if not run.get('canonical_events_added'):
              blocker=s.get('public_address_frontier_last_blocker') or {}
              assert blocker.get('frontier_dates') and blocker.get('route') and blocker.get('next_safe_route'), 'Zero-event address route missing exact blocker/next route'
          assert s.get('historically_complete') is False
          print('SAVILLS_EVENTS',len(events))
          print('EARLIEST_VERIFIED',s.get('earliest_date_reached'))
          print('PUBLIC_ADDRESS_FRONTIER',run)
          PY
      - name: Publish canonical history or exact blocker
        run: |
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/property_history.json data/historical_backfill_progress.json data/source_diagnostics || true
          if ! git diff --cached --quiet; then
            git commit -m 'Advance Savills frontier through address clues'
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
