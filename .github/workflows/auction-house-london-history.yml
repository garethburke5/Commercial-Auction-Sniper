name: Auction House London historical collection

on:
  workflow_dispatch:
  push:
    paths:
      - auction_house_london_history.py
      - .github/workflows/auction-house-london-history.yml

permissions:
  contents: write

concurrency:
  group: auction-house-london-history
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - name: Collect and reconcile every published 2026 catalogue
        run: python -u auction_house_london_history.py
      - name: Publish lot rows, snapshots and rebuilt database
        run: |
          set -euo pipefail
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/auction_history/appearances/auction_house_london
          git add data/auction_history/sources/auction_house_london
          git add data/auction_history/auctions/auction_house_london
          git add data/auction_history/auction_house_london_collection.json
          git add data/auction_history/progress.json data/auction_history/auction_history.sqlite.gz
          git commit -m 'Bank complete Auction House London 2026 lot history'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
