name: Savills Wayback Frontier Repair

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'savills_archived_catalogue_frontier_recovery.py'
      - 'savills_public_address_frontier_recovery.py'
      - '.github/workflows/savills-wayback-frontier-repair.yml'
      - 'history_database.py'
      - 'collectors/savills.py'
  schedule:
    - cron: '41 * * * *'

permissions:
  contents: write

concurrency:
  group: savills-frontier-recovery
  cancel-in-progress: false

jobs:
  savills-wayback-frontier:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile current Savills frontier routes
        run: |
          python -m py_compile savills_archived_catalogue_frontier_recovery.py savills_public_address_frontier_recovery.py savills_manifest_commoncrawl_frontier_recovery.py savills_legacy_aid_capture_recovery.py history_database.py collectors/savills.py

      - name: Record canonical Savills state before recovery
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/historical_backfill_progress.json').read_text())
          h=json.loads(Path('data/property_history.json').read_text())
          s=(p.get('sources') or {}).get('Savills Auctions') or {}
          events=[e for e in h.get('auction_events',[]) if e.get('source')=='Savills Auctions']
          Path('/tmp/savills-before.json').write_text(json.dumps({'events':len(events),'earliest_month':s.get('earliest_month_reached'),'earliest_date':s.get('earliest_date_reached')}))
          print('SAVILLS_BEFORE',len(events),s.get('earliest_date_reached'),s.get('earliest_month_reached'))
          PY

      - name: Mine archived Savills catalogue and brochure bodies for exact frontier lot routes
        run: python savills_archived_catalogue_frontier_recovery.py --max-html-rows 320 --max-pdf-rows 220 --max-warc 190 --max-live 140

      - name: Persist handoff to address and legacy-pid capture recovery when catalogue route is blocked
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          p_path=Path('data/historical_backfill_progress.json'); p=json.loads(p_path.read_text())
          s=(p.get('sources') or {}).get('Savills Auctions') or {}
          run=s.get('archived_catalogue_frontier_last_run') or {}; blocker=s.get('archived_catalogue_frontier_last_blocker') or {}
          added=int(run.get('canonical_events_added') or 0)
          if not added:
              assert blocker.get('frontier_date') and blocker.get('route')=='archived-savills-catalogue-brochure-warc'
              assert blocker.get('next_safe_route')
              s['next_frontier_repair']='savills_public_address_frontier_recovery.py'
              s['next_frontier_repair_reason']='Use exact catalogue address/lot clues and legacy pid/id capture discovery after archived catalogue/brochure WARC recovery produced no canonical event.'
          s['historically_complete']=False; s['discovery_exhausted']=False
          p['updated_at']=datetime.now(timezone.utc).isoformat(); p_path.write_text(json.dumps(p,indent=2,ensure_ascii=False))
          print('ARCHIVED_CATALOGUE_EVENTS_ADDED',added)
          print('NEXT_FRONTIER_REPAIR',s.get('next_frontier_repair'))
          PY

      - name: Validate canonical-or-blocker outcome
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse
          p=json.loads(Path('data/historical_backfill_progress.json').read_text())
          h=json.loads(Path('data/property_history.json').read_text())
          before=json.loads(Path('/tmp/savills-before.json').read_text())
          s=(p.get('sources') or {}).get('Savills Auctions') or {}
          events=[e for e in h.get('auction_events',[]) if e.get('source')=='Savills Auctions']
          run=s.get('archived_catalogue_frontier_last_run') or {}; blocker=s.get('archived_catalogue_frontier_last_blocker') or {}
          advanced=(len(events)>int(before['events']) or (s.get('earliest_date_reached') and s.get('earliest_date_reached') != before.get('earliest_date')) or (s.get('earliest_month_reached') and s.get('earliest_month_reached') < str(before.get('earliest_month') or '9999-99')))
          if not advanced:
              assert blocker.get('frontier_date') == run.get('frontier_date')
              assert blocker.get('route') == 'archived-savills-catalogue-brochure-warc'
              assert s.get('next_frontier_repair') == 'savills_public_address_frontier_recovery.py'
          assert s.get('historically_complete') is False
          for e in events:
              u=((e.get('source_evidence') or {}).get('listing_url') or '')
              host=(urlparse(u).hostname or '').lower()
              assert u.startswith('https://') and (host=='savills.co.uk' or host.endswith('.savills.co.uk')), u
          print('SAVILLS_AFTER',len(events),s.get('earliest_date_reached'),s.get('earliest_month_reached'))
          print('ADVANCED',advanced)
          print('BLOCKER',None if advanced else blocker)
          PY

      - name: Publish canonical history or exact blocker
        run: |
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/property_history.json data/historical_backfill_progress.json data/source_diagnostics || true
          if ! git diff --cached --quiet; then
            git commit -m 'Advance Savills frontier through archived catalogue recovery'
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
