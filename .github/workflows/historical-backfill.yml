name: Auction Sniper Historical Backfill

on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/historical-backfill.yml'
      - 'historical_backfill.py'
      - 'historical_savills.py'
      - 'history_database.py'
      - 'historical_evidence.py'
      - 'tests/test_history_database.py'

permissions:
  contents: write

# Share the production-data lock so historical writes never race the live collector.
concurrency:
  group: auction-sniper-production-scan
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install chromium

      - name: Compile history code
        run: |
          python -m py_compile historical_backfill.py historical_savills.py history_database.py historical_evidence.py collectors/allsop.py collectors/savills.py

      - name: Run history regression tests
        run: python -m unittest tests.test_history_database -v

      - name: Backfill next Savills commercial auction batch
        run: python historical_savills.py --max-auctions 4

      - name: Validate premium history database
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          h=Path('data/property_history.json')
          p=Path('data/historical_backfill_progress.json')
          assert h.exists(), 'property_history.json missing'
          assert p.exists(), 'historical_backfill_progress.json missing'
          db=json.loads(h.read_text(encoding='utf-8'))
          progress=json.loads(p.read_text(encoding='utf-8'))
          assert isinstance(db.get('properties'),list)
          assert isinstance(db.get('auction_events'),list)
          assert db['auction_events'], 'historical database contains zero auction events'
          assert all(e.get('source') and e.get('address_as_published') for e in db['auction_events'])
          missing_urls=[e for e in db['auction_events'] if not (e.get('source_evidence') or {}).get('listing_url')]
          assert not missing_urls, f'{len(missing_urls)} history events missing listing URL evidence'
          allsop=(progress.get('sources') or {}).get('Allsop Commercial') or {}
          assert allsop.get('status') == 'CAUGHT UP', f'Allsop should be caught up before Savills: {allsop.get("status")}'
          savills=(progress.get('sources') or {}).get('Savills Auctions') or {}
          assert savills, 'Savills progress telemetry missing'
          assert savills.get('auctions_discovered',0) > 0, 'No Savills historical auctions discovered'
          assert savills.get('auctions_completed',0) > 0, 'No Savills historical auctions completed'
          if savills.get('status') != 'CAUGHT UP':
              assert savills.get('last_run_rows',0) > 0, 'Latest Savills batch wrote zero rows while source is not caught up'
          assert savills.get('lots_captured',0) > 0, 'Savills telemetry reports zero captured lots'
          sav_events=[e for e in db['auction_events'] if e.get('source') == 'Savills Auctions']
          assert sav_events, 'Savills telemetry advanced but canonical History V2 has no Savills events'
          assert all((e.get('source_evidence') or {}).get('listing_url','').startswith('https://auctions.savills.co.uk/') for e in sav_events)
          print('HISTORY',len(db['properties']),'properties',len(db['auction_events']),'events')
          print('SAVILLS_EVENTS',len(sav_events))
          print('SAVILLS',savills)
          PY

      - name: Publish historical database and progress
        run: |
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/property_history.json data/historical_backfill_progress.json
          if ! git diff --cached --quiet; then
            git commit -m 'Backfill Savills auction history'
            git push origin main
          fi
