name: Auction Sniper Historical Backfill

on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/historical-backfill.yml'
      - 'historical_backfill.py'
      - 'historical_savills.py'
      - 'savills_surviving_catalogue_backfill.py'
      - 'savills_first_party_legacy_date_recovery.py'
      - 'savills_commoncrawl_legacy_probe.py'
      - 'savills_legacy_aid_capture_recovery.py'
      - 'savills_legacy_pid_wayback_recovery.py'
      - 'savills_public_index_frontier_recovery.py'
      - 'savills_exhaustive_discovery.py'
      - 'historical_acuitus.py'
      - 'repair_savills_history.py'
      - 'savills_history_quality.py'
      - 'history_database.py'
      - 'historical_evidence.py'
      - 'collectors/savills.py'
      - 'tests/test_history_database.py'

permissions:
  contents: write

concurrency:
  group: auction-sniper-production-scan
  cancel-in-progress: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install chromium

      - name: Compile history code
        run: |
          python -m py_compile historical_backfill.py historical_savills.py savills_surviving_catalogue_backfill.py savills_first_party_legacy_date_recovery.py savills_commoncrawl_legacy_probe.py savills_legacy_aid_capture_recovery.py savills_legacy_pid_wayback_recovery.py savills_public_index_frontier_recovery.py savills_exhaustive_discovery.py historical_acuitus.py repair_savills_history.py savills_history_quality.py history_database.py historical_evidence.py collectors/allsop.py collectors/savills.py collectors/acuitus.py

      - name: Run history regression tests
        run: python -m unittest tests.test_history_database -v

      - name: Backfill next incomplete premium commercial source
        run: |
          python - <<'PY'
          import json, subprocess, sys
          from datetime import datetime, timezone
          from pathlib import Path

          progress_path = Path('data/historical_backfill_progress.json')

          def load_progress():
              return json.loads(progress_path.read_text(encoding='utf-8'))

          def sav_state():
              return (load_progress().get('sources') or {}).get('Savills Auctions') or {}

          def persist_runtime_blocker(route, timeout_seconds, exc):
              p = load_progress()
              state = p.setdefault('sources', {}).setdefault('Savills Auctions', {})
              now = datetime.now(timezone.utc).isoformat()
              state['status'] = 'LIVE ARCHIVE BLOCKED'
              state['historically_complete'] = False
              state['last_runtime_blocker'] = {
                  'at': now,
                  'route': route,
                  'timeout_seconds': timeout_seconds,
                  'message': f'Bounded frontier recovery timed out: {type(exc).__name__}: {exc}',
                  'next_safe_route': 'Advance to the next distinct 2019 frontier recovery route instead of rerunning the timed-out route in the same invocation.'
              }
              p['updated_at'] = now
              progress_path.write_text(json.dumps(p, indent=2, ensure_ascii=False), encoding='utf-8')

          def bounded(cmd, seconds, route):
              print('FRONTIER_ROUTE', route, 'TIMEOUT', seconds, 'CMD', ' '.join(cmd), flush=True)
              try:
                  subprocess.run(cmd, check=True, timeout=seconds)
                  return True
              except subprocess.TimeoutExpired as exc:
                  persist_runtime_blocker(route, seconds, exc)
                  print('FRONTIER_ROUTE_TIMEOUT', route, flush=True)
                  return False

          sav = sav_state()
          modern_done = int(sav.get('auctions_completed') or 0) >= 70
          if not modern_done:
              print('NEXT_SOURCE Savills Auctions modern first-party archive', flush=True)
              subprocess.run([sys.executable,'historical_savills.py','--max-auctions','8'], check=True)
          elif not sav.get('historically_complete', False):
              earliest = str(sav.get('earliest_month_reached') or '9999-99')
              if earliest <= '2019-12':
                  # The current verified lot-level frontier is Dec-2019. Attack the proven
                  # older 2019 dates with distinct bounded routes. Crucially, after the broad
                  # Common Crawl index discovers concrete legacy aid/pid URLs, mine those
                  # exact archived WARC captures for the auction date before falling back to
                  # Wayback or public-search discovery.
                  print('NEXT_SOURCE Savills Auctions exact 2019 frontier', flush=True)
                  bounded(
                      [sys.executable, 'savills_first_party_legacy_date_recovery.py'],
                      180,
                      'savills-first-party-sitemap-date-match-2019',
                  )
                  bounded(
                      [sys.executable, 'savills_commoncrawl_legacy_probe.py', '--year', '2019', '--limit', '400', '--max-live-checks', '80'],
                      300,
                      'commoncrawl-2019-prefix-index-to-live-savills-validation',
                  )
                  bounded(
                      [sys.executable, 'savills_legacy_aid_capture_recovery.py', '--year', '2019', '--max-live-checks', '180'],
                      420,
                      'commoncrawl-warc-known-aid-to-auction-date-to-live-savills',
                  )
                  # Only continue to slower providers if the WARC route did not advance the
                  # verified frontier. Every route records its own blocker/diagnostic.
                  sav_after_warc = sav_state()
                  if str(sav_after_warc.get('earliest_month_reached') or '9999-99') >= '2019-12':
                      bounded(
                          [sys.executable, 'savills_legacy_pid_wayback_recovery.py', '--max-pids', '40', '--max-live-checks', '80'],
                          180,
                          'wayback-cdx-exact-legacy-pid-to-live-savills',
                      )
                      bounded(
                          [sys.executable, 'savills_public_index_frontier_recovery.py', '--max-results-per-query', '20', '--max-pages', '80', '--max-live-checks', '120'],
                          300,
                          'public-search-index-pdf-reference-to-live-savills',
                      )
              else:
                  print('NEXT_SOURCE Savills Auctions surviving first-party historical catalogues', flush=True)
                  bounded(
                      [sys.executable,'savills_surviving_catalogue_backfill.py'],
                      900,
                      'savills-surviving-catalogue-bounded',
                  )
          else:
              print('NEXT_SOURCE Acuitus', flush=True)
              subprocess.run([sys.executable,'historical_acuitus.py','--max-auctions','6'], check=True)
          PY

      - name: Repair Savills addresses when modern Savills changed
        run: |
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          p=json.loads(Path('data/historical_backfill_progress.json').read_text(encoding='utf-8'))
          sav=(p.get('sources') or {}).get('Savills Auctions') or {}
          modern_done = int(sav.get('auctions_completed') or 0) >= 70
          if not modern_done:
              subprocess.run([sys.executable,'repair_savills_history.py'], check=True)
          else:
              print('Savills modern archive already captured; historical recovery owns legacy repairs.')
          PY

      - name: Validate premium history database
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse
          h=Path('data/property_history.json')
          p=Path('data/historical_backfill_progress.json')
          assert h.exists(), 'property_history.json missing'
          assert p.exists(), 'historical_backfill_progress.json missing'
          db=json.loads(h.read_text(encoding='utf-8'))
          progress=json.loads(p.read_text(encoding='utf-8'))
          events=db.get('auction_events') or []
          properties=db.get('properties') or []
          assert events, 'historical database contains zero auction events'
          assert len({e.get('event_id') for e in events}) == len(events), 'duplicate History V2 event IDs'
          missing_urls=[e for e in events if not (e.get('source_evidence') or {}).get('listing_url')]
          assert not missing_urls, f'{len(missing_urls)} history events missing listing URL evidence'

          sources=progress.get('sources') or {}
          allsop=sources.get('Allsop Commercial') or {}
          sav=sources.get('Savills Auctions') or {}
          assert allsop.get('status') == 'CAUGHT UP', f'Allsop unexpectedly not caught up: {allsop.get("status")}'
          assert int(sav.get('auctions_completed') or 0) >= 70, 'Savills modern first-party archive not fully captured'
          if not sav.get('historically_complete', False):
              allowed={'DISCOVERY EXPANSION','DISCOVERY EXHAUSTED','RUNNING','SURVIVING CATALOGUE INGESTING','SURVIVING CATALOGUE PROBE BLOCKED','LIVE ARCHIVE BLOCKED','LIVE ARCHIVE DEGRADED'}
              assert sav.get('status') in allowed, f'Misleading Savills status: {sav.get("status")}'

          sav_events=[e for e in events if e.get('source') == 'Savills Auctions']
          assert sav_events, 'No Savills historical events in History V2'
          def first_party(url, domain):
              parsed=urlparse(url or '')
              host=(parsed.hostname or '').lower()
              return parsed.scheme == 'https' and (host == domain or host.endswith('.'+domain))
          bad_sav=[e for e in sav_events if not first_party((e.get('source_evidence') or {}).get('listing_url'),'savills.co.uk')]
          assert not bad_sav, f'{len(bad_sav)} Savills events lack first-party exact listing evidence'
          modal=[e for e in sav_events if 'login to see times and book a viewing' in str(e.get('address_as_published') or '').lower()]
          assert not modal, f'{len(modal)} Savills events still contain modal boilerplate as address'

          if sav.get('historically_complete', False):
              ac=sources.get('Acuitus') or {}
              assert ac.get('auctions_discovered',0) > 0, 'No Acuitus historical auctions discovered'
              assert ac.get('auctions_completed',0) > 0 or ac.get('status') == 'CAUGHT UP', 'No Acuitus historical auctions completed'
              assert ac.get('last_run_failures',0) == 0, f'Acuitus run has failures: {ac.get("last_failure")}'
              assert ac.get('last_run_rows',0) > 0 or ac.get('status') == 'CAUGHT UP', 'Acuitus selected no persistable records'
              assert ac.get('lots_captured',0) > 0, 'Acuitus telemetry reports zero captured lots'
              ac_events=[e for e in events if e.get('source') == 'Acuitus']
              assert len(ac_events) >= ac.get('lots_captured',0), f'Acuitus telemetry/history mismatch: {ac.get("lots_captured")} captured vs {len(ac_events)} canonical events'
              bad=[e for e in ac_events if not first_party((e.get('source_evidence') or {}).get('listing_url'),'acuitus.co.uk')]
              assert not bad, f'{len(bad)} Acuitus events lack first-party exact listing evidence'
              missing_dates=[e for e in ac_events if not e.get('auction_date')]
              assert not missing_dates, f'{len(missing_dates)} Acuitus events missing auction date'
              missing_addresses=[e for e in ac_events if not e.get('address_as_published')]
              assert not missing_addresses, f'{len(missing_addresses)} Acuitus events missing address'
              property_ids={p.get('property_id') for p in properties if p.get('property_id')}
              dangling=[e for e in ac_events if e.get('property_id') not in property_ids]
              assert not dangling, f'{len(dangling)} Acuitus events have dangling property references'

          print('HISTORY',len(properties),'properties',len(events),'events')
          print('SAVILLS_EVENTS',len(sav_events))
          print('SAVILLS',sav)
          PY

      - name: Publish historical database and progress
        run: |
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/property_history.json data/historical_backfill_progress.json data/source_diagnostics || true
          if ! git diff --cached --quiet; then
            git commit -m 'Backfill next UK commercial auction history source'
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo 'Historical publish could not be safely rebased; refusing to overwrite production.' >&2
                exit 1
              fi
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Concurrent main update during publish; retrying ($attempt/3)." >&2
              sleep $((attempt * 3))
            done
            echo 'Historical publish exhausted safe push retries.' >&2
            exit 1
          fi
