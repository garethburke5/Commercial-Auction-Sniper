name: Auction Sniper Historical Backfill

on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/historical-backfill.yml'
      - 'historical_backfill.py'
      - 'historical_savills.py'
      - 'repair_savills_history.py'
      - 'history_database.py'
      - 'historical_evidence.py'
      - 'tests/test_history_database.py'

permissions:
  contents: write

concurrency:
  group: auction-sniper-production-scan
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install chromium

      - name: Compile history code
        run: |
          python -m py_compile historical_backfill.py historical_savills.py repair_savills_history.py history_database.py historical_evidence.py collectors/allsop.py collectors/savills.py

      - name: Run history regression tests
        run: python -m unittest tests.test_history_database -v

      - name: Backfill next Savills commercial auction batch
        run: python historical_savills.py --max-auctions 12

      - name: Repair and gate Savills published addresses
        run: python repair_savills_history.py

      - name: Validate premium history database
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from urllib.parse import urlparse
          h=Path('data/property_history.json')
          p=Path('data/historical_backfill_progress.json')
          assert h.exists(), 'property_history.json missing'
          assert p.exists(), 'historical_backfill_progress.json missing'
          db=json.loads(h.read_text(encoding='utf-8'))
          progress=json.loads(p.read_text(encoding='utf-8'))
          events=db.get('auction_events') or []
          properties=db.get('properties') or []
          assert events, 'historical database contains zero auction events'
          assert len({e.get('event_id') for e in events}) == len(events), 'duplicate History V2 event IDs'
          missing_urls=[e for e in events if not (e.get('source_evidence') or {}).get('listing_url')]
          assert not missing_urls, f'{len(missing_urls)} history events missing listing URL evidence'
          allsop=(progress.get('sources') or {}).get('Allsop Commercial') or {}
          assert allsop.get('status') == 'CAUGHT UP', f'Allsop should be caught up before Savills: {allsop.get("status")}'
          sav=(progress.get('sources') or {}).get('Savills Auctions') or {}
          assert sav.get('auctions_discovered',0) > 0, 'No Savills historical auctions discovered'
          assert sav.get('auctions_completed',0) > 0, 'No Savills historical auctions completed'
          assert sav.get('last_run_rows',0) > 0 or sav.get('status') == 'CAUGHT UP', 'Savills selected no persistable records'
          assert sav.get('lots_captured',0) > 0, 'Savills telemetry reports zero captured lots'
          sav_events=[e for e in events if e.get('source') == 'Savills Auctions']
          assert len(sav_events) >= sav.get('lots_captured',0), f'Savills telemetry/history mismatch: {sav.get("lots_captured")} captured vs {len(sav_events)} canonical events'
          def is_first_party_savills(url):
              parsed=urlparse(url or '')
              host=(parsed.hostname or '').lower()
              return parsed.scheme == 'https' and (host == 'savills.co.uk' or host.endswith('.savills.co.uk'))
          bad=[e for e in sav_events if not is_first_party_savills((e.get('source_evidence') or {}).get('listing_url'))]
          assert not bad, f'{len(bad)} Savills events lack first-party exact listing evidence'
          bad_addresses=[e for e in sav_events if re.search(r'login\s+to\s+see\s+times|book\s+a\s+viewing', str(e.get('address_as_published') or ''), re.I)]
          assert not bad_addresses, f'{len(bad_addresses)} Savills events contain UI text instead of published addresses'
          property_ids={p.get('property_id') for p in properties if p.get('property_id')}
          dangling=[e for e in sav_events if e.get('property_id') not in property_ids]
          assert not dangling, f'{len(dangling)} Savills events have dangling property references'
          assert sav.get('address_quality_checked') == len(sav_events), 'Savills address quality telemetry mismatch'
          assert sav.get('last_history_event_count') == len(events), 'Telemetry was not written after History V2 persistence'
          print('HISTORY',len(properties),'properties',len(events),'events')
          print('SAVILLS_EVENTS',len(sav_events))
          print('SAVILLS',sav)
          PY

      - name: Publish historical database and progress
        run: |
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/property_history.json data/historical_backfill_progress.json
          if ! git diff --cached --quiet; then
            git commit -m 'Backfill Savills auction history'
            git push origin main
          fi
