name: Apply compact UI v2
on:
  push:
    branches: [develop]
    paths:
      - scripts/run_compact_ui_v2.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - run: python scripts/run_compact_ui_v2.py
      - run: python -m py_compile app.py
      - name: Commit compact UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet || git commit -m "Tighten property cards and metric density"
          git push origin develop
