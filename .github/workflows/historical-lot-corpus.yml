      - name: Refresh retained McHugh legacy result tables
        if: inputs.focus == 'retained-legacy' || startsWith(github.event.head_commit.message, 'Run focused retained legacy refresh')
        timeout-minutes: 15
        continue-on-error: true
        run: python -u scripts/harvest_mchugh_legacy.py 8

      - name: Refresh retained Phillip Arnold result tables
        if: inputs.focus == 'retained-legacy' || startsWith(github.event.head_commit.message, 'Run focused retained legacy refresh')
