          if test -f data/auction_history/auction_estates_collection.json; then git add data/auction_history/auction_estates_collection.json; fi
          if test -f data/auction_history/hollis_morgan_collection.json; then git add data/auction_history/hollis_morgan_collection.json; fi
          if test -f data/auction_history/swift_property_auctions_collection.json; then git add data/auction_history/swift_property_auctions_collection.json; fi
          if test -f data/auction_history/sharpes_collection.json; then git add data/auction_history/sharpes_collection.json; fi
          if test -f data/auction_history/seel_collection.json; then git add data/auction_history/seel_collection.json; fi
          database_backup=''
          if test -f data/auction_history/auction_history.sqlite.gz; then
            database_bytes=$(stat -c%s data/auction_history/auction_history.sqlite.gz)
            if test "$database_bytes" -lt 99000000; then
              git add data/auction_history/auction_history.sqlite.gz
            else
              database_backup="$RUNNER_TEMP/auction_history.sqlite.gz"
              cp data/auction_history/auction_history.sqlite.gz "$database_backup"
              git restore data/auction_history/auction_history.sqlite.gz
              echo "Database is $database_bytes bytes; preserving it as an artifact instead of exceeding GitHub's 100 MB file limit."
            fi
          fi
          if git diff --cached --quiet; then
            if test -n "$database_backup"; then cp "$database_backup" data/auction_history/auction_history.sqlite.gz; fi
            exit 0
          fi
          git commit -m 'Bank historical auction lot records and source evidence'
          pushed=false
          for attempt in 1 2 3 4; do
            git fetch origin main
            # Collectors can leave a tracked generated file outside the
            # publication allow-list. Preserve it while rebasing instead of
            # losing an otherwise valid historical checkpoint when main moves.
            git status --short
            git rebase --autostash origin/main
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
          done
          if test -n "$database_backup"; then cp "$database_backup" data/auction_history/auction_history.sqlite.gz; fi
          test "$pushed" = true
      - name: Preserve downloadable database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-auction-lot-database
          path: |
            data/auction_history/auction_history.sqlite.gz
            data/auction_history/progress.json
          retention-days: 30
