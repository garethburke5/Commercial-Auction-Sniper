        if: inputs.focus == 'retained-legacy' || startsWith(github.event.head_commit.message, 'Run focused retained legacy refresh')
        timeout-minutes: 15
        continue-on-error: true
        run: python -u scripts/harvest_swift_property_auctions.py --workers 8

      - name: Collect retained Sharpes traditional and modern results
        if: inputs.focus == 'retained-legacy' || startsWith(github.event.head_commit.message, 'Run focused retained legacy refresh')
        timeout-minutes: 20
        continue-on-error: true
        run: python -u scripts/harvest_sharpes_results.py --workers 12

      - name: Bank retained Seel complete catalogue PDFs
        if: inputs.focus == 'retained-legacy' || startsWith(github.event.head_commit.message, 'Run focused retained legacy refresh')
        timeout-minutes: 20
        continue-on-error: true
        run: python -u scripts/harvest_seel_catalogues.py

      - name: Refresh retained Eddisons sold-result articles
        if: inputs.focus == 'retained-legacy' || startsWith(github.event.head_commit.message, 'Run focused retained legacy refresh')
        timeout-minutes: 10
        continue-on-error: true
        run: python -u scripts/harvest_eddisons_insights.py

      - name: Refresh retained McHugh result catalogues
        if: inputs.focus == 'retained-legacy' || startsWith(github.event.head_commit.message, 'Run focused retained legacy refresh')
        timeout-minutes: 20
        continue-on-error: true
        run: python -u scripts/harvest_mchugh_results.py 8

      - name: Refresh retained McHugh legacy result tables
        if: inputs.focus == 'retained-legacy' || startsWith(github.event.head_commit.message, 'Run focused retained legacy refresh')
        timeout-minutes: 15
        continue-on-error: true
        run: python -u scripts/harvest_mchugh_legacy.py 8

      - name: Refresh retained Phillip Arnold result tables
        if: inputs.focus == 'retained-legacy' || inputs.focus == 'phillip-arnold' || startsWith(github.event.head_commit.message, 'Run focused retained legacy refresh') || startsWith(github.event.head_commit.message, 'Run focused Phillip Arnold refresh')
        timeout-minutes: 20
        continue-on-error: true
        run: python -u scripts/harvest_phillip_arnold_results.py 8

      - name: Bank newly saved source-corpus lots
        if: always()
        timeout-minutes: 5
        run: python -u -c "from historical_corpus import bank_source_corpus; bank_source_corpus()"
      - name: Rebuild database from saved lot records
        id: rebuild
        if: always()
        timeout-minutes: 12
        run: python -u historical_corpus.py build
      - name: Package the complete database below the single-file limit
        if: always() && steps.rebuild.outcome == 'success'
        run: python -c "from web_platform.history_storage import publish_parts; publish_parts('data/auction_history/auction_history.sqlite.gz', 'data/auction_history/database_parts')"
      - name: Reconcile the historical source register and remaining gaps
        if: always() && steps.rebuild.outcome == 'success'
        run: python scripts/history_source_register.py
      - name: Publish checkpoint without changing the live board
        if: always() && steps.rebuild.outcome == 'success'
        run: |
          set -euo pipefail
          test -s data/auction_history/progress.json
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/auction_history/appearances data/auction_history/sources data/auction_history/auctions data/auction_history/progress.json
          # Every collector summary is historical provenance. Stage the glob so a new
          # retained collector cannot silently leave stale run-gain counters on main.
          git add data/auction_history/*_collection.json
          if test -f data/auction_history/anderson_garland_detail_checks.json; then git add data/auction_history/anderson_garland_detail_checks.json; fi
          git add data/auction_history/source_register.json
          git add data/historical_source_corpus/*.json
          if test -f data/auction_history/paul_fosh_collection.json; then git add data/auction_history/paul_fosh_collection.json; fi
          if test -f data/auction_history/allsop_collection.json; then git add data/auction_history/allsop_collection.json; fi
          if test -f data/auction_history/commercial_expansion.json; then git add data/auction_history/commercial_expansion.json; fi
          if test -f data/auction_history/acuitus_collection.json; then git add data/auction_history/acuitus_collection.json; fi
          if test -f data/auction_history/clive_emson_collection.json; then git add data/auction_history/clive_emson_collection.json; fi
          if test -f data/auction_history/barnett_ross_collection.json; then git add data/auction_history/barnett_ross_collection.json; fi
          if test -f data/auction_history/pugh_collection.json; then git add data/auction_history/pugh_collection.json; fi
          if test -f data/auction_history/symonds_sampson_collection.json; then git add data/auction_history/symonds_sampson_collection.json; fi
          if test -f data/auction_history/bidx1_collection.json; then git add data/auction_history/bidx1_collection.json; fi
          if test -f data/auction_history/strettons_collection.json; then git add data/auction_history/strettons_collection.json; fi
          if test -f data/auction_history/cheffins_collection.json; then git add data/auction_history/cheffins_collection.json; fi
          if test -f data/auction_history/btg_eddisons_catalogues_collection.json; then git add data/auction_history/btg_eddisons_catalogues_collection.json; fi
          if test -f data/auction_history/eddisons_collection.json; then git add data/auction_history/eddisons_collection.json; fi
          if test -f data/auction_history/mchugh_collection.json; then git add data/auction_history/mchugh_collection.json; fi
          if test -f data/auction_history/mchugh_legacy_collection.json; then git add data/auction_history/mchugh_legacy_collection.json; fi
          if test -f data/auction_history/phillip_arnold_collection.json; then git add data/auction_history/phillip_arnold_collection.json; fi
          if test -f data/auction_history/anderson_garland_collection.json; then git add data/auction_history/anderson_garland_collection.json; fi
          if test -f data/auction_history/edward_mellor_collection.json; then git add data/auction_history/edward_mellor_collection.json; fi
          if test -f data/auction_history/edward_mellor_pdf_collection.json; then git add data/auction_history/edward_mellor_pdf_collection.json; fi
          if test -f data/auction_history/sdl_property_auctions_collection.json; then git add data/auction_history/sdl_property_auctions_collection.json; fi
          if test -f data/auction_history/smith_sons_collection.json; then git add data/auction_history/smith_sons_collection.json; fi
          if test -f data/auction_history/town_country_collection.json; then git add data/auction_history/town_country_collection.json; fi
          if test -f data/auction_history/brown_co_collection.json; then git add data/auction_history/brown_co_collection.json; fi
          if test -f data/auction_history/bagshaws_collection.json; then git add data/auction_history/bagshaws_collection.json; fi
          if test -f data/auction_history/future_property_auctions_collection.json; then git add data/auction_history/future_property_auctions_collection.json; fi
          if test -f data/auction_history/auction_house_northeast_collection.json; then git add data/auction_history/auction_house_northeast_collection.json; fi
          if test -f data/auction_history/auction_house_southyorkshire_collection.json; then git add data/auction_history/auction_house_southyorkshire_collection.json; fi
          if test -f data/auction_history/auction_house_northwest_collection.json; then git add data/auction_history/auction_house_northwest_collection.json; fi
          if test -f data/auction_history/auction_house_southwest_collection.json; then git add data/auction_history/auction_house_southwest_collection.json; fi
          if test -f data/auction_history/auction_house_eastanglia_collection.json; then git add data/auction_history/auction_house_eastanglia_collection.json; fi
          if test -f data/auction_history/auction_house_national_collection.json; then git add data/auction_history/auction_house_national_collection.json; fi
          if test -f data/auction_history/auction_house_regions_collection.json; then git add data/auction_history/auction_house_regions_collection.json; fi
          if test -f data/auction_history/network_auctions_collection.json; then git add data/auction_history/network_auctions_collection.json; fi
          if test -f data/auction_history/cottons_collection.json; then git add data/auction_history/cottons_collection.json; fi
          if test -f data/auction_history/pattinson_collection.json; then git add data/auction_history/pattinson_collection.json; fi
          if test -f data/auction_history/harman_healy_collection.json; then git add data/auction_history/harman_healy_collection.json; fi
          if test -f data/auction_history/lsh_collection.json; then git add data/auction_history/lsh_collection.json; fi
          if test -f data/auction_history/goldings_collection.json; then git add data/auction_history/goldings_collection.json; fi
          if test -f data/auction_history/maggs_allen_collection.json; then git add data/auction_history/maggs_allen_collection.json; fi
          if test -f data/auction_history/sutton_kersh_collection.json; then git add data/auction_history/sutton_kersh_collection.json; fi
          if test -f data/auction_history/knight_frank_collection.json; then git add data/auction_history/knight_frank_collection.json; fi
          if test -f data/auction_history/auction_estates_collection.json; then git add data/auction_history/auction_estates_collection.json; fi
          if test -f data/auction_history/hollis_morgan_collection.json; then git add data/auction_history/hollis_morgan_collection.json; fi
          if test -f data/auction_history/swift_property_auctions_collection.json; then git add data/auction_history/swift_property_auctions_collection.json; fi
          if test -f data/auction_history/sharpes_collection.json; then git add data/auction_history/sharpes_collection.json; fi
          if test -f data/auction_history/seel_collection.json; then git add data/auction_history/seel_collection.json; fi
          git add -A data/auction_history/database_parts
          database_backup=''
          if test -f data/auction_history/auction_history.sqlite.gz; then
            database_bytes=$(stat -c%s data/auction_history/auction_history.sqlite.gz)
            if test "$database_bytes" -lt 99000000; then
              git add data/auction_history/auction_history.sqlite.gz
            else
              database_backup="$RUNNER_TEMP/auction_history.sqlite.gz"
              cp data/auction_history/auction_history.sqlite.gz "$database_backup"
              git restore data/auction_history/auction_history.sqlite.gz
              echo "Database is $database_bytes bytes; preserving it as an artifact instead of exceeding GitHub's 100 MB file limit."
            fi
          fi
          if git diff --cached --quiet; then
            if test -n "$database_backup"; then cp "$database_backup" data/auction_history/auction_history.sqlite.gz; fi
            exit 0
          fi
          build_base=$(git rev-parse HEAD)
          git commit -m 'Bank historical auction lot records and source evidence'
          checkpoint_branch="history-checkpoints/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          checkpoint_bundle="$RUNNER_TEMP/historical-source-checkpoint-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.bundle"
          # A bundle is the lossless fallback when an old queued run cannot
          # publish a recovery branch (for example after a workflow-file change).
          git bundle create "$checkpoint_bundle" HEAD "^$build_base"
          git bundle verify "$checkpoint_bundle"
          # Preserve the entire collection before attempting to merge moving main.
          # First move the data-only commit onto current main. This prevents a
          # stale queued run from appearing to remove or modify a workflow file,
          # which GitHub correctly rejects for the contents-only Actions token.
          git fetch origin main
          if ! git rebase --autostash origin/main; then
            git rebase --abort
            echo "::error::Publication needs reconciliation. Full source checkpoint retained in artifact bundle $checkpoint_bundle."
            exit 1
          fi
          checkpoint_saved=false
          checkpoint_sha=$(git rev-parse HEAD)
          for backup_attempt in 1 2 3 4; do
            if git -c http.version=HTTP/1.1 -c push.negotiate=true push origin "HEAD:refs/heads/$checkpoint_branch"; then
              checkpoint_saved=true
              break
            fi
            # A lost HTTP response can follow a successful server-side update.
            remote_sha=$(git ls-remote --heads origin "refs/heads/$checkpoint_branch" | awk '{print $1}')
            if test "$remote_sha" = "$checkpoint_sha"; then
              checkpoint_saved=true
              break
            fi
            sleep 5
          done
          if test "$checkpoint_saved" != true; then
            echo "::warning::Remote checkpoint branch could not be saved; the full data commit remains in $checkpoint_bundle."
          fi
          pushed=false
          for attempt in 1 2 3 4; do
            git fetch origin main
            # Collectors can leave a tracked generated file outside the
            # publication allow-list. Preserve it while rebasing instead of
            # losing an otherwise valid historical checkpoint when main moves.
            git status --short
            if ! git rebase --autostash origin/main; then
              git rebase --abort
              echo "::error::Publication needs reconciliation. Full source checkpoint retained on $checkpoint_branch."
              exit 1
            fi
            # A clean rebase can still introduce new source shards from main.
            # Rebuild against that merged evidence before publishing its database.
            if ! git diff --quiet "$build_base" origin/main -- data/auction_history/appearances data/auction_history/auctions data/historical_source_corpus; then
              python -u -c "from historical_corpus import bank_source_corpus; bank_source_corpus()"
              python -u historical_corpus.py build
              python -c "from web_platform.history_storage import publish_parts; publish_parts('data/auction_history/auction_history.sqlite.gz', 'data/auction_history/database_parts')"
              python scripts/history_source_register.py
              git add data/auction_history/appearances data/auction_history/sources data/auction_history/auctions data/auction_history/progress.json data/auction_history/source_register.json
              git add -A data/auction_history/database_parts
              database_bytes=$(stat -c%s data/auction_history/auction_history.sqlite.gz)
              if test "$database_bytes" -lt 99000000; then
                git add data/auction_history/auction_history.sqlite.gz
              else
                database_backup="$RUNNER_TEMP/auction_history.sqlite.gz"
                cp data/auction_history/auction_history.sqlite.gz "$database_backup"
                git restore data/auction_history/auction_history.sqlite.gz
              fi
              git commit --amend --no-edit
              build_base=$(git rev-parse origin/main)
            fi
            if git -c http.version=HTTP/1.1 -c push.negotiate=true push origin HEAD:main; then
              pushed=true
              break
            fi
          done
          if test -n "$database_backup"; then cp "$database_backup" data/auction_history/auction_history.sqlite.gz; fi
          test "$pushed" = true
          if test "$checkpoint_saved" = true; then
            checkpoint_removed=false
            for cleanup_attempt in 1 2 3 4; do
              if git -c http.version=HTTP/1.1 push origin --delete "$checkpoint_branch"; then
                checkpoint_removed=true
                break
              fi
              # Deletion may have reached GitHub even when its response failed.
              if ! git ls-remote --exit-code --heads origin "refs/heads/$checkpoint_branch" >/dev/null 2>&1; then
                checkpoint_removed=true
                break
              fi
              sleep 5
            done
            if test "$checkpoint_removed" != true; then
              echo "::warning::Banked main successfully; temporary checkpoint branch $checkpoint_branch could not be removed."
            fi
          fi
      - name: Restore the newly built database for artifact retention
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/auction_history.sqlite.gz"; then
            cp "$RUNNER_TEMP/auction_history.sqlite.gz" data/auction_history/auction_history.sqlite.gz
          fi
      - name: Preserve downloadable database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-auction-lot-database
          path: |
            data/auction_history/auction_history.sqlite.gz
            data/auction_history/progress.json
            data/auction_history/source_register.json
            ${{ runner.temp }}/historical-source-checkpoint-*.bundle
          retention-days: 30

