name: Historical lot corpus collection

on:
  workflow_dispatch:
  push:
    paths:
      - historical_corpus.py
      - historical_allsop.py
      - scripts/harvest_acuitus_canonical.py
      - scripts/harvest_clive_emson_canonical.py
      - scripts/harvest_barnett_ross_canonical.py
      - scripts/harvest_pugh_canonical.py
      - scripts/harvest_symonds_sampson_canonical.py
      - scripts/harvest_bidx1_canonical.py
      - scripts/harvest_strettons_results.py
      - scripts/harvest_cheffins_history.py
      - scripts/harvest_btg_eddisons_catalogues.py
      - scripts/harvest_anderson_garland_results.py
      - scripts/harvest_edward_mellor_results.py
      - scripts/harvest_sdl_legacy_catalogues.py
      - scripts/harvest_smith_sons_results.py
      - scripts/harvest_town_country_results.py
      - scripts/harvest_brown_co_results.py
      - scripts/harvest_bagshaws_results.py
      - scripts/harvest_future_property_auctions.py
      - scripts/harvest_auction_house_northeast.py
      - scripts/harvest_auction_house_south_yorkshire.py
      - scripts/harvest_auction_house_north_west.py
      - scripts/harvest_auction_house_south_west.py
      - scripts/harvest_auction_house_east_anglia.py
      - scripts/harvest_auction_house_national.py
      - scripts/harvest_auction_house_regions.py
      - scripts/harvest_network_auctions.py
      - scripts/harvest_cottons_results.py
      - scripts/harvest_pattinson_history.py
      - tests/test_historical_corpus.py
      - tests/test_clive_emson_canonical.py
      - tests/test_barnett_ross_history.py
      - tests/test_pugh_history.py
      - tests/test_symonds_sampson_history.py
      - tests/test_bidx1_history.py
      - tests/test_strettons_results.py
      - tests/test_cheffins_history.py
      - tests/test_btg_eddisons_catalogues.py
      - tests/test_anderson_garland_results.py
      - tests/test_edward_mellor_results.py
      - tests/test_sdl_legacy_catalogues.py
      - tests/test_smith_sons_results.py
      - tests/test_town_country_results.py
      - tests/test_brown_co_results.py
      - tests/test_bagshaws_results.py
      - tests/test_future_property_auctions.py
      - tests/test_auction_house_northeast.py
      - tests/test_auction_house_south_yorkshire.py
      - tests/test_auction_house_north_west.py
      - tests/test_auction_house_south_west.py
      - tests/test_auction_house_east_anglia.py
      - tests/test_auction_house_national.py
      - tests/test_auction_house_regions.py
      - tests/test_network_auctions.py
      - tests/test_cottons_results.py
      - tests/test_pattinson_history.py
      - web_platform/tests/test_acuitus_admission.py
      - .github/workflows/historical-lot-corpus.yml
      - data/historical_source_corpus/**
      - data/source_corpus_shards/**
  schedule:
    - cron: '37 */6 * * *'

permissions:
  contents: write

concurrency:
  group: historical-lot-corpus
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 lxml pypdf pytest
      - name: Verify admission, identities and completeness rules
        run: python -m pytest -q tests/test_historical_corpus.py tests/test_historical_allsop.py tests/test_clive_emson_canonical.py tests/test_barnett_ross_history.py tests/test_pugh_history.py tests/test_symonds_sampson_history.py tests/test_bidx1_history.py tests/test_strettons_results.py tests/test_cheffins_history.py tests/test_btg_eddisons_catalogues.py tests/test_anderson_garland_results.py tests/test_edward_mellor_results.py tests/test_sdl_legacy_catalogues.py tests/test_smith_sons_results.py tests/test_town_country_results.py tests/test_brown_co_results.py tests/test_bagshaws_results.py tests/test_auction_house_northeast.py tests/test_auction_house_south_yorkshire.py tests/test_auction_house_north_west.py tests/test_auction_house_south_west.py tests/test_auction_house_east_anglia.py tests/test_auction_house_national.py tests/test_auction_house_regions.py tests/test_network_auctions.py tests/test_cottons_results.py tests/test_pattinson_history.py tests/test_future_property_auctions.py web_platform/tests/test_acuitus_admission.py
      - name: Bank every previously recovered legacy lot
        run: python -u historical_corpus.py bank-legacy
      - name: Bank evidenced lots from saved source-corpus shards
        run: python -u historical_corpus.py bank-source-corpus
      - name: Traverse and reconcile the public Allsop historical search corpus
        timeout-minutes: 20
        continue-on-error: true
        run: python -u historical_allsop.py --workers 4
      - name: Collect only newly exposed or unreconciled Acuitus catalogues
        timeout-minutes: 15
        continue-on-error: true
        run: python -u scripts/harvest_acuitus_canonical.py --all-incomplete
      - name: Collect only newly exposed or unreconciled Clive Emson catalogues
        timeout-minutes: 15
        continue-on-error: true
        run: python -u scripts/harvest_clive_emson_canonical.py --all-incomplete
      - name: Enrich up to six oldest usable Clive Emson partial catalogues from lot pages
        timeout-minutes: 15
        continue-on-error: true
        run: python -u scripts/harvest_clive_emson_canonical.py --enrich-batch 6 --workers 4
      - name: Collect newly exposed or unreconciled Barnett Ross catalogues
        timeout-minutes: 25
        continue-on-error: true
        run: python -u scripts/harvest_barnett_ross_canonical.py --all-incomplete
      - name: Traverse and bank the retained Pugh property archive
        timeout-minutes: 25
        continue-on-error: true
        run: python -u scripts/harvest_pugh_canonical.py
      - name: Bank every retained Symonds and Sampson property page
        timeout-minutes: 20
        continue-on-error: true
        run: python -u scripts/harvest_symonds_sampson_canonical.py --workers 8
      - name: Collect complete seeded BidX1 UK historical catalogues
        timeout-minutes: 15
        continue-on-error: true
        run: python -u scripts/harvest_bidx1_canonical.py
      - name: Bank complete retained Strettons past-auction catalogues
        timeout-minutes: 10
        continue-on-error: true
        run: python -u scripts/harvest_strettons_results.py 4
      - name: Bank retained Cheffins property-auction result cards
        timeout-minutes: 20
        continue-on-error: true
        run: python -u scripts/harvest_cheffins_history.py 6
      - name: Bank retained BTG Eddisons result catalogues
        timeout-minutes: 25
        continue-on-error: true
        run: python -u scripts/harvest_btg_eddisons_catalogues.py 4
      - name: Bank retained SDL legacy catalogue lot cards
        timeout-minutes: 15
        continue-on-error: true
        run: python -u scripts/harvest_sdl_legacy_catalogues.py --limit 48
      - name: Bank Smith and Sons retained auction results
        timeout-minutes: 10
        continue-on-error: true
        run: python -u scripts/harvest_smith_sons_results.py
      - name: Bank Town and Country retained online results
        timeout-minutes: 15
        continue-on-error: true
        run: python -u scripts/harvest_town_country_results.py --workers 4
      - name: Bank Brown and Co retained property-auction results
        timeout-minutes: 10
        continue-on-error: true
        run: python -u scripts/harvest_brown_co_results.py
      - name: Bank Bagshaws retained property-auction pages
        timeout-minutes: 15
        continue-on-error: true
        run: python -u scripts/harvest_bagshaws_results.py
      - name: Bank Anderson and Garland retained auction results
        timeout-minutes: 5
        continue-on-error: true
        run: python -u scripts/harvest_anderson_garland_results.py
      - name: Bank Edward Mellor retained auction result pages
        timeout-minutes: 20
        continue-on-error: true
        run: python -u scripts/harvest_edward_mellor_results.py --limit 24 --workers 8
      - name: Bank Future Property Auctions archived catalogues
        timeout-minutes: 30
        continue-on-error: true
        run: python -u scripts/harvest_future_property_auctions.py --limit 8 --workers 3
      - name: Collect Auction House North East online results
        timeout-minutes: 20
        continue-on-error: true
        run: python -u scripts/harvest_auction_house_northeast.py
      - name: Collect Auction House South Yorkshire online results
        timeout-minutes: 25
        continue-on-error: true
        run: python -u scripts/harvest_auction_house_south_yorkshire.py
      - name: Collect Auction House North West online results
        timeout-minutes: 20
        continue-on-error: true
        run: python -u scripts/harvest_auction_house_north_west.py
      - name: Collect Auction House South West online results
        timeout-minutes: 20
        continue-on-error: true
        run: python -u scripts/harvest_auction_house_south_west.py
      - name: Collect Auction House East Anglia online results
        timeout-minutes: 20
        continue-on-error: true
        run: python -u scripts/harvest_auction_house_east_anglia.py
      - name: Deduplicate and bank Auction House National regional results
        timeout-minutes: 25
        continue-on-error: true
        run: python -u scripts/harvest_auction_house_national.py
      - name: Recover older dedicated Auction House regional results
        timeout-minutes: 25
        continue-on-error: true
        run: python -u scripts/harvest_auction_house_regions.py
      - name: Bank retained Network Auctions legacy result catalogues
        timeout-minutes: 20
        continue-on-error: true
        run: python -u scripts/harvest_network_auctions.py 6
      - name: Ensure OCR tools for retained Cottons scans
        timeout-minutes: 5
        run: |
          if ! command -v tesseract >/dev/null || ! command -v pdftoppm >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y tesseract-ocr poppler-utils
          fi
      - name: Bank Cottons retained result PDFs
        timeout-minutes: 15
        continue-on-error: true
        run: python -u scripts/harvest_cottons_results.py 16 16
      - name: Bank retained sold Pattinson online-auction property pages
        timeout-minutes: 10
        continue-on-error: true
        run: python -u scripts/harvest_pattinson_history.py 32
      - name: Traverse every known Savills catalogue and all its pages
        timeout-minutes: 30
        run: python -u historical_corpus.py harvest-savills --workers 3
      - name: Collect every Paul Fosh result page
        if: always()
        timeout-minutes: 15
        continue-on-error: true
        run: python -u historical_corpus.py harvest-paul-fosh --workers 3
      - name: Rebuild database from saved lot records
        if: always()
        run: python -u historical_corpus.py build
      - name: Publish checkpoint without changing the live board
        if: always()
        run: |
          set -euo pipefail
          test -s data/auction_history/progress.json
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/auction_history/appearances data/auction_history/sources data/auction_history/auctions data/auction_history/progress.json
          if test -f data/auction_history/paul_fosh_collection.json; then git add data/auction_history/paul_fosh_collection.json; fi
          if test -f data/auction_history/allsop_collection.json; then git add data/auction_history/allsop_collection.json; fi
          if test -f data/auction_history/commercial_expansion.json; then git add data/auction_history/commercial_expansion.json; fi
          if test -f data/auction_history/acuitus_collection.json; then git add data/auction_history/acuitus_collection.json; fi
          if test -f data/auction_history/clive_emson_collection.json; then git add data/auction_history/clive_emson_collection.json; fi
          if test -f data/auction_history/barnett_ross_collection.json; then git add data/auction_history/barnett_ross_collection.json; fi
          if test -f data/auction_history/pugh_collection.json; then git add data/auction_history/pugh_collection.json; fi
          if test -f data/auction_history/symonds_sampson_collection.json; then git add data/auction_history/symonds_sampson_collection.json; fi
          if test -f data/auction_history/bidx1_collection.json; then git add data/auction_history/bidx1_collection.json; fi
          if test -f data/auction_history/strettons_collection.json; then git add data/auction_history/strettons_collection.json; fi
          if test -f data/auction_history/cheffins_collection.json; then git add data/auction_history/cheffins_collection.json; fi
          if test -f data/auction_history/btg_eddisons_catalogues_collection.json; then git add data/auction_history/btg_eddisons_catalogues_collection.json; fi
          if test -f data/auction_history/anderson_garland_collection.json; then git add data/auction_history/anderson_garland_collection.json; fi
          if test -f data/auction_history/edward_mellor_collection.json; then git add data/auction_history/edward_mellor_collection.json; fi
          if test -f data/auction_history/sdl_property_auctions_collection.json; then git add data/auction_history/sdl_property_auctions_collection.json; fi
          if test -f data/auction_history/smith_sons_collection.json; then git add data/auction_history/smith_sons_collection.json; fi
          if test -f data/auction_history/town_country_collection.json; then git add data/auction_history/town_country_collection.json; fi
          if test -f data/auction_history/brown_co_collection.json; then git add data/auction_history/brown_co_collection.json; fi
          if test -f data/auction_history/bagshaws_collection.json; then git add data/auction_history/bagshaws_collection.json; fi
          if test -f data/auction_history/future_property_auctions_collection.json; then git add data/auction_history/future_property_auctions_collection.json; fi
          if test -f data/auction_history/auction_house_northeast_collection.json; then git add data/auction_history/auction_house_northeast_collection.json; fi
          if test -f data/auction_history/auction_house_southyorkshire_collection.json; then git add data/auction_history/auction_house_southyorkshire_collection.json; fi
          if test -f data/auction_history/auction_house_northwest_collection.json; then git add data/auction_history/auction_house_northwest_collection.json; fi
          if test -f data/auction_history/auction_house_southwest_collection.json; then git add data/auction_history/auction_house_southwest_collection.json; fi
          if test -f data/auction_history/auction_house_eastanglia_collection.json; then git add data/auction_history/auction_house_eastanglia_collection.json; fi
          if test -f data/auction_history/auction_house_national_collection.json; then git add data/auction_history/auction_house_national_collection.json; fi
          if test -f data/auction_history/auction_house_regions_collection.json; then git add data/auction_history/auction_house_regions_collection.json; fi
          if test -f data/auction_history/network_auctions_collection.json; then git add data/auction_history/network_auctions_collection.json; fi
          if test -f data/auction_history/cottons_collection.json; then git add data/auction_history/cottons_collection.json; fi
          if test -f data/auction_history/pattinson_collection.json; then git add data/auction_history/pattinson_collection.json; fi
          database_backup=''
          if test -f data/auction_history/auction_history.sqlite.gz; then
            database_bytes=$(stat -c%s data/auction_history/auction_history.sqlite.gz)
            if test "$database_bytes" -lt 99000000; then
              git add data/auction_history/auction_history.sqlite.gz
            else
              database_backup="$RUNNER_TEMP/auction_history.sqlite.gz"
              cp data/auction_history/auction_history.sqlite.gz "$database_backup"
              git restore data/auction_history/auction_history.sqlite.gz
              echo "Database is $database_bytes bytes; preserving it as an artifact instead of exceeding GitHub's 100 MB file limit."
            fi
          fi
          if git diff --cached --quiet; then
            if test -n "$database_backup"; then cp "$database_backup" data/auction_history/auction_history.sqlite.gz; fi
            exit 0
          fi
          git commit -m 'Bank historical auction lot records and source evidence'
          pushed=false
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
          done
          if test -n "$database_backup"; then cp "$database_backup" data/auction_history/auction_history.sqlite.gz; fi
          test "$pushed" = true
      - name: Preserve downloadable database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-auction-lot-database
          path: |
            data/auction_history/auction_history.sqlite.gz
            data/auction_history/progress.json
          retention-days: 30
