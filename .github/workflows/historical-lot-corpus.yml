name: Historical lot corpus collection

on:
  workflow_dispatch:
  push:
    paths:
      - historical_corpus.py
      - tests/test_historical_corpus.py
      - .github/workflows/historical-lot-corpus.yml
  schedule:
    - cron: '37 */6 * * *'

permissions:
  contents: write

concurrency:
  group: historical-lot-corpus
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 pytest
      - name: Verify admission, identities and completeness rules
        run: python -m pytest -q tests/test_historical_corpus.py
      - name: Bank every previously recovered legacy lot
        run: python -u historical_corpus.py bank-legacy
      - name: Traverse every known Savills catalogue and all its pages
        timeout-minutes: 42
        run: python -u historical_corpus.py harvest-savills --workers 3
      - name: Rebuild database from saved lot records
        if: always()
        run: python -u historical_corpus.py build
      - name: Publish checkpoint without changing the live board
        if: always()
        run: |
          set -euo pipefail
          test -s data/auction_history/progress.json
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/auction_history/appearances data/auction_history/sources data/auction_history/auctions data/auction_history/progress.json data/auction_history/auction_history.sqlite.gz
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Bank historical auction lot records and source evidence'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - name: Preserve downloadable database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-auction-lot-database
          path: |
            data/auction_history/auction_history.sqlite.gz
            data/auction_history/progress.json
          retention-days: 30
