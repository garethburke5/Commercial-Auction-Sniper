          if test -f data/auction_history/btg_eddisons_catalogues_collection.json; then git add data/auction_history/btg_eddisons_catalogues_collection.json; fi
          if test -f data/auction_history/eddisons_collection.json; then git add data/auction_history/eddisons_collection.json; fi
          if test -f data/auction_history/mchugh_collection.json; then git add data/auction_history/mchugh_collection.json; fi
          if test -f data/auction_history/mchugh_legacy_collection.json; then git add data/auction_history/mchugh_legacy_collection.json; fi
          if test -f data/auction_history/phillip_arnold_collection.json; then git add data/auction_history/phillip_arnold_collection.json; fi
          if test -f data/auction_history/anderson_garland_collection.json; then git add data/auction_history/anderson_garland_collection.json; fi
          if test -f data/auction_history/edward_mellor_collection.json; then git add data/auction_history/edward_mellor_collection.json; fi
          if test -f data/auction_history/edward_mellor_pdf_collection.json; then git add data/auction_history/edward_mellor_pdf_collection.json; fi
          if test -f data/auction_history/sdl_property_auctions_collection.json; then git add data/auction_history/sdl_property_auctions_collection.json; fi
