        continue-on-error: true
        run: python -u scripts/harvest_phillip_arnold_results.py 8

      - name: Rebuild database from saved lot records
        if: always()
        run: python -u historical_corpus.py build
      - name: Publish checkpoint without changing the live board
        if: always()
        run: |
          set -euo pipefail
          test -s data/auction_history/progress.json
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/auction_history/appearances data/auction_history/sources data/auction_history/auctions data/auction_history/progress.json
          if test -f data/auction_history/paul_fosh_collection.json; then git add data/auction_history/paul_fosh_collection.json; fi
          if test -f data/auction_history/allsop_collection.json; then git add data/auction_history/allsop_collection.json; fi
          if test -f data/auction_history/commercial_expansion.json; then git add data/auction_history/commercial_expansion.json; fi
          if test -f data/auction_history/acuitus_collection.json; then git add data/auction_history/acuitus_collection.json; fi
          if test -f data/auction_history/clive_emson_collection.json; then git add data/auction_history/clive_emson_collection.json; fi
          if test -f data/auction_history/barnett_ross_collection.json; then git add data/auction_history/barnett_ross_collection.json; fi
          if test -f data/auction_history/pugh_collection.json; then git add data/auction_history/pugh_collection.json; fi
