name: Savills Diagnostic Evidence Recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'savills_diagnostic_evidence_recovery.py'
      - '.github/workflows/savills-diagnostic-evidence-recovery.yml'

permissions:
  contents: write

concurrency:
  group: savills-diagnostic-evidence-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile recovery
        run: python -m py_compile savills_diagnostic_evidence_recovery.py collectors/savills.py history_database.py
      - name: Verify production baseline
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path('data/property_history.json').read_text())
          p=json.loads(Path('data/historical_backfill_progress.json').read_text())
          ev=[e for e in h.get('auction_events',[]) if e.get('source')=='Savills Auctions']
          dates=sorted(e.get('auction_date') for e in ev if e.get('auction_date'))
          print('SAVILLS_BEFORE',len(ev),dates[0] if dates else None)
          print('HISTORICALLY_COMPLETE',((p.get('sources') or {}).get('Savills Auctions') or {}).get('historically_complete'))
          PY
      - name: Mine accumulated diagnostics and revalidate Savills candidates
        run: python savills_diagnostic_evidence_recovery.py
      - name: Verify and publish
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path('data/property_history.json').read_text())
          p=json.loads(Path('data/historical_backfill_progress.json').read_text())
          ev=[e for e in h.get('auction_events',[]) if e.get('source')=='Savills Auctions']
          dates=sorted(e.get('auction_date') for e in ev if e.get('auction_date'))
          s=(p.get('sources') or {}).get('Savills Auctions') or {}
          assert s.get('historically_complete') is False
          print('SAVILLS_AFTER',len(ev),dates[0] if dates else None)
          print('DIAGNOSTIC_ROUTE',(s.get('diagnostic_evidence_last_run') or {}).get('route'))
          print('ADDED',(s.get('diagnostic_evidence_last_run') or {}).get('canonical_events_added'))
          PY
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/property_history.json data/historical_backfill_progress.json data/source_diagnostics
          if ! git diff --cached --quiet; then
            git commit -m 'Advance Savills frontier through diagnostic evidence'
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt*3))
            done
            exit 1
          fi
