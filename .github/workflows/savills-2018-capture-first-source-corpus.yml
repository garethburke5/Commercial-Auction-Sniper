name: Savills 2018 Capture First Source Corpus

on:
  workflow_dispatch:
  push:
    paths:
      - 'savills_2018_capture_first_source_corpus.py'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate script
        run: python -m py_compile savills_2018_capture_first_source_corpus.py
      - name: Build capture-first Savills source corpus
        run: python savills_2018_capture_first_source_corpus.py
      - name: Persist source corpus and progress onto freshest production main
        shell: bash
        run: |
          set -euo pipefail
          cp data/historical_source_corpus.json /tmp/corpus.json
          cp data/historical_backfill_progress.json /tmp/progress.json
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/corpus.json data/historical_source_corpus.json
            cp /tmp/progress.json data/historical_backfill_progress.json
            git add data/historical_source_corpus.json data/historical_backfill_progress.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Persist Savills 2018 capture-first source corpus'
            if git push origin HEAD:main; then exit 0; fi
            git reset --hard HEAD~1
            sleep $((attempt*4))
          done
          exit 1
