name: Savills Public Aggregator Candidate Recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'savills_public_aggregator_candidate_recovery.py'
      - '.github/workflows/savills-public-aggregator-candidate-recovery.yml'
  schedule:
    - cron: '41 * * * *'

permissions:
  contents: write

concurrency:
  group: savills-public-aggregator-candidate-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile savills_public_aggregator_candidate_recovery.py collectors/savills.py history_database.py
      - name: Discover public historical candidates and require Savills validation
        run: python savills_public_aggregator_candidate_recovery.py
      - name: Verify and publish
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path('data/property_history.json').read_text())
          p=json.loads(Path('data/historical_backfill_progress.json').read_text())
          ev=[e for e in h.get('auction_events',[]) if e.get('source')=='Savills Auctions']
          dates=sorted(e.get('auction_date') for e in ev if e.get('auction_date'))
          s=(p.get('sources') or {}).get('Savills Auctions') or {}
          r=s.get('public_aggregator_candidate_last_run') or {}
          assert s.get('historically_complete') is False
          print('SAVILLS',len(ev),dates[0] if dates else None)
          print('CANDIDATES',sum(len(v) for v in (r.get('discovered_listing_urls_by_date') or {}).values()))
          print('VALIDATED',r.get('verified_first_party_rows'))
          print('ADDED',r.get('canonical_events_added'))
          PY
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/property_history.json data/historical_backfill_progress.json data/source_diagnostics
          if ! git diff --cached --quiet; then
            git commit -m 'Advance Savills frontier through public candidate index'
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt*3))
            done
            exit 1
          fi
