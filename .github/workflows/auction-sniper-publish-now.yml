name: Auction Sniper Publish Now

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'legacy_app.py'
      - 'pagination.py'
      - 'board_presentation.py'
      - 'property_summary.py'
      - 'ui_styles.py'
      - 'board_links.py'
      - 'run_collectors*.py'
      - 'source_manifest.py'
      - 'requirements.txt'
      - 'scripts/revalidate_snapshot.py'
      - 'scripts/repair_legacy_ahl_particulars.py'
      - 'scripts/validate_publication.py'
      - '.github/workflows/auction-sniper-revalidate.yml'
      - 'collectors/**'
      - 'tests/**'
      - 'config/**'
      - '.github/workflows/auction-sniper-publish-now.yml'
      - '.github/workflows/auction-sniper-scan.yml'

permissions:
  contents: write

jobs:
  collection_scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      collect: ${{ steps.scope.outputs.collect }}
    steps:
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYTHON'
          import os, json, urllib.request
          full = os.environ['EVENT_NAME'] != 'push'
          if not full:
              url = 'https://api.github.com/repos/'+os.environ['REPOSITORY']+'/compare/'+os.environ['BEFORE']+'...'+os.environ['AFTER']
              request = urllib.request.Request(url, headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=30) as response:
                  files = [f['filename'] for f in json.load(response)['files']]
              derivation_only = {'collectors/core.py','collectors/financials.py','collectors/publication_quality.py'}
              # GitHub caps comparison files at 300: use a full scan if truncated.
              full = len(files)>=300 or any((p.startswith('collectors/') and p not in derivation_only) or p.startswith(('run_collectors','config/')) for p in files)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('collect='+str(full).lower()+'\n')
          print('Fresh source collection required:', full)
          PYTHON
  repair_published_snapshot:
    uses: ./.github/workflows/auction-sniper-revalidate.yml
  production:
    needs: [repair_published_snapshot, collection_scope]
    if: needs.collection_scope.outputs.collect == 'true'
    uses: ./.github/workflows/auction-sniper-scan.yml
    secrets: inherit
