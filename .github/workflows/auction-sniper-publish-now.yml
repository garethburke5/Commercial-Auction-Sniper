name: Auction Sniper Publish Now

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'legacy_app.py'
      - 'pagination.py'
      - 'run_collectors*.py'
      - 'source_manifest.py'
      - 'requirements.txt'
      - 'collectors/**'
      - 'tests/**'
      - 'config/**'
      - '.github/workflows/auction-sniper-publish-now.yml'
      - '.github/workflows/auction-sniper-scan.yml'

permissions:
  contents: write

jobs:
  production:
    uses: ./.github/workflows/auction-sniper-scan.yml
    secrets: inherit
