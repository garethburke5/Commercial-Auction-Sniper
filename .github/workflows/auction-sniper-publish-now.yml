name: Auction Sniper Publish Now

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'legacy_app.py'
      - 'pagination.py'
      - 'board_presentation.py'
      - 'property_summary.py'
      - 'ui_styles.py'
      - 'board_links.py'
      - 'run_collectors*.py'
      - 'source_manifest.py'
      - 'requirements.txt'
      - 'scripts/revalidate_snapshot.py'
      - 'scripts/repair_legacy_ahl_particulars.py'
      - 'scripts/validate_publication.py'
      - '.github/workflows/auction-sniper-revalidate.yml'
      - 'collectors/**'
      - 'tests/**'
      - 'config/**'
      - '.github/workflows/auction-sniper-publish-now.yml'
      - '.github/workflows/auction-sniper-scan.yml'

permissions:
  contents: write

jobs:
  repair_published_snapshot:
    uses: ./.github/workflows/auction-sniper-revalidate.yml
  production:
    needs: repair_published_snapshot
    uses: ./.github/workflows/auction-sniper-scan.yml
    secrets: inherit
