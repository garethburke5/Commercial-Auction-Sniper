name: Savills Direct Common Crawl CDX Recovery

on:
  push:
    branches: [main]
    paths:
      - 'savills_commoncrawl_direct_cdx_frontier_recovery.py'
      - '.github/workflows/savills-commoncrawl-direct-cdx-frontier.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: savills-direct-commoncrawl-cdx
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile recovery
        run: python -m py_compile savills_commoncrawl_direct_cdx_frontier_recovery.py
      - name: Recover Savills through direct Common Crawl index files
        run: python savills_commoncrawl_direct_cdx_frontier_recovery.py --max-blocks-per-collection 14 --max-rows 600 --max-warc-checks 240 --max-live-checks 110
      - name: Verify canonical Savills state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path('data/property_history.json').read_text())
          p=json.loads(Path('data/historical_backfill_progress.json').read_text())
          s=(p.get('sources') or {}).get('Savills Auctions') or {}
          events=[e for e in h.get('auction_events',[]) if e.get('source')=='Savills Auctions']
          assert s.get('historically_complete') is False
          print('SAVILLS_EVENTS',len(events))
          print('EARLIEST_VERIFIED',s.get('earliest_date_reached'))
          print('DIRECT_CDX',json.dumps(s.get('commoncrawl_direct_cdx_last_run'),ensure_ascii=False))
          PY
      - name: Publish canonical history or exact blocker
        run: |
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/property_history.json data/historical_backfill_progress.json data/source_diagnostics || true
          if ! git diff --cached --quiet; then
            git commit -m 'Probe Savills frontier through direct Common Crawl CDX files'
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
