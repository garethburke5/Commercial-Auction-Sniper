name: Apply Collector Wiring
on:
  push:
    paths:
      - '.github/workflows/apply-collector-wiring.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Wire collectors into production runner
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('run_collectors.py')
          text=p.read_text()
          old='from collectors.pattinson import collect as pattinson'
          new='from collectors.pattinson_resilient import collect as pattinson'
          if old in text:
              text=text.replace(old,new,1)
          elif new not in text:
              raise SystemExit('Pattinson import anchor not found')
          anchor='from collectors.bidx1 import collect as bidx1'
          sym='from collectors.symonds_sampson import collect as symonds_sampson'
          if sym not in text:
              if anchor not in text: raise SystemExit('BidX1 import anchor not found')
              text=text.replace(anchor,anchor+'\n'+sym,1)
          old_list='future_property,bidx1]'
          new_list='future_property,bidx1,symonds_sampson]'
          if old_list in text:
              text=text.replace(old_list,new_list,1)
          elif new_list not in text:
              raise SystemExit('Collector list anchor not found')
          p.write_text(text)
          PY
      - name: Remove transient wiring workflow and publish patch
        run: |
          git config user.name 'Auction Sniper Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/apply-collector-wiring.yml
          git add run_collectors.py
          if ! git diff --cached --quiet; then
            git commit -m 'Wire resilient Pattinson and Symonds collectors into production'
            git push origin main
          fi
