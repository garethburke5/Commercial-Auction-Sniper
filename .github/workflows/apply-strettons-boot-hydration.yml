name: Apply Strettons exact-page boot hydration
on:
  push:
    branches: [develop]
    paths:
      - scripts/apply_strettons_boot_hydration.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - run: python scripts/apply_strettons_boot_hydration.py
      - name: Commit Strettons boot hydration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet || git commit -m "Hydrate Strettons exact pages and images at boot"
          git push origin develop
