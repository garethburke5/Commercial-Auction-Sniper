name: Savills Domain CDX Lot Recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'savills_domain_cdx_lot_recovery.py'
      - '.github/workflows/savills-domain-cdx-lot-recovery.yml'
  schedule:
    - cron: '41 * * * *'

permissions:
  contents: write

concurrency:
  group: savills-deep-history-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install parser dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile recovery
        run: python -m py_compile savills_domain_cdx_lot_recovery.py
      - name: Enumerate domain-wide archived Savills lot URLs and parse first-party captures
        run: python savills_domain_cdx_lot_recovery.py --year 2014 --index-limit 12000 --max-captures 600
      - name: Verify canonical state and frontier telemetry
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/historical_backfill_progress.json').read_text())
          h=json.loads(Path('data/property_history.json').read_text())
          s=(p.get('sources') or {}).get('Savills Auctions') or {}
          events=[e for e in h.get('auction_events',[]) if e.get('source')=='Savills Auctions']
          r=s.get('domain_cdx_lot_last_run') or {}
          assert events
          assert r.get('route') == 'wayback-domain-wide-url-inventory-to-archived-savills-lot-body'
          assert s.get('historically_complete') is False
          print('SAVILLS_EVENTS',len(events))
          print('OLDEST_VERIFIED',s.get('earliest_date_reached') or s.get('earliest_month_reached'))
          print('DOMAIN_URLS',r.get('domain_lot_like_urls'))
          print('EXACT_DATE_MATCHES',r.get('captures_matching_exact_auction_date'))
          print('EVENTS_ADDED',r.get('canonical_events_added'))
          print('ERRORS',len(r.get('errors') or []))
          PY
      - name: Publish recovered rows or exact blocker
        run: |
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/property_history.json data/historical_backfill_progress.json data/source_diagnostics
          if ! git diff --cached --quiet; then
            git commit -m 'Advance Savills domain archive recovery'
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
