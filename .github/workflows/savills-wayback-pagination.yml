name: Savills Pagination Recovery
on:
  push:
    branches: [main]
    paths:
      - 'savills_wayback_pagination_recover.py'
      - '.github/workflows/savills-wayback-pagination.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python -m py_compile savills_wayback_pagination_recover.py history_database.py
      - name: Recover exact archived Savills pagination
        run: python savills_wayback_pagination_recover.py
      - name: Verify result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path('data/property_history.json').read_text());p=json.loads(Path('data/historical_backfill_progress.json').read_text());s=p['sources']['Savills Auctions'];d=s['savills_wayback_pagination_last_run'];count=sum(1 for e in h.get('auction_events',[]) if e.get('source')=='Savills Auctions')
          print('SAVILLS_EVENTS',count);print('EARLIEST_VERIFIED',s.get('earliest_date_reached'));print('ADDED',d.get('canonical_events_added'));print('TARGETS',d.get('pagination_targets'));print('CDX',d.get('cdx_targets_with_captures'));print('HTTP200',d.get('pages_http_200'))
          assert count==d['canonical_events_after'];assert s.get('historically_complete') is False;assert s.get('discovery_exhausted') is False
          PY
      - name: Stage recovered files
        run: |
          cp data/property_history.json /tmp/savills_pagination_history.json
          cp data/historical_backfill_progress.json /tmp/savills_pagination_progress.json
          cp data/source_diagnostics/savills_wayback_pagination_recovery.json /tmp/savills_pagination_diag.json
      - name: Publish conflict-safe
        run: |
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/savills_pagination_history.json data/property_history.json
            cp /tmp/savills_pagination_diag.json data/source_diagnostics/savills_wayback_pagination_recovery.json
            python - <<'PY'
          import json
          from pathlib import Path
          fp=Path('data/historical_backfill_progress.json');fresh=json.loads(fp.read_text());recovered=json.loads(Path('/tmp/savills_pagination_progress.json').read_text())
          fs=fresh.setdefault('sources',{}).setdefault('Savills Auctions',{});rs=recovered['sources']['Savills Auctions']
          for key in ('savills_wayback_pagination_last_run','propertyauctions_cursor_last_blocker','last_history_event_count','lots_captured','earliest_date_reached','earliest_month_reached','last_success','last_discovery_mode','status'):
              if key in rs:fs[key]=rs[key]
          fs['historically_complete']=False;fs['discovery_exhausted']=False;fresh['updated_at']=recovered.get('updated_at',fresh.get('updated_at'));fp.write_text(json.dumps(fresh,indent=2,ensure_ascii=False))
          PY
            git add data/property_history.json data/historical_backfill_progress.json data/source_diagnostics/savills_wayback_pagination_recovery.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Persist Savills archived pagination recovery'
            if git push origin HEAD:main; then exit 0; fi
            git reset --hard HEAD~1
            sleep $((attempt*3))
          done
          exit 1
