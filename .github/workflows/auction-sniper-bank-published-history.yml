name: Bank Published Auction History

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Auction Sniper Publish Now', 'Auction Sniper Scan']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: auction-sniper-history-bank
  cancel-in-progress: false

jobs:
  history:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: |
          git config user.name 'Auction Sniper Bot'
          git config user.email 'actions@users.noreply.github.com'

      - name: Build permanent auction history database
        timeout-minutes: 20
        run: |
          python scripts/update_history_database.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/property_history.json')
          assert p.exists(), 'property history database was not generated'
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d.get('schema_version') == 1, 'unknown history schema'
          assert isinstance(d.get('properties'), list) and isinstance(d.get('auction_events'), list), 'invalid history contract'
          stats=d.get('stats') or {}
          assert stats.get('auction_event_count',0) == len(d['auction_events']), 'history event count mismatch'
          assert stats.get('events_with_source_url',0) == len(d['auction_events']), 'historical events missing source evidence URLs'
          print('HISTORY VALIDATED',stats)
          PY

      - name: Publish updated history
        run: |
          cp data/property_history.json /tmp/auction-sniper-property-history.json
          git restore data/property_history.json
          git pull --rebase origin main
          cp /tmp/auction-sniper-property-history.json data/property_history.json
          git add data/property_history.json
          if ! git diff --cached --quiet; then
            git commit -m 'Bank published auction lots in permanent history'
            git push origin main
          fi
