name: Bank Published Auction History

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'history_database.py'
      - 'scripts/update_history_database.py'
      - 'scripts/validate_history_database.py'
      - '.github/workflows/auction-sniper-bank-published-history.yml'
  workflow_run:
    workflows: ['Auction Sniper Publish Now', 'Auction Sniper Scan']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: auction-sniper-history-bank
  cancel-in-progress: false

jobs:
  history:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest
      - name: Test history preservation and repeated banking
        run: python -m pytest tests/test_history_database.py -q
      - run: |
          git config user.name 'Auction Sniper Bot'
          git config user.email 'actions@users.noreply.github.com'

      - name: Build, validate and publish permanent history
        timeout-minutes: 20
        run: |
          for attempt in 1 2 3 4; do
            # This is a disposable CI checkout. Rebuild on the newest committed
            # history and snapshot so a concurrent collector cannot be overwritten.
            git fetch origin main
            git reset --hard origin/main
            python scripts/update_history_database.py
            python -m scripts.validate_history_database
            git add data/property_history.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Bank published auction lots in permanent history'
            if git push origin HEAD:main; then exit 0; fi
            echo "History publication advanced concurrently; rebuilding attempt $attempt"
          done
          echo '::error::History publication did not succeed after four attempts'
          exit 1
