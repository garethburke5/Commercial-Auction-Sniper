name: Targeted snapshot-only startup hotfix
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hotfix-startup-snapshot-only.yml
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove live collector work from Streamlit startup
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py')
          s=p.read_text(encoding='utf-8')
          old='''rows,health,updated=load_rows()\ntry:\n    priority=_v654_priority_boot_rows()\n    if priority:\n        rows=_merge_property_universe(rows,priority)\n    rows=[r for r in rows if r.get("source")!="Clive Emson" or re.search(r"/properties/\\d+/\\d+/?$",r.get("url") or "",re.I)]\n    rows=_v657_localise_priority_rows(rows)\n    rows=[_normalise_rent_semantics(r) for r in rows]\nexcept Exception:\n    pass\n'''
          new='''rows,health,updated=load_rows()\n# Startup is snapshot-only. Live auction-site collection runs only when the\n# user explicitly presses Update listings or via the scheduled collector.\ntry:\n    rows=[r for r in rows if r.get("source")!="Clive Emson" or re.search(r"/properties/\\d+/\\d+/?$",r.get("url") or "",re.I)]\n    rows=_v657_localise_priority_rows(rows)\n    rows=[_normalise_rent_semantics(r) for r in rows]\nexcept Exception:\n    pass\n'''
          if old not in s:
              raise SystemExit('Expected V6.67 startup block not found; refusing to patch')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Compile
        run: python -m py_compile app.py
      - name: Verify no live priority collector on startup
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('app.py').read_text(encoding='utf-8')
          anchor=s.index('rows,health,updated=load_rows()')
          hero=s.index('st.markdown(', anchor)
          block=s[anchor:hero]
          assert '_v654_priority_boot_rows()' not in block
          assert 'Startup is snapshot-only' in block
          print('startup path is snapshot-only')
          PY
      - name: Commit startup fix
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add app.py
          git diff --cached --quiet || git commit -m "Make Streamlit startup snapshot-only"
          git push origin HEAD:main
