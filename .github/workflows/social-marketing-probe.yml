name: Social marketing connection check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['marketing/probe.py', '.github/workflows/social-marketing-probe.yml']
permissions:
  contents: read
jobs:
  connection:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: marketing
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Buffer without creating or publishing posts
        run: python marketing/probe.py
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: social-connection
          path: social-output/
