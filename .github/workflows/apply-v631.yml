name: Apply V6.31 occupancy badges
on:
  push:
    paths:
      - 'scripts/apply_v631_occupancy_badge.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/apply_v631_occupancy_badge.py
      - run: |
          git config user.name 'Auction Sniper Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app.py
          git diff --cached --quiet && exit 0
          git commit -m 'V6.31 show tenancy status on property cards'
          git push origin main
