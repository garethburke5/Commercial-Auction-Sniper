name: Legal Pack Engine Tests
on:
  push:
    paths:
      - 'legal_pack_engine.py'
      - 'legal_pack_ingest.py'
      - 'legal_pack_report.py'
      - 'legal_pack_service.py'
      - 'requirements.txt'
      - 'tests/test_legal_pack_engine.py'
      - 'tests/test_legal_pack_ingest.py'
      - 'tests/test_legal_pack_report.py'
      - 'tests/test_legal_pack_service.py'
      - '.github/workflows/legal-pack-engine-tests.yml'
  pull_request:
    paths:
      - 'legal_pack_engine.py'
      - 'legal_pack_ingest.py'
      - 'legal_pack_report.py'
      - 'legal_pack_service.py'
      - 'requirements.txt'
      - 'tests/test_legal_pack_engine.py'
      - 'tests/test_legal_pack_ingest.py'
      - 'tests/test_legal_pack_report.py'
      - 'tests/test_legal_pack_service.py'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pypdf python-docx openpyxl
      - run: python -m pytest -q tests/test_legal_pack_engine.py tests/test_legal_pack_ingest.py tests/test_legal_pack_report.py tests/test_legal_pack_service.py
      - run: python -m py_compile legal_pack_engine.py legal_pack_ingest.py legal_pack_report.py legal_pack_service.py
