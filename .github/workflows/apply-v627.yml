name: Apply V6.27 production repair

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_v627_ui_btg_fix.py'
      - '.github/workflows/apply-v627.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply V6.27 patch
        run: python scripts/apply_v627_ui_btg_fix.py
      - name: Verify app
        run: python -m py_compile app.py
      - name: Commit production repair
        run: |
          git config user.name 'Auction Sniper Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app.py
          git diff --cached --quiet && exit 0
          git commit -m 'Release V6.27 compact UI and BTG image repair'
          git pull --rebase origin main
          git push origin main
