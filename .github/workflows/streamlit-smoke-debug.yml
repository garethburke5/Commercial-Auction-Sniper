name: Streamlit smoke debug

on:
  push:
    paths:
      - '.github/workflows/streamlit-smoke-debug.yml'
      - 'app.py'
      - 'legacy_app.py'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install app dependencies
        run: pip install -r requirements.txt
      - name: Execute app with Streamlit AppTest
        shell: bash
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file('app.py', default_timeout=120)
          at.run(timeout=120)
          print('EXCEPTION_COUNT', len(at.exception))
          for i, exc in enumerate(at.exception):
              print(f'--- EXCEPTION {i} ---')
              print(exc.value)
              print(exc.stack_trace)
          print('MARKDOWN_COUNT', len(at.markdown))
          print('INFO_COUNT', len(at.info))
          print('ERROR_COUNT', len(at.error))
          assert len(at.exception) == 0, 'Streamlit app raised an exception during script execution'
          assert len(at.markdown) + len(at.info) + len(at.error) > 0, 'Streamlit app produced no visible elements'
          PY
