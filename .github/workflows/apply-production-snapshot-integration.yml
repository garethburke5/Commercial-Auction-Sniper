name: Apply production snapshot integration

on:
  push:
    branches: [main]
    paths:
      - 'scripts/repair_production_snapshot_integration.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch production app
        run: python scripts/repair_production_snapshot_integration.py
      - name: Verify syntax and integration
        run: |
          python -m py_compile app.py
          grep -q 'V6.26-PRODUCTION-INTEGRATION' app.py
          grep -q 'data/properties.json' app.py
      - name: Commit production integration
        run: |
          git config user.name 'Auction Sniper Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app.py
          git diff --cached --quiet && exit 0
          git commit -m 'Release V6.26 production snapshot integration'
          git push origin main
