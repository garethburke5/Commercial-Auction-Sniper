name: Savills 2014 Exact WARC Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/savills-2014-exact-warc-probe.yml'
      - 'savills_2014_exact_warc_probe.py'

permissions:
  contents: write

concurrency:
  group: savills-2014-exact-warc-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile probe
        run: python -m py_compile savills_2014_exact_warc_probe.py savills_archived_catalogue_frontier_recovery.py
      - name: Probe exact 24 April 2014 first-party archive bodies
        run: python savills_2014_exact_warc_probe.py
      - name: Validate blocker and implemented next route
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/historical_backfill_progress.json').read_text())
          s=(p.get('sources') or {}).get('Savills Auctions') or {}
          b=s.get('exact_2014_warc_probe_last_blocker') or {}
          assert b.get('frontier_date')=='2014-04-24', b
          assert b.get('route')=='bounded-commoncrawl-2014-pastauctions-venue-lotlist-body-probe', b
          assert b.get('next_safe_route'), b
          assert Path('savills_archived_catalogue_frontier_recovery.py').exists()
          assert Path('data/property_history.json').exists()
          print('BLOCKER',b)
          PY
      - name: Publish exact blocker
        run: |
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/historical_backfill_progress.json data/source_diagnostics
          git commit -m 'Persist exact Savills 24 April 2014 WARC blocker'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
