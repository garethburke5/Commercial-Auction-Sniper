name: Savills Owned Domain PDF Frontier Recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/savills-owned-domain-pdf-frontier.yml'
      - 'savills_owned_domain_pdf_frontier_recovery.py'
  schedule:
    - cron: '57 * * * *'

permissions:
  contents: write

concurrency:
  group: savills-owned-domain-frontier
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile recovery
        run: python -m py_compile savills_owned_domain_pdf_frontier_recovery.py savills_legacy_aid_capture_recovery.py savills_manifest_commoncrawl_frontier_recovery.py history_database.py collectors/savills.py
      - name: Recover frontier from all Savills-owned archived document namespaces
        run: python savills_owned_domain_pdf_frontier_recovery.py --max-index-rows 420 --max-bodies 180 --max-live 100
      - name: Validate persisted outcome
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/historical_backfill_progress.json').read_text())
          h=json.loads(Path('data/property_history.json').read_text())
          s=(p.get('sources') or {}).get('Savills Auctions') or {}
          run=s.get('savills_owned_pdf_frontier_last_run') or {}
          assert run.get('frontier_date'), 'Missing exact Savills frontier date'
          assert s.get('historically_complete') is False
          events=[e for e in h.get('auction_events',[]) if e.get('source')=='Savills Auctions']
          assert len(events)==int(run.get('savills_events_after') or len(events))
          if int(run.get('canonical_events_added') or 0)==0:
              blocker=s.get('savills_owned_pdf_frontier_last_blocker') or {}
              assert blocker.get('frontier_date')==run.get('frontier_date')
              assert blocker.get('next_safe_route')
          print('SAVILLS_EVENTS',len(events))
          print('OLDEST_VERIFIED',s.get('earliest_date_reached') or s.get('earliest_month_reached'))
          print('RUN',run)
          PY
      - name: Publish canonical history or exact blocker
        run: |
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/property_history.json data/historical_backfill_progress.json data/source_diagnostics || true
          if ! git diff --cached --quiet; then
            git commit -m 'Probe Savills-owned archived document frontier'
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
