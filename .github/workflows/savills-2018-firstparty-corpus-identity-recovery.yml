name: Savills 2018 Full First-Party Corpus Identity Recovery

on:
  workflow_dispatch:
  push:
    paths:
      - 'savills_2018_firstparty_corpus_identity_recovery.py'
      - '.github/workflows/savills-2018-firstparty-corpus-identity-recovery.yml'

permissions:
  contents: write

concurrency:
  group: savills-2018-firstparty-corpus-identity-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 lxml
      - name: Compile
        run: python -m py_compile savills_2018_firstparty_corpus_identity_recovery.py
      - name: Crawl all persisted first-party lot-detail URLs
        run: python savills_2018_firstparty_corpus_identity_recovery.py
      - name: Preserve recovery evidence
        run: cp data/source_diagnostics/savills_2018_firstparty_corpus_identity_recovery.json /tmp/savills_2018_corpus_recovery.json
      - name: Apply to freshest production main and publish conflict-safe
        run: |
          set -euo pipefail
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/savills_2018_corpus_recovery.json data/source_diagnostics/savills_2018_firstparty_corpus_identity_recovery.json
            python savills_2018_firstparty_corpus_identity_recovery.py --apply-only
            python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/source_diagnostics/savills_2018_firstparty_corpus_identity_recovery.json').read_text())
          p=json.loads(Path('data/historical_backfill_progress.json').read_text())
          s=p['sources']['Savills Auctions']
          r=s['savills_2018_firstparty_corpus_identity_last_run']
          print('CORPUS_LOT_URLS',d.get('source_corpus_lot_detail_urls'))
          print('UNRESOLVED_CONSIDERED',d.get('unresolved_lots_considered'))
          print('ROWS_READY',d.get('safe_unique_rows_ready'))
          print('CANONICAL_EVENTS',r.get('canonical_events_after'))
          print('OLDEST_VERIFIED',r.get('oldest_verified_lot_level_date'))
          print('2018_CANONICAL',r.get('year_2018_canonicalised'))
          print('2018_UNRESOLVED',r.get('year_2018_unresolved'))
          assert d.get('source_corpus_lot_detail_urls',0) >= 20000
          assert d.get('unresolved_lots_considered') == 58
          assert s.get('historically_complete') is False
          PY
            git add data/property_history.json data/historical_backfill_progress.json data/source_diagnostics/savills_2018_firstparty_corpus_identity_recovery.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Persist Savills 2018 full first-party corpus identity recovery'
            if git push origin HEAD:main; then exit 0; fi
            git reset --hard HEAD~1
            sleep $((attempt*5))
          done
          exit 1
# trigger: full-corpus-reconciliation
