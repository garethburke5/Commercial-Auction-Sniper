name: Apply Pugh BTG exact URL first
on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/apply-pugh-exact-url-first.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - run: python scripts/apply_pugh_exact_url_first.py
      - name: Commit exact URL hydration
        run: |
          git config user.name "Auction Sniper Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet && exit 0
          git commit -m "Use known Pugh BTG exact URLs before catalogue discovery"
          git push origin develop
