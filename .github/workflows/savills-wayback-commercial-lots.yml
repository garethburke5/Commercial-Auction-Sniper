name: Savills Wayback Commercial Lots
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/savills-wayback-commercial-lots.yml'
      - 'savills_wayback_commercial_lot_recovery.py'
      - 'savills_wayback_auc675_promote.py'
permissions:
  contents: write
concurrency:
  group: savills-wayback-commercial-lots
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python -m py_compile savills_wayback_commercial_lot_recovery.py savills_wayback_auc675_promote.py history_database.py
      - name: Recover archived Savills commercial lot pages
        run: python savills_wayback_commercial_lot_recovery.py
      - name: Promote explicit first-party Auc 675 lot evidence
        run: python savills_wayback_auc675_promote.py
      - name: Verify source state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path('data/property_history.json').read_text())
          p=json.loads(Path('data/historical_backfill_progress.json').read_text())
          s=p['sources']['Savills Auctions']; d=s.get('savills_wayback_auc675_promotion_last_run') or {}
          count=sum(1 for e in h.get('auction_events',[]) if e.get('source')=='Savills Auctions')
          print('SAVILLS_EVENTS',count)
          print('EARLIEST_VERIFIED',s.get('earliest_date_reached'))
          print('PROMOTION',json.dumps(d))
          assert count == d.get('canonical_events_after')
          assert s.get('historically_complete') is False
          assert s.get('discovery_exhausted') is False
          PY
      - name: Preserve result
        run: |
          cp data/property_history.json /tmp/savills_direct_history.json
          cp data/historical_backfill_progress.json /tmp/savills_direct_progress.json
          cp data/source_diagnostics/savills_wayback_commercial_lot_recovery.json /tmp/savills_direct_diag.json
          cp data/source_diagnostics/savills_wayback_auc675_promotion.json /tmp/savills_promotion_diag.json
      - name: Publish conflict-safe canonical history and progress
        run: |
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/savills_direct_history.json data/property_history.json
            python - <<'PY'
          import json
          from pathlib import Path
          fp=Path('data/historical_backfill_progress.json')
          fresh=json.loads(fp.read_text()); recovered=json.loads(Path('/tmp/savills_direct_progress.json').read_text())
          fs=fresh.setdefault('sources',{}).setdefault('Savills Auctions',{}); rs=recovered['sources']['Savills Auctions']
          keys=('savills_wayback_commercial_lot_last_run','savills_wayback_auc675_promotion_last_run','propertyauctions_cursor_last_blocker','last_history_event_count','lots_captured','earliest_date_reached','earliest_month_reached','last_success','last_discovery_mode','status')
          for key in keys:
              if key in rs: fs[key]=rs[key]
          fs['historically_complete']=False; fs['discovery_exhausted']=False
          fresh['updated_at']=recovered.get('updated_at',fresh.get('updated_at')); fp.write_text(json.dumps(fresh,indent=2,ensure_ascii=False))
          Path('data/source_diagnostics/savills_wayback_commercial_lot_recovery.json').write_text(Path('/tmp/savills_direct_diag.json').read_text())
          Path('data/source_diagnostics/savills_wayback_auc675_promotion.json').write_text(Path('/tmp/savills_promotion_diag.json').read_text())
          PY
            git add data/property_history.json data/historical_backfill_progress.json data/source_diagnostics/savills_wayback_commercial_lot_recovery.json data/source_diagnostics/savills_wayback_auc675_promotion.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Persist validated Savills May 2010 lots'
            if git push origin HEAD:main; then exit 0; fi
            git reset --hard HEAD~1
            sleep $((attempt * 3))
          done
          exit 1
