name: Savills PropertyAuctions Results Archive Recovery

on:
  push:
    branches: [main]
    paths:
      - 'savills_propertyauctions_results_archive_recovery.py'
      - '.github/workflows/savills-propertyauctions-results-archive.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: savills-propertyauctions-results-archive
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile savills_propertyauctions_results_archive_recovery.py
      - name: Recover legacy Savills results archive
        run: python savills_propertyauctions_results_archive_recovery.py --workers 28 --max-details 500
      - name: Verify canonical Savills state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path('data/property_history.json').read_text())
          p=json.loads(Path('data/historical_backfill_progress.json').read_text())
          s=p['sources']['Savills Auctions']
          events=[e for e in h.get('auction_events',[]) if e.get('source')=='Savills Auctions']
          assert s.get('historically_complete') is False
          print('SAVILLS_EVENTS',len(events))
          print('EARLIEST_VERIFIED',s.get('earliest_date_reached'))
          d=s.get('propertyauctions_results_archive_last_run') or {}
          print('ARCHIVE_ROUTE',json.dumps({k:d.get(k) for k in ('savills_auctions_found','oldest_savills_archive_date','commercial_mixed_lot_clues','detail_urls_exposed','canonical_events_added')},ensure_ascii=False))
          PY
      - name: Publish canonical history or exact blocker
        run: |
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/property_history.json data/historical_backfill_progress.json data/source_diagnostics || true
          if ! git diff --cached --quiet; then
            git commit -m 'Recover Savills legacy results archive evidence'
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
