name: Savills PropertyAuctions Detail Identifier Recovery
on:
  push:
    branches: [main]
    paths:
      - 'savills_propertyauctions_detail_identifier_recovery.py'
      - '.github/workflows/savills-propertyauctions-detail-identifiers.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: savills-propertyauctions-detail-identifiers
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python -m py_compile savills_propertyauctions_detail_identifier_recovery.py
      - name: Mine legacy detail identifiers
        run: python savills_propertyauctions_detail_identifier_recovery.py
      - name: Publish identifier evidence or exact blocker
        run: |
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/historical_backfill_progress.json data/source_diagnostics || true
          if ! git diff --cached --quiet; then
            git commit -m 'Mine Savills legacy detail identifiers'
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
