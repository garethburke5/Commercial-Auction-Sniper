name: Savills PropertyAuctions Detail Identifier Recovery
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: savills-propertyauctions-detail-identifiers
  cancel-in-progress: true
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python -m py_compile savills_propertyauctions_detail_identifier_recovery.py
      - name: Recover structured documents and exact tuple fingerprints
        run: python savills_propertyauctions_detail_identifier_recovery.py
      - name: Verify canonical Savills state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path('data/property_history.json').read_text())
          p=json.loads(Path('data/historical_backfill_progress.json').read_text())
          s=p['sources']['Savills Auctions']
          ev=[e for e in h.get('auction_events',[]) if e.get('source')=='Savills Auctions']
          print('SAVILLS_EVENTS',len(ev))
          print('EARLIEST_VERIFIED',s.get('earliest_date_reached'))
          print('LAST_MODE',s.get('last_discovery_mode'))
          assert s.get('historically_complete') is False
          PY
      - name: Publish recovery evidence or exact blocker
        run: |
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/property_history.json data/historical_backfill_progress.json data/source_diagnostics || true
          if ! git diff --cached --quiet; then
            git commit -m 'Run Savills structured document and tuple recovery'
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
