name: Property gallery and fee evidence
on:
  workflow_dispatch:
  schedule:
    - cron: '35 6 * * *'
  workflow_run:
    workflows: ['Auction Sniper Publish Now', 'Auction Sniper Scan']
    types: [completed]
permissions:
  contents: write
concurrency:
  group: property-detail-evidence
  cancel-in-progress: false
jobs:
  refresh:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 lxml
      - run: python -m web_platform.enrichment --limit 150
      - name: Preserve recovered evidence
        run: |
          git config user.name "Auction Sniper"
          git config user.email "auction-sniper@users.noreply.github.com"
          git add web_platform/property_evidence.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh exact-lot galleries and buyer-fee evidence"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
