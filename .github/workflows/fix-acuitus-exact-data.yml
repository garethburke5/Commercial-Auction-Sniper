name: Fix Acuitus exact data
on:
  push:
    paths:
      - 'scripts/fix_acuitus_exact_data.py'
      - '.github/workflows/fix-acuitus-exact-data.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/fix_acuitus_exact_data.py
      - run: python -m py_compile app.py
      - name: Smoke test
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          at=AppTest.from_file('app.py',default_timeout=20).run()
          print('exceptions',len(at.exception))
          assert not at.exception
          PY
      - name: Commit repair
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add app.py auction_sniper_cache.json app/static/property_images
          git commit -m 'Fix Acuitus property images and structured facts'
          git push
