name: Clive Emson Full Historical Results Backfill
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/clive_emson_historical_bulk.py'
      - '.github/workflows/clive-emson-historical-bulk.yml'
permissions:
  contents: write
concurrency:
  group: clive-emson-full-historical-results
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile bulk collector
        run: python -m py_compile scripts/clive_emson_historical_bulk.py history_database.py
      - name: Harvest every public Clive Emson historical results auction
        run: python scripts/clive_emson_historical_bulk.py
      - name: Validate and persist corpus and canonical database
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          raw=json.loads(Path('data/historical_raw/clive_emson_results.json').read_text())
          hist=json.loads(Path('data/property_history.json').read_text())
          prog=json.loads(Path('data/historical_backfill_progress.json').read_text())
          rows=raw.get('records',[])
          ce=[e for e in hist.get('auction_events',[]) if e.get('source')=='Clive Emson']
          st=prog.get('sources',{}).get('Clive Emson',{})
          print('CLIVE_EMSON_VALIDATION raw',len(rows),'canonical',len(ce),'auctions',st.get('auctions_completed'),'/',st.get('auctions_discovered'),'status',st.get('status'))
          assert rows, 'zero Clive Emson historical rows harvested'
          assert ce, 'zero Clive Emson rows reached canonical history'
          assert all(r.get('url') and r.get('address') and r.get('source_id') for r in rows), 'raw corpus missing identity/evidence fields'
          PY
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/historical_raw/clive_emson_results.json data/property_history.json data/historical_backfill_progress.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Ingest Clive Emson historical auction results corpus'
          git pull --rebase origin main
          git push origin HEAD:main
