name: Apply data regressions once
on:
  push:
    paths:
      - 'scripts/apply_data_regressions_once.py'
      - '.github/workflows/data-regressions-once.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply targeted regressions
        run: python scripts/apply_data_regressions_once.py
      - name: Install and test
        run: |
          pip install -r requirements.txt
          python -m py_compile collectors/clive_emson.py property_summary.py tests/test_clive_emson_truro_regression.py tests/test_acuitus_vat_negative.py
          python -m unittest tests.test_clive_emson_truro_regression tests.test_acuitus_vat_negative -v
      - name: Commit code and tests
        run: |
          git config user.name "Auction Sniper Stabilisation Bot"
          git config user.email "actions@users.noreply.github.com"
          git add collectors/clive_emson.py property_summary.py tests/test_clive_emson_truro_regression.py tests/test_acuitus_vat_negative.py
          git commit -m "Capture Truro part-let rent and asset-management facts"
          git pull --rebase origin main
          git push origin HEAD:main
