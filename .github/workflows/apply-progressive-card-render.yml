name: Apply progressive card rendering

on:
  push:
    paths:
      - '.github/workflows/apply-progressive-card-render.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch progressive rendering
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py')
          s=p.read_text(encoding='utf-8')
          old='    cards=[]\n    for x in lots:\n'
          new='''    class _ProgressiveCards(list):\n        def append(self,item):\n            super().append(item)\n            if len(self)==12:\n                st.markdown('<div class="cards progressiveFirst">'+"".join(self)+'</div>',unsafe_allow_html=True)\n    cards=_ProgressiveCards()\n    for x in lots:\n'''
          if old not in s:
              raise SystemExit('card loop anchor not found')
          s=s.replace(old,new,1)
          old2='    st.markdown(\'<div class="cards">\'+"".join(cards)+\'</div>\',unsafe_allow_html=True)\n'
          new2='''    if len(cards) > 12:\n        st.markdown('<div class="cards progressiveRest">'+"".join(cards[12:])+'</div>',unsafe_allow_html=True)\n    elif len(cards) < 12:\n        st.markdown('<div class="cards progressiveFirst">'+"".join(cards)+'</div>',unsafe_allow_html=True)\n'''
          if old2 not in s:
              raise SystemExit('final board markdown anchor not found')
          s=s.replace(old2,new2,1)
          # Remove visual gap between the two grid batches while preserving identical card layout.
          css='\n<style>.progressiveFirst{margin-bottom:0!important}.progressiveRest{margin-top:0!important}</style>\n'
          marker='with lots_tab:\n'
          s=s.replace(marker,css+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile app.py
      - name: Install app and browser tooling
        run: |
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Start Streamlit
        run: |
          nohup streamlit run app.py --server.headless true --server.port 8501 > /tmp/streamlit.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify browser timing and exact card count
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import time
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(viewport={"width":1440,"height":1000})
              t0=time.perf_counter()
              page.goto('http://127.0.0.1:8501',wait_until='commit',timeout=60000)
              page.wait_for_selector('.hero',timeout=60000)
              hero=time.perf_counter()-t0
              page.wait_for_selector('.progressiveFirst .card',timeout=60000)
              first=time.perf_counter()-t0
              page.wait_for_function('document.querySelectorAll(".cards .card").length === 159',timeout=60000)
              full=time.perf_counter()-t0
              count=page.locator('.cards .card').count()
              first_count=page.locator('.progressiveFirst .card').count()
              rest_count=page.locator('.progressiveRest .card').count()
              print(f'hero={hero:.3f}s first={first:.3f}s hero_to_first={first-hero:.3f}s full={full:.3f}s count={count} first_count={first_count} rest_count={rest_count}')
              assert count==159
              assert first_count==12
              assert rest_count==147
              assert first-hero < 0.5
              browser.close()
          PY
      - name: Commit production patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Render first property cards immediately"
          git push
