name: Fix Bond Wolfe images

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-bond-wolfe-images.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 lxml
      - name: Repair Bond Wolfe exact property images
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          H={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36'}

          def exact_image(url):
              r=requests.get(url,headers=H,timeout=25)
              r.raise_for_status()
              s=BeautifulSoup(r.text,'lxml')
              found=[]
              for tag in s.find_all(['img','source','a']):
                  vals=[]
                  for a in ('src','data-src','data-lazy-src','data-original','href'):
                      if tag.get(a): vals.append(tag.get(a))
                  for a in ('srcset','data-srcset'):
                      ss=tag.get(a)
                      if ss: vals.extend(x.strip().split(' ')[0] for x in ss.split(',') if x.strip())
                  for v in vals:
                      u=urljoin(url,v); low=u.lower()
                      if 'cdn.eigpropertyauctions.co.uk/ams/images/' not in low: continue
                      if any(x in low for x in ('logo','icon','placeholder','map','floorplan')): continue
                      score=(30 if 'web_large' in low else 25 if 'web_medium' in low else 10 if 'web_small' in low else 0)
                      if re.search(r'/auction/\d+/\d+_web_',low): score+=20
                      found.append((score,u))
              if not found:
                  raw=r.text.replace('\\/','/')
                  for u in re.findall(r'https://cdn\.eigpropertyauctions\.co\.uk/ams/images/[^"\'<>\s]+',raw,re.I):
                      low=u.lower()
                      if any(x in low for x in ('logo','icon','placeholder','map','floorplan')): continue
                      score=(30 if 'web_large' in low else 25 if 'web_medium' in low else 10 if 'web_small' in low else 0)
                      found.append((score,u))
              if not found: return None
              found.sort(key=lambda z:(z[0],len(z[1])),reverse=True)
              return found[0][1]

          def patch(path,key):
              p=Path(path)
              d=json.loads(p.read_text(encoding='utf-8'))
              rows=d.get('properties',[])
              targets=fixed=0
              for row in rows:
                  if row.get('source')!='Bond Wolfe': continue
                  targets+=1
                  u=row.get('url') or ''
                  try:
                      img=exact_image(u)
                      if not img: raise RuntimeError('no EIG gallery image')
                      row[key]=img
                      fixed+=1
                      print('BOND_IMAGE',row.get('address'),img)
                  except Exception as e:
                      print('BOND_IMAGE_FAIL',u,repr(e))
              p.write_text(json.dumps(d,indent=2,ensure_ascii=False),encoding='utf-8')
              if targets and fixed != targets:
                  raise SystemExit(f'{path}: repaired {fixed}/{targets} Bond Wolfe rows')
              print(path,targets,fixed)

          patch('data/properties.json','image_url')
          patch('auction_sniper_cache.json','image')
          PY
      - name: Validate images and app
        run: |
          python -m py_compile collectors/bond_wolfe.py app.py
          python - <<'PY'
          import json
          from pathlib import Path
          for fn,key in [('data/properties.json','image_url'),('auction_sniper_cache.json','image')]:
              d=json.loads(Path(fn).read_text())
              rows=[r for r in d.get('properties',[]) if r.get('source')=='Bond Wolfe']
              bad=[r for r in rows if 'cdn.eigpropertyauctions.co.uk/ams/images/' not in str(r.get(key) or '')]
              print(fn,'Bond Wolfe',len(rows),'bad',len(bad))
              assert not bad,bad[:2]
          PY
      - name: Commit repaired Bond Wolfe images
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add collectors/bond_wolfe.py data/properties.json auction_sniper_cache.json
          if git diff --cached --quiet; then
            echo 'No changes required'
          else
            git commit -m 'Fix Bond Wolfe property images end-to-end'
            git push
          fi
