name: Diagnose Strettons images
on:
  push:
    paths:
      - '.github/workflows/diagnose-strettons-images.yml'
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 lxml
      - name: Inspect exact Strettons image markup
        run: |
          python - <<'PY'
          import requests,re,json
          from bs4 import BeautifulSoup
          u='https://www.strettons.co.uk/auction-commercial-property-for-sale/commercial-mixed-use-for-sale-in-1-bruce-grove-tottenham-london-haringey-n17-6ra-6a7f2d71cf4bc9ebb1c9e868/'
          h={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept':'text/html,application/xhtml+xml','Referer':'https://www.strettons.co.uk/auction-commercial-property/for-sale/'}
          r=requests.get(u,headers=h,timeout=20)
          print('STATUS',r.status_code,'LEN',len(r.text),'TYPE',r.headers.get('content-type'))
          s=BeautifulSoup(r.text,'lxml')
          for m in s.find_all('meta'):
              k=(m.get('property') or m.get('name') or '').lower()
              if 'image' in k: print('META',k,m.get('content'))
          for i,img in enumerate(s.find_all('img')[:80]):
              print('IMG',i,{a:img.get(a) for a in ('src','data-src','data-lazy-src','data-original','srcset','data-srcset','alt') if img.get(a)})
          for i,tag in enumerate(s.find_all(attrs={'style':True})[:100]):
              st=tag.get('style','')
              if 'url(' in st: print('STYLE',i,st[:500])
          urls=[]
          for pat in [r'https?:\\?/\\?/[^"\'<> ]+',r'https?://[^"\'<> ]+']:
              for x in re.findall(pat,r.text,re.I):
                  x=x.replace('\\/','/')
                  if any(ext in x.lower() for ext in ('.jpg','.jpeg','.png','.webp','image','ggfx','cloudfront','amazonaws')):
                      urls.append(x[:800])
          print('RAW_CANDIDATES')
          for x in list(dict.fromkeys(urls))[:100]: print(x)
          PY
