name: Savills Archived Catalogue Frontier Recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/savills-archived-catalogue-frontier.yml'
      - 'savills_archived_catalogue_frontier_recovery.py'
  schedule:
    - cron: '53 * * * *'

permissions:
  contents: write

concurrency:
  group: auction-sniper-production-scan
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile archived catalogue recovery
        run: python -m py_compile savills_archived_catalogue_frontier_recovery.py savills_manifest_commoncrawl_frontier_recovery.py savills_legacy_aid_capture_recovery.py history_database.py collectors/savills.py
      - name: Recover exact oldest unresolved Savills auction from archived catalogue and brochure bodies
        run: python savills_archived_catalogue_frontier_recovery.py --max-html-rows 260 --max-pdf-rows 160 --max-warc 150 --max-live 100
      - name: Validate acceptable persisted outcome
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/historical_backfill_progress.json').read_text())
          h=json.loads(Path('data/property_history.json').read_text())
          s=(p.get('sources') or {}).get('Savills Auctions') or {}
          run=s.get('archived_catalogue_frontier_last_run') or {}
          assert run.get('frontier_date'), 'No exact Savills frontier recorded'
          assert s.get('historically_complete') is False
          added=int(run.get('canonical_events_added') or 0)
          if added == 0:
              b=s.get('archived_catalogue_frontier_last_blocker') or {}
              assert b.get('frontier_date') == run.get('frontier_date')
              assert b.get('route') == run.get('route')
              assert b.get('next_safe_route'), 'Zero-event run lacks implemented next-route specification'
          events=[e for e in h.get('auction_events',[]) if e.get('source')=='Savills Auctions']
          assert len(events) == int(run.get('savills_events_after') or len(events))
          print('SAVILLS_EVENTS',len(events))
          print('EARLIEST_VERIFIED',s.get('earliest_date_reached') or s.get('earliest_month_reached'))
          print('ARCHIVED_CATALOGUE_RUN',run)
          PY
      - name: Publish canonical history or exact source blocker
        run: |
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/property_history.json data/historical_backfill_progress.json data/source_diagnostics || true
          if ! git diff --cached --quiet; then
            git commit -m 'Probe Savills 2014 archived catalogue frontier'
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
