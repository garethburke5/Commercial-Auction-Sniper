name: Savills Candidate URL WARC Recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'savills_candidate_url_warc_recovery.py'
      - '.github/workflows/savills-candidate-url-warc-recovery.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile savills_candidate_url_warc_recovery.py collectors/savills.py history_database.py
      - name: Recover archived copies of exact candidate URLs
        run: python savills_candidate_url_warc_recovery.py
      - name: Verify and publish
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path('data/property_history.json').read_text())
          p=json.loads(Path('data/historical_backfill_progress.json').read_text())
          ev=[e for e in h.get('auction_events',[]) if e.get('source')=='Savills Auctions']
          dates=sorted(e.get('auction_date') for e in ev if e.get('auction_date'))
          s=(p.get('sources') or {}).get('Savills Auctions') or {};r=s.get('candidate_url_warc_last_run') or {}
          assert s.get('historically_complete') is False
          print('SAVILLS',len(ev),dates[0] if dates else None)
          print('CANDIDATE_URLS',r.get('candidate_urls'))
          print('CAPTURES',len(r.get('capture_records') or []))
          print('SAVILLS_URLS',sum(len(v) for v in (r.get('direct_savills_urls_by_date') or {}).values()))
          print('ASSET_CLUES',len(r.get('asset_id_clues') or []))
          print('VALIDATED',r.get('verified_first_party_rows'))
          print('ADDED',r.get('canonical_events_added'))
          PY
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/property_history.json data/historical_backfill_progress.json data/source_diagnostics
          if ! git diff --cached --quiet; then
            git commit -m 'Advance Savills frontier through archived candidate URLs'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
