name: Verify Auction House regional images live
on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/verify-auction-house-regional-images-live.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - run: pip install requests beautifulsoup4
      - name: Verify seeded regional exact pages and lot images
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          src=Path('app.py').read_text(encoding='utf-8')
          section=src.split('# Auction House regional',1)[1].split('# Pugh / BTG Eddisons',1)[0]
          rows=[]
          for m in re.finditer(r'dict\(source="(Auction House [^"]+)".*?url="([^"]+)".*?\)',section,re.S):
              block=m.group(0)
              lotm=re.search(r'lot="([^"]+)"',block)
              addrm=re.search(r'address="([^"]+)"',block)
              im=re.search(r'image="([^"]+)"',block)
              if lotm and addrm:
                  rows.append((m.group(1),lotm.group(1),addrm.group(1),m.group(2),im.group(1) if im else None))
          assert len(rows)>=10, len(rows)

          sess=requests.Session(); sess.headers.update({'User-Agent':'Mozilla/5.0'})
          good=[]; discovered=[]; bad=[]
          for source,lot,addr,url,seed_img in rows:
              try:
                  r=sess.get(url,timeout=18); r.raise_for_status()
              except Exception as e:
                  bad.append((source,lot,'PAGE',getattr(getattr(e,'response',None),'status_code',None))); continue
              s=BeautifulSoup(r.text,'html.parser')
              candidates=[]
              for img in s.find_all('img'):
                  for attr in ('data-src','data-lazy-src','data-original','src'):
                      v=img.get(attr)
                      if v: candidates.append(urljoin(url,v))
                  ss=img.get('srcset') or img.get('data-srcset')
                  if ss:
                      candidates += [urljoin(url,x.strip().split(' ')[0]) for x in ss.split(',') if x.strip()]
              for a in s.find_all('a',href=True):
                  candidates.append(urljoin(url,a['href']))
              property_imgs=[]
              for u in candidates:
                  low=u.lower()
                  if '/lot-image/' not in low: continue
                  if any(x in low for x in ('logo','icon','avatar','placeholder')): continue
                  if u not in property_imgs: property_imgs.append(u)
              selected=seed_img or (property_imgs[0] if property_imgs else None)
              if not selected:
                  bad.append((source,lot,'NO IMAGE')); continue
              try:
                  ir=sess.get(selected,timeout=18)
              except Exception:
                  bad.append((source,lot,'IMAGE TIMEOUT')); continue
              if ir.status_code!=200 or not ir.headers.get('content-type','').lower().startswith('image/'):
                  bad.append((source,lot,'BAD IMAGE',ir.status_code)); continue
              good.append((source,lot,selected))
              if selected!=seed_img: discovered.append((source,lot,addr,selected))

          print('REGIONAL VERIFIED',len(good),'OF',len(rows))
          for x in discovered: print('DISCOVERED',x)
          for x in bad: print('BAD',x)
          assert len(good)==len(rows), f'{len(good)}/{len(rows)} regional images verified'
          PY
