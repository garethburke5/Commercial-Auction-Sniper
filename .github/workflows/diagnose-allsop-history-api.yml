name: Diagnose Allsop Historical API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-allsop-history-api.yml'
      - 'scripts/diagnose_allsop_history_api.py'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install diagnostic dependencies
        run: |
          pip install playwright
          python -m playwright install chromium
      - name: Trace Allsop historical result traffic
        run: python scripts/diagnose_allsop_history_api.py
