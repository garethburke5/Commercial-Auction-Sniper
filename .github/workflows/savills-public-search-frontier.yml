name: Savills Public Search Frontier Recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/savills-public-search-frontier.yml'
      - 'savills_public_search_frontier_recovery.py'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml
      - name: Compile public-index recovery
        run: python -m py_compile savills_public_search_frontier_recovery.py history_database.py collectors/savills.py
      - name: Recover oldest Savills frontier from public search indexes
        run: python savills_public_search_frontier_recovery.py --max-candidates 80
      - name: Validate acceptable outcome
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          from urllib.parse import parse_qs,urlparse
          h=json.loads(Path('data/property_history.json').read_text())
          p=json.loads(Path('data/historical_backfill_progress.json').read_text())
          s=(p.get('sources') or {}).get('Savills Auctions') or {}
          events=[e for e in h.get('auction_events',[]) if e.get('source')=='Savills Auctions']
          def exact(url):
              q=urlparse(url or '')
              if q.scheme!='https' or (q.hostname or '').lower()!='auctions.savills.co.uk': return False
              low=(q.path or '').lower(); args=parse_qs(q.query)
              if ('lotdetails' in low or 'index.php' in low) and (args.get('pid') or (args.get('view')==['commission'] and args.get('id'))): return True
              return bool(re.search(r'/auctions/[^/?#]+-\d+/(?:[^/?#]+-)?\d+/?$',q.path or '',re.I))
          bad=[e for e in events if not exact((e.get('source_evidence') or {}).get('listing_url'))]
          assert not bad, f'{len(bad)} Savills events lack lot-specific evidence'
          public=s.get('public_search_frontier_last_run') or {}
          assert public, 'Public-search route produced no persisted outcome'
          if not public.get('canonical_events_added'):
              blocker=s.get('public_search_frontier_last_blocker') or {}
              assert blocker.get('frontier_date') and blocker.get('route') and blocker.get('next_safe_route')
          print('SAVILLS_EVENTS',len(events))
          print('EARLIEST_VERIFIED',s.get('earliest_date_reached'))
          print('PUBLIC_SEARCH_FRONTIER',public)
          PY
      - name: Publish canonical history or exact blocker
        run: |
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/property_history.json data/historical_backfill_progress.json data/source_diagnostics || true
          if ! git diff --cached --quiet; then
            git commit -m 'Advance Savills frontier through public search indexes'
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
