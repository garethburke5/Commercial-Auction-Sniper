name: Savills 2019 Frontier Resilient Recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/savills-2019-frontier-resilient.yml'
      - 'savills_legacy_aid_capture_recovery_resilient.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auction-sniper-production-scan
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile recovery routes
        run: |
          python -m py_compile savills_legacy_aid_capture_recovery_resilient.py savills_legacy_aid_capture_recovery.py savills_legacy_exact_parallel_recovery.py history_database.py collectors/savills.py

      - name: Attack exact 2019 frontier with distinct bounded routes
        shell: bash
        run: |
          set +e
          BEFORE=$(python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/historical_backfill_progress.json').read_text())
          s=(p.get('sources') or {}).get('Savills Auctions') or {}
          print(str(s.get('earliest_date_reached') or '')+'|'+str(s.get('lots_captured') or 0))
          PY
          )
          echo "BEFORE=$BEFORE"

          timeout 480s python savills_legacy_aid_capture_recovery_resilient.py --year 2019 --max-live-checks 180
          AID_RC=$?
          echo "AID_ROUTE_RC=$AID_RC"

          MID=$(python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/historical_backfill_progress.json').read_text())
          s=(p.get('sources') or {}).get('Savills Auctions') or {}
          print(str(s.get('earliest_date_reached') or '')+'|'+str(s.get('lots_captured') or 0))
          PY
          )
          echo "MID=$MID"

          if [ "$MID" = "$BEFORE" ]; then
            echo 'Deterministic WARC route did not advance; attacking a different recovery path.'
            timeout 420s python savills_legacy_exact_parallel_recovery.py --max-live-checks 220
            EXACT_RC=$?
            echo "EXACT_PARALLEL_RC=$EXACT_RC"
          fi

          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          pp=Path('data/historical_backfill_progress.json')
          p=json.loads(pp.read_text(encoding='utf-8'))
          s=p.setdefault('sources',{}).setdefault('Savills Auctions',{})
          # Never claim completeness while the five first-party dated auctions remain unresolved.
          s['historically_complete']=False
          s['discovery_exhausted']=False
          s['status']='DISCOVERY EXPANSION'
          now=datetime.now(timezone.utc).isoformat()
          s['last_runtime_blocker']={
            'at': now,
            'route': 'https://index.commoncrawl.org/collinfo.json',
            'message': 'The Common Crawl collection-directory request timed out before WARC recovery. The repaired path bypasses that directory using the published deterministic 2019 collection IDs.',
            'repair': 'savills_legacy_aid_capture_recovery_resilient.py',
            'next_safe_route': 'savills_legacy_exact_parallel_recovery.py queries exact known aid endpoints directly across published 2019 Common Crawl indexes if the deterministic WARC prefix route does not advance History V2.',
            'known_unresolved_dates': ['2019-11-04','2019-09-23','2019-07-17','2019-05-29','2019-04-02']
          }
          p['updated_at']=now
          pp.write_text(json.dumps(p,indent=2,ensure_ascii=False),encoding='utf-8')
          PY

      - name: Validate canonical production files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse
          hp=Path('data/property_history.json')
          pp=Path('data/historical_backfill_progress.json')
          assert hp.exists() and pp.exists()
          db=json.loads(hp.read_text(encoding='utf-8'))
          progress=json.loads(pp.read_text(encoding='utf-8'))
          sav=[e for e in (db.get('auction_events') or []) if e.get('source')=='Savills Auctions']
          assert sav
          for e in sav:
              u=((e.get('source_evidence') or {}).get('listing_url') or '')
              host=(urlparse(u).hostname or '').lower()
              assert u.startswith('https://') and (host=='savills.co.uk' or host.endswith('.savills.co.uk')), u
          state=(progress.get('sources') or {}).get('Savills Auctions') or {}
          assert state.get('historically_complete') is False
          print('SAVILLS_EVENTS',len(sav))
          print('EARLIEST',state.get('earliest_date_reached'))
          print('LOTS_CAPTURED',state.get('lots_captured'))
          PY

      - name: Persist History V2 and frontier blocker/repair state
        run: |
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/property_history.json data/historical_backfill_progress.json data/source_diagnostics || true
          if ! git diff --cached --quiet; then
            git commit -m 'Recover Savills 2019 frontier via resilient archive routes'
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                exit 1
              fi
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
