name: Savills 2019 Frontier Resilient Recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/savills-2019-frontier-resilient.yml'
      - 'savills_legacy_aid_capture_recovery_resilient.py'
      - 'savills_legacy_catalogue_capture_link_recovery.py'
      - 'savills_legacy_exact_parallel_recovery.py'
      - 'savills_legacy_lotdetails_prefix_recovery.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auction-sniper-production-scan
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile recovery routes
        run: |
          python -m py_compile savills_legacy_aid_capture_recovery_resilient.py savills_legacy_aid_capture_recovery.py savills_legacy_catalogue_capture_link_recovery.py savills_legacy_exact_parallel_recovery.py savills_legacy_lotdetails_prefix_recovery.py history_database.py collectors/savills.py

      - name: Attack exact 2019 frontier with distinct bounded routes
        shell: bash
        run: |
          set +e
          snapshot() {
            python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/historical_backfill_progress.json').read_text())
          s=(p.get('sources') or {}).get('Savills Auctions') or {}
          print(str(s.get('earliest_date_reached') or '')+'|'+str(s.get('lots_captured') or 0))
          PY
          }

          BEFORE=$(snapshot)
          echo "BEFORE=$BEFORE"

          timeout 330s python savills_legacy_aid_capture_recovery_resilient.py --year 2019 --max-live-checks 180
          echo "AID_ROUTE_RC=$?"
          CURRENT=$(snapshot)

          if [ "$CURRENT" = "$BEFORE" ]; then
            timeout 360s python savills_legacy_catalogue_capture_link_recovery.py --year 2019 --max-live-checks 260
            echo "CATALOGUE_BODY_LINK_RC=$?"
            CURRENT=$(snapshot)
          fi

          if [ "$CURRENT" = "$BEFORE" ]; then
            timeout 260s python savills_legacy_exact_parallel_recovery.py --max-live-checks 220
            echo "EXACT_PARALLEL_RC=$?"
            CURRENT=$(snapshot)
          fi

          if [ "$CURRENT" = "$BEFORE" ]; then
            echo 'LotList/capture-body routes did not advance. Querying bounded LotDetails prefixes for already date-mapped legacy aids.'
            timeout 360s python savills_legacy_lotdetails_prefix_recovery.py --year 2019 --max-live-checks 260
            echo "LOTDETAILS_PREFIX_RC=$?"
            CURRENT=$(snapshot)
          fi

          echo "AFTER=$CURRENT"

          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          pp=Path('data/historical_backfill_progress.json')
          p=json.loads(pp.read_text(encoding='utf-8'))
          s=p.setdefault('sources',{}).setdefault('Savills Auctions',{})
          s['historically_complete']=False
          s['discovery_exhausted']=False
          s['status']='DISCOVERY EXPANSION'
          now=datetime.now(timezone.utc).isoformat()
          prefix=s.get('legacy_lotdetails_prefix_last_run') or {}
          body=s.get('legacy_catalogue_capture_link_last_run') or {}
          if int(prefix.get('canonical_events_added') or 0) == 0:
              s['last_runtime_blocker']={
                'at': now,
                'route': 'commoncrawl-bounded-lotdetails-aid-prefix-to-live-savills',
                'message': 'Archived Savills LotList WARC bodies exposed zero usable PID links. The distinct repair now queries the bounded legacy LotDetails namespace for each already date-mapped aid instead of repeating catalogue scans.',
                'failing_live_legacy_routes': [
                  'https://auctions.savills.co.uk/Auctions/LotList?aid=1087',
                  'https://auctions.savills.co.uk/Auctions/LotList?aid=1088',
                  'https://auctions.savills.co.uk/Auctions/LotList?aid=1089',
                  'https://auctions.savills.co.uk/Auctions/LotList?aid=1090'
                ],
                'previous_catalogue_body_pid_links_found': body.get('legacy_lot_links_found'),
                'direct_lotdetails_urls_found': prefix.get('legacy_lotdetails_urls'),
                'repair': 'savills_legacy_lotdetails_prefix_recovery.py',
                'repair_route': 'Common Crawl prefix query restricted to LotDetails?aid=<already-mapped-aid>, followed by surviving first-party Savills validation before History V2 persistence.',
                'next_safe_route': prefix.get('next_safe_route') or 'Use only exact PID-bearing LotDetails URLs already observed in persisted archive samples and fetch their archived bodies individually.',
                'known_unresolved_dates': ['2019-11-04','2019-09-23','2019-07-17','2019-05-29','2019-04-02']
              }
          p['updated_at']=now
          pp.write_text(json.dumps(p,indent=2,ensure_ascii=False),encoding='utf-8')
          PY

      - name: Validate canonical production files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse
          hp=Path('data/property_history.json')
          pp=Path('data/historical_backfill_progress.json')
          assert hp.exists() and pp.exists()
          db=json.loads(hp.read_text(encoding='utf-8'))
          progress=json.loads(pp.read_text(encoding='utf-8'))
          sav=[e for e in (db.get('auction_events') or []) if e.get('source')=='Savills Auctions']
          assert sav
          for e in sav:
              u=((e.get('source_evidence') or {}).get('listing_url') or '')
              host=(urlparse(u).hostname or '').lower()
              assert u.startswith('https://') and (host=='savills.co.uk' or host.endswith('.savills.co.uk')), u
          state=(progress.get('sources') or {}).get('Savills Auctions') or {}
          assert state.get('historically_complete') is False
          print('SAVILLS_EVENTS',len(sav))
          print('EARLIEST',state.get('earliest_date_reached'))
          print('LOTS_CAPTURED',state.get('lots_captured'))
          PY

      - name: Persist History V2 and frontier blocker/repair state
        run: |
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/property_history.json data/historical_backfill_progress.json data/source_diagnostics || true
          if ! git diff --cached --quiet; then
            git commit -m 'Probe bounded Savills 2019 LotDetails frontier'
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                exit 1
              fi
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
