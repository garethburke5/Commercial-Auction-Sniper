name: Savills 2019 Frontier Resilient Recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/savills-2019-frontier-resilient.yml'
      - 'savills_legacy_aid_capture_recovery_resilient.py'
      - 'savills_legacy_catalogue_capture_link_recovery.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auction-sniper-production-scan
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile recovery routes
        run: |
          python -m py_compile savills_legacy_aid_capture_recovery_resilient.py savills_legacy_aid_capture_recovery.py savills_legacy_catalogue_capture_link_recovery.py savills_legacy_exact_parallel_recovery.py history_database.py collectors/savills.py

      - name: Attack exact 2019 frontier with distinct bounded routes
        shell: bash
        run: |
          set +e
          BEFORE=$(python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/historical_backfill_progress.json').read_text())
          s=(p.get('sources') or {}).get('Savills Auctions') or {}
          print(str(s.get('earliest_date_reached') or '')+'|'+str(s.get('lots_captured') or 0))
          PY
          )
          echo "BEFORE=$BEFORE"

          timeout 360s python savills_legacy_aid_capture_recovery_resilient.py --year 2019 --max-live-checks 180
          AID_RC=$?
          echo "AID_ROUTE_RC=$AID_RC"

          MID=$(python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/historical_backfill_progress.json').read_text())
          s=(p.get('sources') or {}).get('Savills Auctions') or {}
          print(str(s.get('earliest_date_reached') or '')+'|'+str(s.get('lots_captured') or 0))
          PY
          )
          echo "MID=$MID"

          if [ "$MID" = "$BEFORE" ]; then
            echo 'WARC aid/date route did not persist lots; extracting LotDetails links from archived catalogue capture bodies.'
            timeout 420s python savills_legacy_catalogue_capture_link_recovery.py --year 2019 --max-live-checks 260
            BODY_RC=$?
            echo "CATALOGUE_BODY_LINK_RC=$BODY_RC"
          fi

          AFTER_BODY=$(python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/historical_backfill_progress.json').read_text())
          s=(p.get('sources') or {}).get('Savills Auctions') or {}
          print(str(s.get('earliest_date_reached') or '')+'|'+str(s.get('lots_captured') or 0))
          PY
          )
          echo "AFTER_BODY=$AFTER_BODY"

          if [ "$AFTER_BODY" = "$BEFORE" ]; then
            echo 'Catalogue-body extraction did not advance; attacking exact known aid endpoints as a distinct final route.'
            timeout 300s python savills_legacy_exact_parallel_recovery.py --max-live-checks 220
            EXACT_RC=$?
            echo "EXACT_PARALLEL_RC=$EXACT_RC"
          fi

          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          pp=Path('data/historical_backfill_progress.json')
          p=json.loads(pp.read_text(encoding='utf-8'))
          s=p.setdefault('sources',{}).setdefault('Savills Auctions',{})
          s['historically_complete']=False
          s['discovery_exhausted']=False
          s['status']='DISCOVERY EXPANSION'
          now=datetime.now(timezone.utc).isoformat()
          body=s.get('legacy_catalogue_capture_link_last_run') or {}
          s['last_runtime_blocker']={
            'at': now,
            'route': 'commoncrawl-warc-aid-date-to-live-savills-first-party',
            'message': '2019 legacy aid/date recovery mapped archived Savills LotList aid captures to exact auction dates but exposed zero usable lot URLs because pid-bearing LotDetails links are inside catalogue capture HTML rather than necessarily present as Common Crawl index-row URLs.',
            'failing_live_legacy_routes': [
              'https://auctions.savills.co.uk/Auctions/LotList?aid=1087',
              'https://auctions.savills.co.uk/Auctions/LotList?aid=1088',
              'https://auctions.savills.co.uk/Auctions/LotList?aid=1089',
              'https://auctions.savills.co.uk/Auctions/LotList?aid=1090'
            ],
            'repair': 'savills_legacy_catalogue_capture_link_recovery.py',
            'repair_route': 'Parse archived Savills LotList WARC capture bodies for exact LotDetails?aid=...&pid=... links, then require a surviving first-party Savills page before canonical History V2 persistence.',
            'repair_last_lot_links_found': body.get('legacy_lot_links_found'),
            'next_safe_route': body.get('next_safe_route') or 'Query exact legacy LotDetails URL prefixes by recovered aid across deterministic 2019 Common Crawl indexes, then validate surviving first-party Savills pages before persistence.',
            'known_unresolved_dates': ['2019-11-04','2019-09-23','2019-07-17','2019-05-29','2019-04-02']
          }
          p['updated_at']=now
          pp.write_text(json.dumps(p,indent=2,ensure_ascii=False),encoding='utf-8')
          PY

      - name: Validate canonical production files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse
          hp=Path('data/property_history.json')
          pp=Path('data/historical_backfill_progress.json')
          assert hp.exists() and pp.exists()
          db=json.loads(hp.read_text(encoding='utf-8'))
          progress=json.loads(pp.read_text(encoding='utf-8'))
          sav=[e for e in (db.get('auction_events') or []) if e.get('source')=='Savills Auctions']
          assert sav
          for e in sav:
              u=((e.get('source_evidence') or {}).get('listing_url') or '')
              host=(urlparse(u).hostname or '').lower()
              assert u.startswith('https://') and (host=='savills.co.uk' or host.endswith('.savills.co.uk')), u
          state=(progress.get('sources') or {}).get('Savills Auctions') or {}
          assert state.get('historically_complete') is False
          print('SAVILLS_EVENTS',len(sav))
          print('EARLIEST',state.get('earliest_date_reached'))
          print('LOTS_CAPTURED',state.get('lots_captured'))
          PY

      - name: Persist History V2 and frontier blocker/repair state
        run: |
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/property_history.json data/historical_backfill_progress.json data/source_diagnostics || true
          if ! git diff --cached --quiet; then
            git commit -m 'Recover Savills 2019 lots from archived catalogue bodies'
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                exit 1
              fi
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
