name: Savills Common Crawl Legacy Namespace
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/savills-commoncrawl-legacy-namespace.yml'
      - 'savills_commoncrawl_legacy_namespace_recover.py'
permissions:
  contents: write
concurrency:
  group: savills-commoncrawl-legacy-namespace
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python -m py_compile savills_commoncrawl_legacy_namespace_recover.py history_database.py
      - name: Recover Savills via Common Crawl raw WARC
        run: python savills_commoncrawl_legacy_namespace_recover.py
      - name: Verify result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path('data/property_history.json').read_text());p=json.loads(Path('data/historical_backfill_progress.json').read_text());s=p['sources']['Savills Auctions'];d=s['savills_commoncrawl_legacy_namespace_last_run'];count=sum(1 for e in h.get('auction_events',[]) if e.get('source')=='Savills Auctions')
          print('SAVILLS_EVENTS',count);print('EARLIEST_VERIFIED',s.get('earliest_date_reached'));print('ADDED',d.get('canonical_events_added'));print('INDEXES',d.get('indexes_checked'));print('UNIQUE',d.get('unique_namespace_records'));print('WARC_OK',d.get('warc_ok'))
          assert count==d['canonical_events_after'];assert s.get('historically_complete') is False;assert s.get('discovery_exhausted') is False
          PY
      - name: Preserve generated files
        run: |
          cp data/property_history.json /tmp/savills_cc_history.json
          cp data/historical_backfill_progress.json /tmp/savills_cc_progress.json
          cp data/source_diagnostics/savills_commoncrawl_legacy_namespace_recovery.json /tmp/savills_cc_diag.json
      - name: Publish conflict-safe
        run: |
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/savills_cc_history.json data/property_history.json
            cp /tmp/savills_cc_diag.json data/source_diagnostics/savills_commoncrawl_legacy_namespace_recovery.json
            python - <<'PY'
          import json
          from pathlib import Path
          fp=Path('data/historical_backfill_progress.json');fresh=json.loads(fp.read_text());recovered=json.loads(Path('/tmp/savills_cc_progress.json').read_text());fs=fresh.setdefault('sources',{}).setdefault('Savills Auctions',{});rs=recovered['sources']['Savills Auctions']
          for key in ('savills_commoncrawl_legacy_namespace_last_run','propertyauctions_cursor_last_blocker','last_history_event_count','lots_captured','earliest_date_reached','earliest_month_reached','last_success','last_discovery_mode','status'):
              if key in rs:fs[key]=rs[key]
          fs['historically_complete']=False;fs['discovery_exhausted']=False;fresh['updated_at']=recovered.get('updated_at',fresh.get('updated_at'));fp.write_text(json.dumps(fresh,indent=2,ensure_ascii=False))
          PY
            git add data/property_history.json data/historical_backfill_progress.json data/source_diagnostics/savills_commoncrawl_legacy_namespace_recovery.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Persist Savills Common Crawl legacy recovery'
            if git push origin HEAD:main; then exit 0; fi
            git reset --hard HEAD~1
            sleep $((attempt*3))
          done
          exit 1
