name: Savills Live Archive Backfill

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/savills-live-archive-backfill.yml'
      - 'savills_live_archive_backfill.py'
      - 'historical_savills.py'
  schedule:
    - cron: '8 * * * *'

permissions:
  contents: write

concurrency:
  group: auction-sniper-production-scan
  cancel-in-progress: false

jobs:
  live-savills:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free collector dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install chromium
      - name: Compile live-first repair
        run: python -m py_compile savills_live_archive_backfill.py historical_savills.py history_database.py collectors/savills.py
      - name: Exhaust live Savills archive oldest-first
        run: python savills_live_archive_backfill.py
      - name: Validate canonical persistence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/historical_backfill_progress.json').read_text())
          h=json.loads(Path('data/property_history.json').read_text())
          s=(p.get('sources') or {}).get('Savills Auctions') or {}
          assert s.get('live_archive_pages_scanned',0) > 0
          assert s.get('historically_complete') is False
          events=[e for e in h.get('auction_events',[]) if e.get('source')=='Savills Auctions']
          assert events
          if s.get('last_live_archive_rows',0):
              assert s.get('last_live_archive_ingested'), 'Rows claimed without ingested-auction evidence'
          elif s.get('status')=='LIVE ARCHIVE BLOCKED':
              assert s.get('live_archive_blocker_url'), 'Blocker status missing exact live URL'
              assert s.get('last_live_archive_diagnostic'), 'Blocker status missing persisted diagnostic'
          print('SAVILLS_EVENTS',len(events))
          print('LIVE_ARCHIVE_STATUS',s.get('status'))
          print('OLDEST_LIVE_DATE',s.get('live_archive_oldest_date_seen'))
          print('ROWS_ADDED',s.get('last_live_archive_rows'))
          PY
      - name: Publish live archive records or blocker
        run: |
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/property_history.json data/historical_backfill_progress.json data/source_diagnostics
          if ! git diff --cached --quiet; then
            git commit -m 'Advance Savills live archive history'
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
