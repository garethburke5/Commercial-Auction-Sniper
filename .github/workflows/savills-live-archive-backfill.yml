name: Savills Live Archive Backfill

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/savills-live-archive-backfill.yml'
      - 'savills_live_archive_backfill.py'
      - 'savills_live_archive_latent_probe.py'
      - 'savills_legacy_aid_discovery.py'
      - 'historical_savills.py'
  schedule:
    - cron: '8 * * * *'

permissions:
  contents: write

concurrency:
  group: auction-sniper-production-scan
  cancel-in-progress: false

jobs:
  live-savills:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free collector dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install chromium
      - name: Compile live-first repair
        run: python -m py_compile savills_live_archive_backfill.py savills_live_archive_latent_probe.py historical_savills.py savills_legacy_aid_discovery.py history_database.py collectors/savills.py
      - name: Exhaust complete live Savills archive dynamically
        run: python savills_live_archive_backfill.py
      - name: Guard transition beyond live archive
        id: livegate
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=json.loads(Path('data/historical_backfill_progress.json').read_text())
          s=(p.get('sources') or {}).get('Savills Auctions') or {}
          scanned=int(s.get('live_archive_pages_scanned') or 0)
          exhausted=bool(s.get('live_archive_discovery_exhausted'))
          errors=s.get('live_archive_scan_errors') or []
          stop=s.get('live_archive_stop_reason')
          allowed=(scanned > 0 and exhausted and not errors)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              print(f"legacy_allowed={'true' if allowed else 'false'}", file=out)
          print('LIVE_PAGES_SCANNED', scanned)
          print('LIVE_DISCOVERY_EXHAUSTED', exhausted)
          print('LIVE_SCAN_ERRORS', len(errors))
          print('LIVE_STOP_REASON', stop)
          if not allowed:
              print('Legacy bridge withheld until the live archive reaches an observed pagination end/repeat without scan errors.')
          PY
      - name: Bridge unresolved live dates through first-party legacy LotList IDs
        if: steps.livegate.outputs.legacy_allowed == 'true'
        run: python savills_legacy_aid_discovery.py --probe-ids 500 --max-auctions 12 --floor-aid 1
      - name: Validate canonical persistence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/historical_backfill_progress.json').read_text())
          h=json.loads(Path('data/property_history.json').read_text())
          s=(p.get('sources') or {}).get('Savills Auctions') or {}
          assert s.get('live_archive_pages_scanned',0) > 0
          assert s.get('historically_complete') is False
          assert Path(s.get('live_archive_manifest') or 'data/source_diagnostics/savills_live_archive_manifest.json').exists(), 'Savills live archive manifest missing'
          events=[e for e in h.get('auction_events',[]) if e.get('source')=='Savills Auctions']
          assert events
          if s.get('last_live_archive_rows',0) or s.get('legacy_aid_last_events_added',0):
              assert s.get('last_live_archive_ingested') or s.get('legacy_aid_last_processed'), 'Rows claimed without Savills evidence trail'
          elif s.get('status') in ('LIVE ARCHIVE BLOCKED','LIVE ARCHIVE DEGRADED','DISCOVERY EXPANSION'):
              assert s.get('live_archive_blocker_url') or s.get('live_archive_stop_reason'), 'Blocker/degraded state missing exact live archive evidence'
          print('SAVILLS_EVENTS',len(events))
          print('LIVE_ARCHIVE_STATUS',s.get('status'))
          print('LIVE_PAGES_SCANNED',s.get('live_archive_pages_scanned'))
          print('OLDEST_LIVE_DATE',s.get('live_archive_oldest_date_seen'))
          print('ROWS_ADDED',s.get('last_live_archive_rows'))
          print('LEGACY_EVENTS_ADDED',s.get('legacy_aid_last_events_added'))
          print('STOP_REASON',s.get('live_archive_stop_reason'))
          PY
      - name: Publish live archive records or blocker
        run: |
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/property_history.json data/historical_backfill_progress.json data/source_diagnostics
          if ! git diff --cached --quiet; then
            git commit -m 'Advance Savills live archive history'
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
