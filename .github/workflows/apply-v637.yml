name: Apply V6.37 Strettons images and target yield
on:
  push:
    paths:
      - '.github/workflows/apply-v637.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/apply_v637_strettons_yield.py
      - run: python -m py_compile app.py
      - name: Verify exact Strettons property image pattern
        run: |
          python - <<'PY'
          import requests,re
          u='https://www.strettons.co.uk/auction-commercial-property-for-sale/commercial-mixed-use-for-sale-in-1-bruce-grove-tottenham-london-haringey-n17-6ra-6a7f2d71cf4bc9ebb1c9e868/'
          t=requests.get(u,headers={'User-Agent':'Mozilla/5.0'},timeout=20).text
          m=re.search(r'https://ggfx-strettons\.s3\.eu-west-2\.amazonaws\.com/i/api_sources/[^"\'<>\s]+?/images/[^"\'<>\s]+?\.(?:jpe?g|png|webp)',t,re.I)
          assert m, 'Strettons exact property image not found'
          r=requests.get(m.group(0),headers={'User-Agent':'Mozilla/5.0','Referer':u},timeout=20)
          assert r.status_code==200 and r.headers.get('content-type','').startswith('image/'), (r.status_code,r.headers.get('content-type'))
          print('Verified Strettons photo:',m.group(0),len(r.content))
          PY
      - run: |
          git config user.name 'Auction Sniper Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app.py
          git diff --cached --quiet && exit 0
          git commit -m 'V6.37 fix Strettons photos and add adjustable target yield'
          git push origin main
