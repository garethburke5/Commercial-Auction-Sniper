name: Test progressive first-batch card rendering

on:
  push:
    paths:
      - '.github/workflows/test-progressive-first-batch.yml'
  workflow_dispatch:

jobs:
  test-progressive:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install app and browser tooling
        run: |
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Patch local diagnostic only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py')
          s=p.read_text(encoding='utf-8')
          old='    cards=[]\n    for x in lots:\n'
          new='''    class _ProgressiveCards(list):\n        def append(self,item):\n            super().append(item)\n            if len(self)==12:\n                st.markdown('<div class="cards progressiveProbe">'+"".join(self)+'</div>',unsafe_allow_html=True)\n    cards=_ProgressiveCards()\n    for x in lots:\n'''
          if old not in s:
              raise SystemExit('card loop anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile app.py
      - name: Start Streamlit
        run: |
          nohup streamlit run app.py --server.headless true --server.port 8501 > /tmp/streamlit.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Measure progressive timing
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import time
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(viewport={"width":1440,"height":1000})
              t0=time.perf_counter()
              page.goto('http://127.0.0.1:8501',wait_until='commit',timeout=60000)
              page.wait_for_selector('.hero',timeout=60000)
              hero=time.perf_counter()-t0
              page.wait_for_selector('.progressiveProbe .card',timeout=60000)
              first_batch=time.perf_counter()-t0
              page.wait_for_function('document.querySelectorAll(".cards .card").length >= 159',timeout=60000)
              full=time.perf_counter()-t0
              print(f'hero={hero:.3f}s first_batch={first_batch:.3f}s hero_to_first_batch={first_batch-hero:.3f}s full={full:.3f}s')
              print('rendered_cards',page.locator('.cards .card').count())
              browser.close()
          PY
      - name: Show log tail
        if: always()
        run: tail -n 80 /tmp/streamlit.log || true
