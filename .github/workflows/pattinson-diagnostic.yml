name: Pattinson Collector Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'collectors/pattinson.py'
      - 'tests/test_pattinson.py'
      - '.github/workflows/pattinson-diagnostic.yml'

permissions:
  contents: read

concurrency:
  group: pattinson-collector-diagnostic
  cancel-in-progress: true

jobs:
  pattinson:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install collector dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml
      - name: Run Pattinson regression tests
        run: python -m unittest tests.test_pattinson -v
      - name: Probe neutral proxy routes
        run: |
          python - <<'PY'
          import requests, urllib.parse
          target='https://www.pattinson.co.uk/commercial/property-search?searchType=CommercialSale'
          probes = {
              'allorigins_raw':'https://api.allorigins.win/raw?url='+urllib.parse.quote(target,safe=''),
              'allorigins_get':'https://api.allorigins.win/get?url='+urllib.parse.quote(target,safe=''),
              'corsproxy':'https://corsproxy.io/?url='+urllib.parse.quote(target,safe=''),
              'codetabs':'https://api.codetabs.com/v1/proxy?quest='+urllib.parse.quote(target,safe=':/?=&'),
              'google_translate':'https://www-pattinson-co-uk.translate.goog/commercial/property-search?searchType=CommercialSale&_x_tr_sl=auto&_x_tr_tl=en&_x_tr_hl=en',
          }
          headers={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36'}
          for name,u in probes.items():
              try:
                  r=requests.get(u,headers=headers,timeout=30,allow_redirects=True)
                  body=r.text
                  print('PROXY',name,'STATUS',r.status_code,'LEN',len(body),'TYPE',r.headers.get('content-type'),'RESULTS',('results' in body.lower()),'CF',('just a moment' in body.lower()))
                  print('HEAD',repr(body[:500]))
              except Exception as e:
                  print('PROXY_FAIL',name,repr(e))
          PY
      - name: Run Pattinson collector only
        run: |
          python - <<'PY'
          from collectors.pattinson import collect
          r = collect()
          print(r.to_status_dict())
          for lot in r.lots[:10]:
              print(lot.to_dict())
          if r.status == 'FAILED' or not r.lots:
              raise SystemExit('Pattinson collector returned no publishable lots')
          PY
