name: Pattinson Collector Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'collectors/pattinson.py'
      - 'tests/test_pattinson.py'
      - '.github/workflows/pattinson-diagnostic.yml'

permissions:
  contents: read

concurrency:
  group: pattinson-collector-diagnostic
  cancel-in-progress: true

jobs:
  pattinson:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install collector dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml playwright
          python -m playwright install chromium
      - name: Run Pattinson regression tests
        run: python -m unittest tests.test_pattinson -v
      - name: Test Cloudflare challenge in Chromium
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          url='https://www.pattinson.co.uk/commercial/property-search?searchType=CommercialSale'
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--disable-blink-features=AutomationControlled','--no-sandbox'])
              ctx=browser.new_context(user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36',locale='en-GB',viewport={'width':1440,'height':1200})
              page=ctx.new_page()
              page.add_init_script("Object.defineProperty(navigator, 'webdriver', {get: () => undefined})")
              resp=page.goto(url,wait_until='domcontentloaded',timeout=45000)
              print('INITIAL',resp.status if resp else None,page.title(),len(page.content()))
              for seconds in (5,10,20,30):
                  page.wait_for_timeout((seconds-(0 if seconds==5 else {10:5,20:10,30:20}[seconds]))*1000)
                  html=page.content()
                  print('AFTER',seconds,'TITLE',page.title(),'LEN',len(html),'PROPS',page.locator("a[href*='/property/']").count(),'CF',('Just a moment' in html))
              print('FINAL_HEAD',page.content()[:1200])
              ctx.close(); browser.close()
          PY
      - name: Run Pattinson collector only
        run: |
          python - <<'PY'
          from collectors.pattinson import collect
          r = collect()
          print(r.to_status_dict())
          for lot in r.lots[:10]:
              print(lot.to_dict())
          if r.status == 'FAILED' or not r.lots:
              raise SystemExit('Pattinson collector returned no publishable lots')
          PY
