name: Pattinson Collector Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pattinson-collector-diagnostic
  cancel-in-progress: true

jobs:
  pattinson:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install collector dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml playwright
          python -m playwright install chromium
      - name: Run Pattinson regression tests
        run: python -m unittest tests.test_pattinson -v
      - name: Probe free first-party routes before tunnel
        run: |
          python - <<'PY'
          import requests
          urls = [
              'https://www.pattinson.co.uk/auction/property-search?p=1',
              'https://www.pattinson.co.uk/api/property/482394/particulars',
              'https://addisonbarton.pattinson.co.uk/',
              'https://greenfishhomes.pattinson.co.uk/property?id=510871',
              'https://hazelwells.pattinson.co.uk/property?id=510871',
              'https://r.jina.ai/https://www.pattinson.co.uk/auction/property-search?p=1',
          ]
          for url in urls:
              try:
                  r=requests.get(url,headers={'User-Agent':'Mozilla/5.0'},timeout=20)
                  print('PROBE',r.status_code,len(r.content),r.url,repr(r.text[:100]))
              except Exception as e:
                  print('PROBE_FAIL',url,repr(e))
          PY
      - name: Test free Cloudflare WARP egress
        continue-on-error: true
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(. /etc/os-release && echo $VERSION_CODENAME) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq cloudflare-warp
          sudo systemctl start warp-svc || true
          warp-cli --accept-tos registration new || warp-cli registration new || true
          warp-cli --accept-tos connect || warp-cli connect || true
          sleep 5
          warp-cli status || true
          curl -sS https://www.cloudflare.com/cdn-cgi/trace | grep -E '^(ip|warp)=' || true
          python - <<'PY'
          import requests
          for url in [
              'https://www.pattinson.co.uk/auction/property-search?p=1',
              'https://www.pattinson.co.uk/api/property/482394/particulars',
              'https://addisonbarton.pattinson.co.uk/',
          ]:
              try:
                  r=requests.get(url,headers={'User-Agent':'Mozilla/5.0'},timeout=20)
                  print('WARP_PROBE',r.status_code,len(r.content),r.url,repr(r.text[:100]))
              except Exception as e:
                  print('WARP_PROBE_FAIL',url,repr(e))
          PY
      - name: Run Pattinson collector only
        run: |
          python - <<'PY'
          from collectors.pattinson import collect
          r = collect()
          print(r.to_status_dict())
          for lot in r.lots[:10]:
              print(lot.to_dict())
          if r.status == 'FAILED' or not r.lots:
              raise SystemExit('Pattinson collector returned no publishable lots')
          PY
