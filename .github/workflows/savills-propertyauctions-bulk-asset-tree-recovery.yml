name: Savills PropertyAuctions Bulk Asset Tree Recovery

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/savills-propertyauctions-bulk-asset-tree-recovery.yml'
      - 'savills_propertyauctions_bulk_asset_tree_recovery.py'

permissions:
  contents: write

concurrency:
  group: savills-propertyauctions-bulk-asset-tree-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 pypdf
      - name: Compile bulk recovery
        run: python -m py_compile savills_propertyauctions_bulk_asset_tree_recovery.py
      - name: Run full AID asset-tree catalogue recovery
        run: python savills_propertyauctions_bulk_asset_tree_recovery.py
      - name: Verify and preserve
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path('data/property_history.json').read_text())
          p=json.loads(Path('data/historical_backfill_progress.json').read_text())
          d=json.loads(Path('data/source_diagnostics/savills_propertyauctions_bulk_asset_tree_recovery.json').read_text())
          s=p['sources']['Savills Auctions']
          ev=[e for e in h.get('auction_events',[]) if e.get('source')=='Savills Auctions']
          dates=sorted(str(e.get('auction_date')) for e in ev if e.get('auction_date'))
          print('SAVILLS_EVENTS',len(ev))
          print('OLDEST_VERIFIED',dates[0] if dates else None)
          print('CATALOGUES',d.get('catalogues_considered'))
          print('AIDS',d.get('aids_considered'))
          print('CLUES',d.get('commercial_mixed_clues'))
          print('CDX_ROWS',d.get('cdx_rows_seen'))
          print('DOCUMENT_CAPTURES',d.get('document_shaped_captures'))
          print('EXTRACTABLE_DOCUMENTS',d.get('extractable_documents'))
          print('SAFE_MATCHES',d.get('safe_bulk_document_matches'))
          print('ADDED',d.get('canonical_events_added'))
          assert s.get('historically_complete') is False
          assert s.get('discovery_exhausted') is False
          assert d.get('catalogues_considered',0) >= 70
          PY
          cp data/property_history.json /tmp/history.json
          cp data/historical_backfill_progress.json /tmp/progress.json
          cp data/source_diagnostics/savills_propertyauctions_bulk_asset_tree_recovery.json /tmp/diag.json
      - name: Publish conflict-safe
        run: |
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/history.json data/property_history.json
            cp /tmp/diag.json data/source_diagnostics/savills_propertyauctions_bulk_asset_tree_recovery.json
            python - <<'PY'
          import json
          from pathlib import Path
          fp=Path('data/historical_backfill_progress.json')
          fresh=json.loads(fp.read_text()); rec=json.loads(Path('/tmp/progress.json').read_text())
          fs=fresh.setdefault('sources',{}).setdefault('Savills Auctions',{}); rs=rec['sources']['Savills Auctions']
          for k in ('savills_bulk_asset_tree_last_run','savills_bulk_asset_tree_last_blocker','savills_auction_coverage','last_discovery_mode','status','lots_captured'):
              if k in rs: fs[k]=rs[k]
          fs['historically_complete']=False; fs['discovery_exhausted']=False
          fresh['updated_at']=rec.get('updated_at',fresh.get('updated_at'))
          fp.write_text(json.dumps(fresh,indent=2,ensure_ascii=False))
          PY
            git add data/property_history.json data/historical_backfill_progress.json data/source_diagnostics/savills_propertyauctions_bulk_asset_tree_recovery.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Persist Savills bulk catalogue asset-tree recovery'
            if git push origin HEAD:main; then exit 0; fi
            git reset --hard HEAD~1
            sleep $((attempt*3))
          done
          exit 1
