name: Apply Acuitus structured facts
on:
  workflow_dispatch:
  push:
    branches: [acuitus-structured-facts]
    paths:
      - apply_acuitus_structured_facts.py
      - .github/workflows/apply-acuitus-structured-facts.yml
jobs:
  patch-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acuitus-structured-facts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install streamlit requests beautifulsoup4 lxml pypdf python-docx openpyxl
      - name: Apply patch
        run: python apply_acuitus_structured_facts.py
      - name: Compile
        run: python -m py_compile app.py collector_enrichment.py
      - name: Verify Acuitus structured extraction
        run: |
          grep -q 'V6.69-ACUITUS-STRUCTURED' app.py
          grep -q 'accommodation_summary' app.py
          grep -q 'VAT\\s+(?:is\\s+)?applicable' app.py
          grep -q 'total_sqm' app.py
          grep -q 'epc=" / ".join' app.py
          grep -q 'Rent\\s*£' app.py
      - name: Commit app
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add app.py
          git diff --cached --quiet || git commit -m "Extract rich Acuitus exact-page facts"
          git push origin HEAD:acuitus-structured-facts
