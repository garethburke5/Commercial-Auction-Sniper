name: Pattinson Network Diagnostic
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pattinson-network-diagnostic.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt && pip install playwright && python -m playwright install chromium
      - name: Probe Rightmove fallback and Harman collector
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          headers={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36'}
          targets=[
            'https://www.rightmove.co.uk/estate-agents/agent/Pattinsons/Pattinsons-Auction--National-Auctioneer-251528.html',
            'https://www.rightmove.co.uk/commercial-property-for-sale/find/Pattinsons/Pattinsons-Auction--National-Auctioneer.html?locationIdentifier=BRANCH%5E251528&includeSSTC=true&_includeSSTC=on',
            'https://www.pattinson.co.uk/auction/property-search?IncludeCommercialProperties=true&OnlineOnly=true&PropertySort=EndingSoonest&PageSize=100&p=1',
          ]
          for url in targets:
            print('\nTARGET',url)
            try:
              r=requests.get(url,headers=headers,timeout=30,allow_redirects=True)
              print('STATUS',r.status_code,'LEN',len(r.text),'FINAL',r.url)
              s=BeautifulSoup(r.text,'lxml')
              print('TITLE',s.title.get_text(' ',strip=True) if s.title else '')
              text=s.get_text(' ',strip=True)
              print('TEXT',text[:2200])
              links=[]
              for a in s.find_all('a',href=True):
                href=urljoin(r.url,a['href'])
                txt=a.get_text(' ',strip=True)
                if '/properties/' in href or '/commercial-property-for-sale/' in href or 'property-' in href:
                  links.append((txt[:100],href))
              print('PROPERTY_LINKS',links[:100])
            except Exception as e:
              print('FAIL',type(e).__name__,e)
          print('\nHARMAN_COLLECTOR')
          try:
            from collectors.harman_healy import collect
            result=collect()
            print(result.to_status_dict())
            for lot in result.lots[:20]: print(lot.to_dict())
          except Exception as e:
            print('HARMAN_FAIL',type(e).__name__,e)
          PY
