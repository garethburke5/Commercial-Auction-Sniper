name: Pattinson Network Diagnostic
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 lxml
      - name: Inspect Rightmove Pattinson pagination contract
        run: |
          python - <<'PY'
          import requests,re,json
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          base='https://www.rightmove.co.uk/commercial-property-for-sale/find/Pattinsons/Pattinsons-Auction--National-Auctioneer.html?locationIdentifier=BRANCH%5E251528&includeSSTC=true&_includeSSTC=on'
          headers={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36'}
          for idx in (0,24,48):
            url=base+('&index='+str(idx) if idx else '')
            r=requests.get(url,headers=headers,timeout=30)
            print('\nINDEX',idx,'STATUS',r.status_code,'LEN',len(r.text))
            s=BeautifulSoup(r.text,'lxml')
            props=[]
            for a in s.find_all('a',href=True):
              m=re.search(r'/properties/(\d+)',a['href'])
              if m and m.group(1) not in props: props.append(m.group(1))
            print('UNIQUE_PROPERTY_IDS',len(props),props[:30])
            text=s.get_text(' ',strip=True)
            for pat in [r'(\d[\d,]*)\s+results',r'(\d[\d,]*)\s+properties',r'propertyCount.{0,30}(\d+)',r'resultCount.{0,30}(\d+)']:
              hits=re.findall(pat,r.text,re.I)
              if hits: print('COUNT_HIT',pat,hits[:20])
            pages=[]
            for a in s.find_all('a',href=True):
              if 'index=' in a['href'] and a['href'] not in pages: pages.append(a['href'])
            print('PAGINATION_LINKS',pages[:40])
            for marker in ('propertySearchResults','searchResults','pagination','resultCount','properties'):
              pos=r.text.find(marker)
              if pos>=0: print('MARKER',marker,r.text[pos:pos+900].replace('\n',' ')[:900])
          PY
