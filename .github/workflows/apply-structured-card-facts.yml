name: Apply structured card facts
on:
  push:
    branches: [structured-card-facts]
    paths:
      - apply_structured_card_facts.py
      - .github/workflows/apply-structured-card-facts.yml
jobs:
  patch-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: structured-card-facts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python apply_structured_card_facts.py
      - name: Compile
        run: python -m py_compile app.py collector_enrichment.py
      - name: Verify structured facts
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('app.py').read_text()
          for needle in ['p.get("tenant")','p.get("lease_term")','p.get("epc")','Rateable value']:
              assert needle in s, needle
          assert 'chips.append("ERV")' not in s
          PY
      - name: Commit app
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add app.py
          git diff --cached --quiet || git commit -m "Show structured collector facts on cards"
          git push origin HEAD:structured-card-facts
