name: Savills 2018 Common Crawl Throttled Recovery

on:
  workflow_dispatch:
  push:
    paths:
      - 'savills_2018_commoncrawl_throttled_recovery.py'
      - '.github/workflows/savills-2018-commoncrawl-throttled-recovery.yml'

permissions:
  contents: write

concurrency:
  group: savills-2018-commoncrawl-throttled-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pypdf
      - name: Compile
        run: python -m py_compile savills_2018_commoncrawl_throttled_recovery.py
      - name: Crawl throttled 2018 Common Crawl indexes
        run: python savills_2018_commoncrawl_throttled_recovery.py
      - name: Preserve crawl evidence
        run: cp data/source_diagnostics/savills_2018_commoncrawl_throttled_recovery.json /tmp/cc_throttled.json
      - name: Apply recovered rows onto freshest production main
        run: |
          set -euo pipefail
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/cc_throttled.json data/source_diagnostics/savills_2018_commoncrawl_throttled_recovery.json
            python savills_2018_commoncrawl_throttled_recovery.py --apply-only
            python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/source_diagnostics/savills_2018_commoncrawl_throttled_recovery.json').read_text())
          h=json.loads(Path('data/property_history.json').read_text())
          n=sum(1 for e in h.get('auction_events',[]) if e.get('source')=='Savills Auctions')
          print('SAVILLS_EVENTS',n)
          print('QUERIES',d.get('queries_executed'))
          print('QUERY_OK',d.get('queries_ok'))
          print('QUERY_FAILED',d.get('queries_failed'))
          print('CAPTURES',d.get('unique_cdx_records'))
          print('WARC_FETCHED',d.get('warc_records_fetched'))
          print('ROWS_READY',d.get('safe_unique_rows_ready'))
          print('ADDED',d.get('canonical_events_added'))
          assert d.get('queries_executed',0) > 0
          assert d.get('queries_ok',0) > 0
          PY
            git add data/source_diagnostics/savills_2018_commoncrawl_throttled_recovery.json data/property_history.json data/historical_backfill_progress.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Persist throttled Savills 2018 Common Crawl recovery'
            if git push origin HEAD:main; then exit 0; fi
            git reset --hard HEAD~1
            sleep $((attempt*4))
          done
          exit 1
