name: Savills Legacy Catalogue ID Scan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'savills_legacy_catalogue_id_scan.py'
      - '.github/workflows/savills-legacy-catalogue-id-scan.yml'

permissions:
  contents: write

concurrency:
  group: savills-legacy-catalogue-id-scan
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile savills_legacy_catalogue_id_scan.py collectors/savills.py history_database.py
      - name: Scan legacy commission catalogue ID namespace
        run: python savills_legacy_catalogue_id_scan.py --start-id 1 --end-id 3000 --workers 48
      - name: Verify and publish
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path('data/property_history.json').read_text())
          p=json.loads(Path('data/historical_backfill_progress.json').read_text())
          ev=[e for e in h.get('auction_events',[]) if e.get('source')=='Savills Auctions']
          dates=sorted(e.get('auction_date') for e in ev if e.get('auction_date'))
          s=(p.get('sources') or {}).get('Savills Auctions') or {}
          assert s.get('historically_complete') is False
          r=s.get('legacy_catalogue_id_last_run') or {}
          print('SAVILLS',len(ev),dates[0] if dates else None)
          print('IDS_CHECKED',r.get('ids_checked'))
          print('FRONTIER_HITS',r.get('frontier_catalogue_hits'))
          print('OTHER_VALID',len(r.get('other_valid_catalogue_samples') or []))
          print('ADDED',r.get('canonical_events_added'))
          PY
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/property_history.json data/historical_backfill_progress.json data/source_diagnostics
          if ! git diff --cached --quiet; then
            git commit -m 'Advance Savills frontier through legacy catalogue IDs'
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt*3))
            done
            exit 1
          fi
