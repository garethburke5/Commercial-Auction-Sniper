name: Diagnose Acuitus exact-page extraction
on:
  push:
    paths:
      - '.github/workflows/diagnose-acuitus-exact.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Inspect current Acuitus pages
        run: |
          python - <<'PY'
          import json,re,requests
          from bs4 import BeautifulSoup
          from pathlib import Path
          d=json.loads(Path('auction_sniper_cache.json').read_text())
          rows=[r for r in d.get('properties',[]) if r.get('source')=='Acuitus']
          print('ACUITUS_CACHE_ROWS',len(rows))
          targets=[]
          for r in rows:
              if 'Stonehills' in str(r.get('address')) or str(r.get('lot')) in {'Lot 25','Lot 26','Lot 28','25','26','28'}:
                  print('CACHE_ROW',json.dumps(r,ensure_ascii=False)[:5000])
                  if r.get('url'): targets.append(r['url'])
          for url in dict.fromkeys(targets):
              print('\nURL',url)
              h=requests.get(url,headers={'User-Agent':'Mozilla/5.0'},timeout=30).text
              print('HTML_LEN',len(h))
              soup=BeautifulSoup(h,'lxml')
              print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '')
              print('OG',[(m.get('property') or m.get('name'),m.get('content')) for m in soup.find_all('meta') if (m.get('property') or m.get('name')) in ('og:image','twitter:image')])
              for i,img in enumerate(soup.find_all('img')):
                  vals={k:img.get(k) for k in ('src','data-src','data-lazy-src','srcset','alt','class') if img.get(k)}
                  if vals and i<120: print('IMG',i,vals)
              text=' '.join(soup.stripped_strings)
              rel=text.lower().find('you may also be interested in')
              main=text[:rel] if rel!=-1 else text
              print('RELATED_CUT',rel,'MAIN_LEN',len(main),'FULL_LEN',len(text))
              for needle in ['Refer to Auctioneer','Not Elected for VAT','EPC','Band E','4,534','421.20','VACANT','110,154','10,234']:
                  print('TEXT_HAS',needle,needle.lower() in main.lower())
              for pat in [r'.{0,100}Guide.{0,180}',r'.{0,100}VAT.{0,180}',r'.{0,100}EPC.{0,180}',r'.{0,100}421\.20.{0,180}',r'.{0,100}4,534.{0,180}']:
                  m=re.search(pat,main,re.I)
                  print('MATCH',pat, m.group(0) if m else None)
          PY
