name: Apply rich Savills investment parser
# Legacy repair workflow retained for manual diagnostics only. Canonical production
# collection is collectors/savills_all_future.py via Auction Sniper Scan.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install parser dependencies
        run: |
          pip install requests beautifulsoup4 lxml playwright
          python -m playwright install chromium
      - name: Patch app data plumbing and richer cards
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('"Lot 75": (8912,827.92)', '"Lot 75": (12082,1122.00)')
          anchor='''                    legal_pack_url=x.get("legal_pack_url"),\n                    status=x.get("status") or "Live",\n'''
          insert='''                    legal_pack_url=x.get("legal_pack_url"),\n                    status=x.get("status") or "Live",\n                    area_sqft=x.get("area_sqft"), area_sqm=x.get("area_sqm"),\n                    site_area_acres=x.get("site_area_acres"), tenant=x.get("tenant"),\n                    lease_term=x.get("lease_term"), lease_start=x.get("lease_start"),\n                    lease_expiry=x.get("lease_expiry"), break_clause=x.get("break_clause"),\n                    break_status=x.get("break_status"), rent_review=x.get("rent_review"),\n                    fri=x.get("fri"), erv=x.get("erv"), epc=x.get("epc"),\n                    rateable_value=x.get("rateable_value"), service_charge=x.get("service_charge"),\n                    ground_rent=x.get("ground_rent"), property_type=x.get("property_type"),\n                    occupation=x.get("occupation"), parking=x.get("parking"),\n                    development_potential=x.get("development_potential"), asset_management=x.get("asset_management"),\n                    refurbishment=x.get("refurbishment"), residential_conversion=x.get("residential_conversion"),\n                    listed_status=x.get("listed_status"), covenant_rating=x.get("covenant_rating"),\n                    covenant_risk=x.get("covenant_risk"), covenant_turnover=x.get("covenant_turnover"),\n                    guarantors=x.get("guarantors"), pitch=x.get("pitch"), nearby_occupiers=x.get("nearby_occupiers"),\n'''
          if anchor in s and 'site_area_acres=x.get("site_area_acres")' not in s:
              s=s.replace(anchor,insert,1)
          old='''    fill_fields=("image","area_sqft","area_sqm","tenant","lease_term","lease_start",\n                 "lease_expiry","break_clause","rent_review","erv","fri","legal_pack",\n                 "epc","rateable_value","service_charge","ground_rent")\n'''
          new='''    fill_fields=("image","area_sqft","area_sqm","site_area_acres","tenant","lease_term","lease_start",\n                 "lease_expiry","break_clause","break_status","rent_review","erv","fri","legal_pack",\n                 "epc","rateable_value","service_charge","ground_rent","property_type","occupation","parking",\n                 "development_potential","asset_management","refurbishment","residential_conversion","listed_status",\n                 "covenant_rating","covenant_risk","covenant_turnover","guarantors","pitch","nearby_occupiers")\n'''
          if old in s: s=s.replace(old,new,1)
          s=s.replace('BUILD = "V6.67-INLINE-FILTERS"','BUILD = "V6.68-RICH-INVESTMENT-PARSER"',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Refresh Savills exact-page snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from collectors.savills import collect
          r=collect()
          print('SAVILLS_STATUS',r.status,r.message)
          if r.status!='LIVE' or len(r.lots)<10:
              raise SystemExit('Savills collector sanity check failed')
          path=Path('data/properties.json')
          doc=json.loads(path.read_text(encoding='utf-8'))
          old=[x for x in doc.get('properties',[]) if x.get('source')=='Savills Auctions']
          old_by_url={x.get('url'):x for x in old}
          fresh=[]
          for lot in r.lots:
              d=lot.to_dict(); prev=old_by_url.get(d.get('url')) or {}
              if not d.get('image_url') and prev.get('image_url'): d['image_url']=prev['image_url']
              fresh.append(d)
          doc['properties']=[x for x in doc.get('properties',[]) if x.get('source')!='Savills Auctions']+fresh
          path.write_text(json.dumps(doc,indent=2,ensure_ascii=False),encoding='utf-8')
          print('SAVILLS_REFRESHED',len(fresh))
          PY
      - name: Regression checks for reference Savills lots
        run: |
          python -m py_compile app.py collectors/core.py collectors/savills.py
      - name: Commit rich Savills parser and snapshot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.py data/properties.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m 'Surface rich Savills investment facts'
            git push
          fi
