name: Future Property API diagnostic

on:
  push:
    paths:
      - .github/workflows/future-property-api-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: future-property-api-diagnostic
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Probe first-party public API variants
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import hashlib
          import json
          from pathlib import Path
          import urllib.error
          import urllib.request

          base = "https://hove.eu-west-2.bidjs.com/auction-007/api"
          cases = {
              "known_complete": {
                  "auction_id": "11580",
                  "auction_uuid": "b97efaa1-742c-4708-bf79-9d48e4cf13b9",
              },
              "blocked_2024": {
                  "auction_id": "8795",
                  "auction_uuid": "430206bd-8589-4996-93e2-4eb83b9e2df8",
              },
          }
          header_sets = {
              "collector": {
                  "Accept": "application/json",
                  "User-Agent": "Commercial-Auction-Sniper/1.0 (+historical lot research)",
                  "x-forwarded-client-id": "futureproperty",
              },
              "browser": {
                  "Accept": "application/json, text/plain, */*",
                  "User-Agent": "Mozilla/5.0",
                  "Origin": "https://www.futurepropertyauctions.co.uk",
                  "Referer": "https://www.futurepropertyauctions.co.uk/onlineauctions.html#!/",
                  "x-forwarded-client-id": "futureproperty",
              },
              "plain": {
                  "Accept": "application/json",
                  "User-Agent": "Mozilla/5.0",
              },
          }
          templates = {
              "v3_uuid": "/v3/auctions/{auction_uuid}",
              "v2_uuid": "/v2/auctions/{auction_uuid}",
              "v1_uuid": "/v1/auctions/{auction_uuid}",
              "v3_numeric": "/v3/auctions/{auction_id}",
              "v2_numeric": "/v2/auctions/{auction_id}",
              "v1_numeric": "/v1/auctions/{auction_id}",
          }

          results = []
          for case_name, identity in cases.items():
              for endpoint_name, template in templates.items():
                  url = base + template.format(**identity)
                  for headers_name, headers in header_sets.items():
                      request = urllib.request.Request(url, headers=headers)
                      status = None
                      response_headers = {}
                      body = b""
                      error = None
                      try:
                          with urllib.request.urlopen(request, timeout=45) as response:
                              status = response.status
                              response_headers = dict(response.headers.items())
                              body = response.read()
                      except urllib.error.HTTPError as exc:
                          status = exc.code
                          response_headers = dict(exc.headers.items())
                          body = exc.read()
                          error = f"HTTPError: {exc.code} {exc.reason}"
                      except Exception as exc:
                          error = f"{type(exc).__name__}: {exc}"
                      top_level_keys = None
                      if body and "json" in response_headers.get("Content-Type", "").lower():
                          try:
                              payload = json.loads(body)
                              if isinstance(payload, dict):
                                  top_level_keys = sorted(payload)[:40]
                              elif isinstance(payload, list):
                                  top_level_keys = ["<list>"]
                          except Exception:
                              pass
                      results.append({
                          "case": case_name,
                          "auction_id": identity["auction_id"],
                          "auction_uuid": identity["auction_uuid"],
                          "endpoint": endpoint_name,
                          "headers": headers_name,
                          "url": url,
                          "status": status,
                          "content_type": response_headers.get("Content-Type"),
                          "content_length": len(body),
                          "body_sha256": hashlib.sha256(body).hexdigest() if body else None,
                          "top_level_keys": top_level_keys,
                          "error": error,
                      })

          output = {
              "checked_at": datetime.now(timezone.utc).isoformat(),
              "purpose": "Identify a public first-party recovery route for archived Future Property catalogues returning 403 from the canonical v3 UUID endpoint.",
              "privacy": "No response bodies, bidder records, registrants, reserves or credentials are persisted.",
              "results": results,
          }
          path = Path("data/auction_history/future_property_endpoint_diagnostic.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(output, indent=2) + "\n")
          print(json.dumps({
              "probes": len(results),
              "status_counts": {
                  str(code): sum(item["status"] == code for item in results)
                  for code in sorted({item["status"] for item in results}, key=lambda x: str(x))
              },
          }, indent=2))
          PY

      - name: Publish diagnostic evidence
        run: |
          if [ -z "$(git status --porcelain -- data/auction_history/future_property_endpoint_diagnostic.json)" ]; then
            echo "No diagnostic change"
            exit 0
          fi
          git config user.name "Auction Sniper History Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/auction_history/future_property_endpoint_diagnostic.json
          git commit -m "Record Future Property public API recovery probes"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
