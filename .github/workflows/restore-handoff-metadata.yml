name: Restore historical collection handoff metadata

on:
  push:
    paths:
      - '.github/handoff-repair/**'
      - '.github/workflows/restore-handoff-metadata.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: historical-handoff-metadata
  cancel-in-progress: true

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout: |
            .github/handoff-repair
            .github/workflows/restore-handoff-metadata.yml
            data/auction_history/continuation_collection.json
            docs/historical-collection-recovery-2026-10-24.md
          sparse-checkout-cone-mode: false
      - name: Verify, restore and self-clean handoff metadata
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/historical-handoff.tar.gz"
          restored="${RUNNER_TEMP}/historical-handoff"
          cat .github/handoff-repair/archive.part-* > "${archive}"
          echo "0a2c1c8dc4fad87524fd6e1838d68c5f1ef4d0bb1ffd0001b0613c899d10cd69  ${archive}" | sha256sum -c -
          mkdir -p "${restored}"
          tar -xzf "${archive}" -C "${restored}"
          echo "ec72b14ec71e52ca9bfe7eecfc9a4d1b9643920898e9f3183c3ab33e8db3581a  ${restored}/data/auction_history/continuation_collection.json" | sha256sum -c -
          echo "ac0136656212157ff290c726bdca3c796c358f63670b3d97ae54c42efd1d29c6  ${restored}/docs/historical-collection-recovery-2026-10-24.md" | sha256sum -c -
          jq empty "${restored}/data/auction_history/continuation_collection.json"
          cp "${restored}/data/auction_history/continuation_collection.json" data/auction_history/continuation_collection.json
          cp "${restored}/docs/historical-collection-recovery-2026-10-24.md" docs/historical-collection-recovery-2026-10-24.md
          git config user.name "Auction Sniper History Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/auction_history/continuation_collection.json docs/historical-collection-recovery-2026-10-24.md
          git rm -r .github/handoff-repair .github/workflows/restore-handoff-metadata.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Persist historical collection growth handoff [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 5
          done
          exit 1
