name: Restore historical collection handoff metadata

on:
  push:
    branches:
      - main
    paths:
      - ".github/handoff-repair/**"
      - ".github/workflows/restore-handoff-metadata.yml"

permissions:
  contents: write

concurrency:
  group: historical-handoff-metadata
  cancel-in-progress: true

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staged archive and handoff targets
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/handoff-repair
            .github/workflows/restore-handoff-metadata.yml
            data/auction_history/continuation_collection.json
            docs/historical-collection-recovery-2026-10-24.md
          sparse-checkout-cone-mode: false

      - name: Restore and verify handoff files
        shell: bash
        run: |
          set -euo pipefail
          cat .github/handoff-repair/archive.part-* > /tmp/handoff.tar.gz
          test "$(wc -c < /tmp/handoff.tar.gz | tr -d ' ')" = "284325"
          echo "c08c0eab4c17bb32968c871162d61db7c1f84d5fe2555763a717f00de6c4298d  /tmp/handoff.tar.gz" | sha256sum -c -
          tar -xzf /tmp/handoff.tar.gz -C .
          test "$(wc -c < data/auction_history/continuation_collection.json | tr -d ' ')" = "1888630"
          test "$(wc -c < docs/historical-collection-recovery-2026-10-24.md | tr -d ' ')" = "232297"
          echo "d54fa24e9b1d9655ef8fcd17813a7122097e3fc3cda143b1eb638bcbd695dffa  data/auction_history/continuation_collection.json" | sha256sum -c -
          echo "889bf6edbb852a51e95561c4356665ac1105f4bfc090036869d1665b530ca7a0  docs/historical-collection-recovery-2026-10-24.md" | sha256sum -c -
          jq empty data/auction_history/continuation_collection.json

      - name: Bank verified handoff and remove transport
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Auction Sniper History Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/auction_history/continuation_collection.json docs/historical-collection-recovery-2026-10-24.md
          git rm -r .github/handoff-repair .github/workflows/restore-handoff-metadata.yml
          git commit -m "Persist historical collection growth handoff [skip ci]"
          git push origin HEAD:main
