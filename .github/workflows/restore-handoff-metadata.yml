name: Restore complete historical handoff metadata

on:
  push:
    paths:
      - .github/handoff-repair/**
      - .github/workflows/restore-handoff-metadata.yml

permissions:
  contents: write

concurrency:
  group: restore-historical-handoff-metadata
  cancel-in-progress: false

jobs:
  restore:
    if: startsWith(github.event.head_commit.message, 'Bank historical auction lot records and restore complete handoff metadata')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore, verify and remove one-use repair payload
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/historical-handoff.tar.gz"
          cat .github/handoff-repair/archive.part-* > "$archive"
          echo '1c9678d8a4ba67b331addebedd8dc4f04b1f247f57ab4fbfbf27b927b8930e79  '"$archive" | sha256sum -c -
          tar -xzf "$archive"
          test "$(wc -c < data/auction_history/continuation_collection.json)" -eq 1880603
          test "$(wc -c < docs/historical-collection-recovery-2026-10-24.md)" -eq 228928
          echo '80c95d3207d82662cd6442028a6b3e9ee17bfcc799c75034c76b92bd49dfc849  data/auction_history/continuation_collection.json' | sha256sum -c -
          echo '9acc81de63ee68ff8f9bdc9ba144ce30f0aee21fc9f94eaf25f99103697253ed  docs/historical-collection-recovery-2026-10-24.md' | sha256sum -c -
          jq empty data/auction_history/continuation_collection.json
          git config user.name 'Auction Sniper Bot'
          git config user.email 'auction-sniper-bot@users.noreply.github.com'
          git add data/auction_history/continuation_collection.json docs/historical-collection-recovery-2026-10-24.md
          git rm -r .github/handoff-repair .github/workflows/restore-handoff-metadata.yml
          git commit -m 'Restore complete historical handoff metadata [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
