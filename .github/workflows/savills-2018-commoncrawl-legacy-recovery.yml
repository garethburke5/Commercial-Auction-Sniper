name: Savills 2018 Common Crawl Legacy Recovery

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/savills-2018-commoncrawl-legacy-recovery.yml'
      - 'savills_2018_commoncrawl_legacy_recovery.py'

permissions:
  contents: write

concurrency:
  group: savills-2018-commoncrawl-legacy-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Compile Common Crawl recovery
        run: python -m py_compile savills_2018_commoncrawl_legacy_recovery.py
      - name: Run Common Crawl and legacy URL recovery
        run: python savills_2018_commoncrawl_legacy_recovery.py
      - name: Verify and preserve
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path('data/property_history.json').read_text())
          p=json.loads(Path('data/historical_backfill_progress.json').read_text())
          d=json.loads(Path('data/source_diagnostics/savills_2018_commoncrawl_legacy_recovery.json').read_text())
          s=p['sources']['Savills Auctions']; z=s['savills_2018_commoncrawl_legacy_last_run']
          c=sum(1 for e in h.get('auction_events',[]) if e.get('source')=='Savills Auctions')
          dates=sorted(str(e.get('auction_date')) for e in h.get('auction_events',[]) if e.get('source')=='Savills Auctions' and e.get('auction_date'))
          print('SAVILLS_EVENTS',c)
          print('OLDEST_VERIFIED',dates[0] if dates else None)
          print('COMMERCIAL_MIXED_CLUES',z.get('commercial_mixed_clues_considered'))
          print('CC_COLLECTIONS',z.get('commoncrawl_collections_2017_2019'))
          print('FIRST_PARTY_URLS',z.get('first_party_legacy_urls_discovered'))
          print('CANDIDATES_PROBED',z.get('candidate_urls_probed'))
          print('POSTCODE_PAGES',z.get('pages_with_postcodes'))
          print('MATCHES',z.get('deterministic_location_plus_lot_matches'))
          assert s.get('historically_complete') is False
          assert s.get('discovery_exhausted') is False
          assert z.get('route')=='savills-2018-commoncrawl-first-party-legacy-auc-pid-url-recovery'
          assert z.get('commercial_mixed_clues_considered')==94
          PY
          cp data/property_history.json /tmp/history.json
          cp data/historical_backfill_progress.json /tmp/progress.json
          cp data/source_diagnostics/savills_2018_commoncrawl_legacy_recovery.json /tmp/diag.json
      - name: Publish conflict-safe
        run: |
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/history.json data/property_history.json
            cp /tmp/diag.json data/source_diagnostics/savills_2018_commoncrawl_legacy_recovery.json
            python - <<'PY'
          import json
          from pathlib import Path
          fp=Path('data/historical_backfill_progress.json')
          fresh=json.loads(fp.read_text()); rec=json.loads(Path('/tmp/progress.json').read_text())
          fs=fresh.setdefault('sources',{}).setdefault('Savills Auctions',{}); rs=rec['sources']['Savills Auctions']
          for k in ('savills_2018_commoncrawl_legacy_last_run','savills_2018_commoncrawl_legacy_last_blocker','last_discovery_mode','status'):
              if k in rs: fs[k]=rs[k]
          fs['historically_complete']=False; fs['discovery_exhausted']=False
          fresh['updated_at']=rec.get('updated_at',fresh.get('updated_at'))
          fp.write_text(json.dumps(fresh,indent=2,ensure_ascii=False))
          PY
            git add data/property_history.json data/historical_backfill_progress.json data/source_diagnostics/savills_2018_commoncrawl_legacy_recovery.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Persist Savills Common Crawl legacy recovery'
            if git push origin HEAD:main; then exit 0; fi
            git reset --hard HEAD~1
            sleep $((attempt*3))
          done
          exit 1
