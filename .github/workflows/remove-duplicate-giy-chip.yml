name: Remove duplicate GIY chip

on:
  push:
    paths:
      - '.github/workflows/remove-duplicate-giy-chip.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove duplicate GIY chip only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py')
          s=p.read_text(encoding='utf-8')
          old='        y=100*p["rent"]/p["guide"]; f["GIY at guide"]=f"{y:.1f}%"; f["10% ceiling"]=f\'£{p["rent"]/0.10:,.0f}\'; chips.append(f"{y:.1f}% GIY")\n'
          new='        y=100*p["rent"]/p["guide"]; f["GIY at guide"]=f"{y:.1f}%"; f["10% ceiling"]=f\'£{p["rent"]/0.10:,.0f}\'\n'
          if old not in s:
              raise SystemExit('GIY chip anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile app.py
          python - <<'PY'
          from pathlib import Path
          s=Path('app.py').read_text(encoding='utf-8')
          assert 'chips.append(f"{y:.1f}% GIY")' not in s
          assert 'f["GIY at guide"]' in s
          assert 'chips.append(f\'RELETTING {rel["label"]}\')' in s
          print('GIY metric retained; duplicate GIY chip removed; other chips preserved')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Remove duplicate GIY card chip"
          git push
