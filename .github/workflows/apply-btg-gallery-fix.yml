name: Apply BTG gallery fix
on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/apply-btg-gallery-fix.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - name: Apply and test BTG/Pugh gallery repair
        run: python scripts/apply_btg_gallery_fix.py
      - name: Commit fix
        run: |
          git config user.name "Auction Sniper Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet && exit 0
          git commit -m "Fix BTG/Pugh exact gallery image selection"
          git push origin develop
