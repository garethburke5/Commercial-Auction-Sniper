name: Savills First-Party Sitemap Commission Discovery

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/savills-firstparty-sitemap-commission-discovery.yml'
      - 'savills_firstparty_sitemap_commission_discovery.py'

permissions:
  contents: write

concurrency:
  group: savills-firstparty-sitemap-commission-discovery
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python -m py_compile savills_firstparty_sitemap_commission_discovery.py
      - name: Discover first-party commission IDs and catalogue slugs
        run: python savills_firstparty_sitemap_commission_discovery.py
      - name: Verify and preserve
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/source_diagnostics/savills_firstparty_sitemap_commission_discovery.json').read_text())
          p=json.loads(Path('data/historical_backfill_progress.json').read_text())
          print('RESOURCES_FETCHED',d.get('resources_fetched'))
          print('URLS_DISCOVERED',d.get('savills_urls_discovered'))
          print('COMMISSION_IDS',d.get('commission_ids'))
          print('ID_MIN',d.get('commission_id_min'))
          print('ID_MAX',d.get('commission_id_max'))
          print('AUCTION_SLUGS',d.get('auction_slug_urls'))
          assert p['sources']['Savills Auctions'].get('historically_complete') is False
          PY
          cp data/historical_backfill_progress.json /tmp/progress.json
          cp data/source_diagnostics/savills_firstparty_sitemap_commission_discovery.json /tmp/diag.json
      - name: Publish conflict-safe
        run: |
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/diag.json data/source_diagnostics/savills_firstparty_sitemap_commission_discovery.json
            python - <<'PY'
          import json
          from pathlib import Path
          fp=Path('data/historical_backfill_progress.json')
          fresh=json.loads(fp.read_text());rec=json.loads(Path('/tmp/progress.json').read_text())
          fs=fresh.setdefault('sources',{}).setdefault('Savills Auctions',{});rs=rec['sources']['Savills Auctions']
          for k in ('savills_firstparty_sitemap_commission_last_run','savills_firstparty_sitemap_commission_last_blocker','last_discovery_mode'):
              if k in rs:fs[k]=rs[k]
          fs['historically_complete']=False;fs['discovery_exhausted']=False
          fresh['updated_at']=rec.get('updated_at',fresh.get('updated_at'))
          fp.write_text(json.dumps(fresh,indent=2,ensure_ascii=False))
          PY
            git add data/historical_backfill_progress.json data/source_diagnostics/savills_firstparty_sitemap_commission_discovery.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Persist Savills first-party commission discovery'
            if git push origin HEAD:main; then exit 0; fi
            git reset --hard HEAD~1
            sleep $((attempt*3))
          done
          exit 1
