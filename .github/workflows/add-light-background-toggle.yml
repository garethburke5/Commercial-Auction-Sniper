name: Add light background toggle
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-light-background-toggle.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Add theme toggle
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py')
          s=p.read_text(encoding='utf-8')

          marker='# ---------------- UI ----------------\n'
          insert='''# ---------------- UI ----------------\n# Theme preference lives in session state so it is available before CSS is rendered.\nif "light_mode" not in st.session_state:\n    st.session_state["light_mode"] = False\nLIGHT_MODE = bool(st.session_state.get("light_mode", False))\n'''
          if marker not in s:
              raise SystemExit('UI marker not found')
          s=s.replace(marker,insert,1)

          css_end='''</style>\n""",unsafe_allow_html=True)\n\n@st.cache_data(ttl=1800,show_spinner=False)'''
          light='''</style>\n""",unsafe_allow_html=True)\n\nif LIGHT_MODE:\n    st.markdown("""\n    <style>\n    .stApp{background:#f4f6f8!important;color:#15202b!important}\n    .block-container{color:#15202b!important}\n    .hero{background:linear-gradient(115deg,#ffffff 0%,#f7f8fa 100%)!important;border-color:#cbd5e1!important;box-shadow:0 4px 14px rgba(15,23,42,.08)!important}\n    .brand{color:#111827!important;text-shadow:none!important}.brand b{color:#b88700!important}\n    .tagline{color:#334155!important}.sub{color:#64748b!important}\n    .badge{background:#eefaf3!important;border-color:#84c99f!important;color:#17633a!important}\n    .card{background:#ffffff!important;border-color:#d4dce6!important;box-shadow:0 4px 14px rgba(15,23,42,.07)!important}\n    .card:hover{border-color:#94a3b8!important;box-shadow:0 9px 20px rgba(15,23,42,.11)!important}\n    .preview,.noimg{background:#e9edf2!important}.noimg{color:#64748b!important}\n    .src{color:#9a7200!important}.addr{color:#111827!important}\n    .metric{background:#f5f7fa!important;border-color:#d8e0e9!important}.metric span{color:#64748b!important}.metric b{color:#111827!important}\n    .yieldMetric{background:#edf8f1!important;border-color:#bddfc9!important}.yieldMetric b{color:#17633a!important}\n    .meta{color:#64748b!important}.chip{background:#eef2f6!important;border-color:#cbd5e1!important;color:#334155!important}\n    .analysis{border-top-color:#d8e0e9!important}.analysis summary{color:#334155!important}\n    .fact{background:#f8fafc!important;border-color:#d8e0e9!important}.fact span{color:#64748b!important}.fact b{color:#172033!important}\n    .iread{background:#fffbea!important;border-left-color:#c79b12!important}.iread span{color:#9a7200!important}.iread p{color:#334155!important}\n    .research a,.mapAction,.historyAction a{background:#f5f7fa!important;border-color:#cbd5e1!important;color:#334155!important}\n    .filterToolbarLabel,.yieldIntegratedLabel.left{background:#ffffff!important;border-color:#cbd5e1!important;color:#334155!important}\n    div[data-testid="stExpander"]{background:#ffffff!important;border-color:#d4dce6!important}\n    div[data-testid="stExpander"]:has(input[aria-label="Area / town / postcode"]){background:#ffffff!important;border-color:#d4dce6!important}\n    div[data-testid="stNumberInput"] label p{color:#334155!important}\n    div[data-testid="stTabs"] button{color:#334155!important}\n    </style>\n    """, unsafe_allow_html=True)\n\n@st.cache_data(ttl=1800,show_spinner=False)'''
          if css_end not in s:
              raise SystemExit('CSS end marker not found')
          s=s.replace(css_end,light,1)

          toolbar='''tool_a,tool_b,tool_yield_label,tool_yield,tool_space=st.columns([1.05,1.15,.38,.58,3.80],gap=None)'''
          if toolbar not in s:
              raise SystemExit('toolbar marker not found')
          # Keep the existing spacing but use the final column for the explicit theme option.
          s=s.replace(toolbar,toolbar,1)

          yield_block='''with tool_yield:\n    target_yield=st.number_input(\n        "Target yield (%)",\n        min_value=1.0,max_value=30.0,value=10.0,step=.5,format="%.1f",\n        help="Target yield — changes the max purchase price on every rented property",\n        label_visibility="collapsed"\n    )\n\n\n# Nonblocking full-width filter panel.'''
          yield_new='''with tool_yield:\n    target_yield=st.number_input(\n        "Target yield (%)",\n        min_value=1.0,max_value=30.0,value=10.0,step=.5,format="%.1f",\n        help="Target yield — changes the max purchase price on every rented property",\n        label_visibility="collapsed"\n    )\nwith tool_space:\n    st.toggle("☀️ White background", key="light_mode", help="Switch between the standard dark board and a light board")\n\n\n# Nonblocking full-width filter panel.'''
          if yield_block not in s:
              raise SystemExit('yield block marker not found')
          s=s.replace(yield_block,yield_new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Compile
        run: python -m py_compile app.py collector_enrichment.py
      - name: Verify theme and card safeguards
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('app.py').read_text(encoding='utf-8')
          assert 'LIGHT_MODE = bool(st.session_state.get("light_mode", False))' in s
          assert '☀️ White background' in s
          assert '.stApp{background:#f4f6f8!important' in s
          assert 'if len(self)==12:' in s
          assert '<span>Tenure</span>' in s
          print('theme and card safeguards OK')
          PY
      - name: Streamlit smoke test dark
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          at=AppTest.from_file('app.py',default_timeout=20).run()
          print('dark exceptions',len(at.exception))
          assert not at.exception
          PY
      - name: Commit production change
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add app.py
          git diff --cached --quiet || git commit -m 'Add white background display option'
          git push
