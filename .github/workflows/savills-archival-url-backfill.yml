name: Savills Archival URL Backfill

on:
  workflow_dispatch:
  schedule:
    - cron: '47 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/savills-archival-url-backfill.yml'
      - 'savills_cdx_adjacent_id_recovery.py'
      - 'savills_manifest_public_address_recovery.py'
      - 'savills_public_address_frontier_recovery.py'
      - 'savills_bing_rss_frontier_recovery.py'
      - 'savills_live_archive_backfill.py'
      - 'history_database.py'

permissions:
  contents: write

concurrency:
  group: auction-sniper-history
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile manifest-frontier recovery
        run: |
          python -m py_compile savills_cdx_adjacent_id_recovery.py savills_manifest_public_address_recovery.py savills_public_address_frontier_recovery.py savills_bing_rss_frontier_recovery.py history_database.py collectors/savills.py

      - name: Record canonical baseline and oldest unresolved manifest date
        id: frontier
        run: |
          python - <<'PY'
          import json, os
          from datetime import date
          from pathlib import Path
          db=json.loads(Path('data/property_history.json').read_text(encoding='utf-8'))
          manifest=json.loads(Path('data/source_diagnostics/savills_live_archive_manifest.json').read_text(encoding='utf-8'))
          events=[e for e in (db.get('auction_events') or []) if e.get('source')=='Savills Auctions']
          verified={str(e.get('auction_date'))[:10] for e in events if e.get('auction_date')}
          known=[]
          for page in manifest.get('pages') or []:
              for raw in page.get('dates') or []:
                  try:
                      d=date.fromisoformat(str(raw))
                  except ValueError:
                      continue
                  if d < date.today() and d.isoformat() not in verified:
                      known.append(d)
          assert known, 'No unresolved Savills manifest dates remain'
          frontier=min(known)
          baseline={'events':len(events),'frontier':frontier.isoformat(),'year':frontier.year}
          Path('/tmp/savills-archival-baseline.json').write_text(json.dumps(baseline),encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              print(f'frontier_date={frontier.isoformat()}',file=out)
              print(f'frontier_year={frontier.year}',file=out)
          print('BASELINE',baseline)
          PY

      - name: Run CDX adjacent-ID reconstruction for exact oldest frontier year
        continue-on-error: true
        run: |
          python savills_cdx_adjacent_id_recovery.py --year ${{ steps.frontier.outputs.frontier_year }} --radius 18 --max-exact-queries 420 --max-captures 320

      - name: Run DuckDuckGo public-result/address recovery at exact oldest frontier
        continue-on-error: true
        run: |
          python savills_manifest_public_address_recovery.py --max-source-pages 120 --max-clues 160 --max-live-checks 220

      - name: Run independent Bing RSS fallback at exact oldest frontier
        continue-on-error: true
        run: |
          python savills_bing_rss_frontier_recovery.py --max-pages 80 --max-clues 160 --max-live-checks 220

      - name: Validate strict canonical outcome
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse
          b=json.loads(Path('/tmp/savills-archival-baseline.json').read_text(encoding='utf-8'))
          db=json.loads(Path('data/property_history.json').read_text(encoding='utf-8'))
          p=json.loads(Path('data/historical_backfill_progress.json').read_text(encoding='utf-8'))
          events=[e for e in (db.get('auction_events') or []) if e.get('source')=='Savills Auctions']
          s=(p.get('sources') or {}).get('Savills Auctions') or {}
          assert events
          assert len({e.get('event_id') for e in events}) == len(events), 'Duplicate Savills event IDs'
          bad=[]
          for e in events:
              u=(e.get('source_evidence') or {}).get('listing_url') or ''
              host=(urlparse(u).hostname or '').lower()
              if host!='savills.co.uk' and not host.endswith('.savills.co.uk'):
                  bad.append(u)
          assert not bad, f'{len(bad)} Savills events lack first-party listing evidence'
          advanced=len(events)>int(b['events'])
          blockers=[
              s.get('bing_rss_frontier_last_blocker') or {},
              s.get('public_address_frontier_last_blocker') or {},
              s.get('cdx_adjacent_id_last_blocker') or {},
          ]
          blockers=[x for x in blockers if x]
          if not advanced:
              assert blockers, 'Strict outcome violated: no new events and no source-specific blocker'
              blocker=blockers[0]
              assert blocker.get('next_safe_route'), 'Persisted blocker lacks next safe route'
              assert str(blocker.get('frontier_date') or (blocker.get('frontier_dates') or [''])[0]).startswith(str(b['year'])), 'Blocker is not tied to oldest manifest frontier year'
          s['historically_complete']=False
          p['updated_at']=__import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat()
          Path('data/historical_backfill_progress.json').write_text(json.dumps(p,indent=2,ensure_ascii=False),encoding='utf-8')
          print('STRICT_OUTCOME',{'advanced':advanced,'events_before':b['events'],'events_after':len(events),'frontier':b['frontier'],'blockers':[x.get('route') for x in blockers]})
          PY

      - name: Publish verified history and progress
        run: |
          git config user.name 'Auction Sniper History Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/property_history.json data/historical_backfill_progress.json data/source_diagnostics
          if ! git diff --cached --quiet; then
            git commit -m 'Advance oldest Savills manifest frontier recovery'
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                exit 1
              fi
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
