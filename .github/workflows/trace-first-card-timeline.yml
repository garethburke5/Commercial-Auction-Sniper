name: Trace first-card render timeline
on:
  push:
    paths:
      - '.github/workflows/trace-first-card-timeline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Trace Streamlit output timing
        run: |
          python - <<'PY'
          import time, threading
          import streamlit as st
          from streamlit.testing.v1 import AppTest

          t0=time.perf_counter()
          events=[]
          lock=threading.Lock()

          def rec(kind,label=''):
              with lock:
                  events.append((time.perf_counter()-t0,kind,label[:160].replace('\n',' ')))

          orig_md=st.markdown
          def md(body,*a,**k):
              text=str(body)
              label=''
              if 'class="hero"' in text: label='HERO'
              elif 'class="cards"' in text: label='CARDS'
              elif 'statusrow' in text: label='SOURCE_STATUS'
              elif 'Capture audit' in text: label='CAPTURE_AUDIT'
              if label: rec('markdown-enter',label)
              out=orig_md(body,*a,**k)
              if label: rec('markdown-exit',label)
              return out
          st.markdown=md

          orig_df=st.dataframe
          def df(*a,**k):
              rec('dataframe-enter','SOURCE_AUDIT')
              out=orig_df(*a,**k)
              rec('dataframe-exit','SOURCE_AUDIT')
              return out
          st.dataframe=df

          rec('apptest','START')
          at=AppTest.from_file('app.py').run(timeout=60)
          rec('apptest','END')
          print('EXCEPTIONS',len(at.exception))
          for e in events:
              print(f'{e[0]:8.3f}s  {e[1]:18s} {e[2]}')
          if at.exception:
              raise SystemExit(at.exception)
          PY