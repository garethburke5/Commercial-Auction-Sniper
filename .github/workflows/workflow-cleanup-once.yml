name: Workflow cleanup once
on:
  push:
    paths:
      - 'scripts/workflow_cleanup_once.py'
      - '.github/workflows/workflow-cleanup-once.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Clean workflow fan-out
        run: python scripts/workflow_cleanup_once.py
      - name: Commit cleanup and remove one-off machinery
        run: |
          git config user.name "Auction Sniper Stabilisation Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/workflow-cleanup-once.yml scripts/workflow_cleanup_once.py
          git add .github/workflows
          git commit -m "Reduce workflow fan-out and isolate history"
          git pull --rebase origin main
          git push origin HEAD:main
