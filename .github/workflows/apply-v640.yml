name: Apply V6.40 inline yield label
on:
  push:
    paths:
      - '.github/workflows/apply-v640.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/apply_v640_inline_yield_label.py
      - run: python -m py_compile app.py
      - run: |
          git config user.name 'Auction Sniper Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app.py
          git diff --cached --quiet && exit 0
          git commit -m 'V6.40 align target yield label beside input'
          git push origin main
