name: Live Streamlit verify

on:
  workflow_dispatch:
  push:
    paths:
      - 'app.py'
      - 'legacy_app.py'
      - '.github/workflows/live-streamlit-verify.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify deployed Auction Sniper UI
        shell: bash
        run: |
          python - <<'PY'
          import time
          from playwright.sync_api import sync_playwright

          url='https://commercial-auction-sniper-ghihjbov2hgex6ci7zqklg.streamlit.app/'
          last=''
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(viewport={'width': 1440, 'height': 1200})
              for attempt in range(1, 5):
                  print('ATTEMPT', attempt)
                  try:
                      resp=page.goto(url, wait_until='domcontentloaded', timeout=45000)
                      print('HTTP', resp.status if resp else None)
                      page.wait_for_timeout(8000)
                      text=page.locator('body').inner_text(timeout=10000)
                      last=text[:5000]
                      cards=page.locator('.card').count()
                      print('BODY_TEXT_START')
                      print(last)
                      print('BODY_TEXT_END')
                      print('CARD_COUNT', cards)
                      print('TITLE', page.title())
                      page.screenshot(path='live-auction-sniper.png', full_page=True)
                      if 'Auction Sniper' in text and cards > 0:
                          print('LIVE_UI_OK')
                          browser.close()
                          raise SystemExit(0)
                  except Exception as e:
                      print('ERROR', repr(e))
                  time.sleep(15)
              browser.close()
          raise SystemExit('LIVE_UI_FAILED; last body text: '+last[:1000])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-auction-sniper-screenshot
          path: live-auction-sniper.png
