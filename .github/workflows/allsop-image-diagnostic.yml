name: Allsop Image Diagnostic
on:
  push:
    paths:
      - '.github/workflows/allsop-image-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 lxml
      - name: Inspect live Allsop mixed-use lot image markup
        run: |
          python - <<'PY'
          import re, requests
          from bs4 import BeautifulSoup
          url='https://www.allsop.co.uk/lot-overview/investment-freehold-well-located-five-storey-mixed-use-building-in-london/r260917-247'
          r=requests.get(url,headers={'User-Agent':'Mozilla/5.0'},timeout=30)
          print('STATUS',r.status_code,'LEN',len(r.text))
          s=BeautifulSoup(r.text,'lxml')
          for m in s.find_all('meta'):
              if (m.get('property') or m.get('name') or '').lower() in {'og:image','twitter:image','twitter:image:src'}:
                  print('META',m)
          for img in s.find_all('img')[:80]:
              attrs={k:v for k,v in img.attrs.items() if k in {'src','srcset','data-src','data-lazy-src','data-original','alt','class','loading'}}
              print('IMG',attrs)
          for tag in s.find_all(style=True):
              st=tag.get('style') or ''
              if 'url(' in st.lower(): print('STYLE',st[:1000])
          raw=r.text.replace('\\/','/')
          for pat in [r'https?://[^"\'<> ]+(?:jpg|jpeg|png|webp)(?:\?[^"\'<> ]*)?',r'/(?:media|uploads|images|image|umbraco|assets)/[^"\'<> ]+']:
              vals=[]
              for x in re.findall(pat,raw,re.I):
                  if x not in vals: vals.append(x)
              print('PATTERN',pat,'COUNT',len(vals))
              for x in vals[:100]: print('CAND',x)
          PY