<section class="upcoming-auctions" aria-labelledby="upcoming-heading"><div class="upcoming-heading"><h2 id="upcoming-heading">Upcoming auctions</h2><a class="textlink" href="{{ url('/auctions/') }}">Full calendar →</a></div><div class="upcoming-grid">{% for event in upcoming %}<article><h3>{{ event.source }}</h3><time datetime="{{ event.date }}">{{ uk_date(event.date) }}</time><p>{{ event.count }} captured commercial / mixed-use lot{{ 's' if event.count!=1 else '' }}</p><a class="textlink" href="{{ url(event.path) }}">View lots →</a></article>{% endfor %}</div></section>
